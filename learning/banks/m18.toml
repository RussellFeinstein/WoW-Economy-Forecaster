[[question]]
id = "m18-q09"
kind = "mcq"
prompt = """
You want a difference-in-differences estimate of the Season 2 start's effect on
raid consumables. Which control group is defensible given how this data and these
events are structured?
"""
answer = """
The control has to be another slice of the cross-section that shares the
background shocks but is not driven by the treatment. In this single-region,
global-event data, that means a different item category with no plausible link to
raid progression. Geography is not available as a control axis here.
"""
options = [
  { text = "An archetype category with no causal link to raiding (e.g. an unrelated trade good), checked for parallel pre-trends", correct = true },
  { text = "The same consumables on a different realm, left untreated as a control", note = "There is no untreated realm. Commodity AH is region-wide and every seed event is scope = GLOBAL, so the patch treats all realms at the same instant. This control does not exist in the data." },
  { text = "The same consumables during the previous expansion, used as a historical control", note = "A different expansion is a different market regime with different supply, recipes, and player base. It does not satisfy parallel trends with the current period; it is a different world, not a contemporaneous control." },
  { text = "Whatever category the seed file marks impact_direction = neutral for this event", note = "Tempting, but the seed direction is a hand-authored guess. Choosing the control from the same labels you are trying to validate assumes part of the answer. Pick the control on structural grounds, then verify pre-trends." },
]

[[question]]
id = "m18-q10"
kind = "mcq"
prompt = """
In an event-study specification you include lead indicators for the four weeks
before the effective date. Two of the pre-event lead coefficients come back
clearly positive and significant. What is the right reading?
"""
answer = """
Nonzero pre-event leads mean the two groups were already diverging (or the effect
started before your intervention date). Either way the clean-baseline assumption
is violated as specified, and here the most likely benign cause is anticipation:
prices moved on the announcement, ahead of the effective date.
"""
options = [
  { text = "The pre-trends diverge relative to this intervention date; parallel trends is suspect, and the likely cause is anticipation, so re-date the intervention to the announcement", correct = true },
  { text = "The event has a large effect; significant leads confirm the treatment is strong", note = "Leads are the pre-treatment period. A significant lead is evidence against the design, not for the effect. By construction nothing should have happened yet at a lead; that it did means your zero is wrong." },
  { text = "The model is overfit; drop the lead terms and report only the post dummy", note = "Removing the diagnostic does not fix the problem, it hides it. The leads are what tell you the baseline is contaminated; deleting them just lets you report a biased effect with a clean-looking table." },
  { text = "Nothing to worry about; pre-trends are expected to be noisy", note = "Noise is not the same as clearly positive and significant. Two consistent, significant leads is a signal, not noise, and the standard response is to investigate anticipation and re-date, not to wave it off." },
]

[[question]]
id = "m18-q11"
kind = "mcq"
prompt = """
What does interrupted time series on a single global-event series specifically
fail to rule out, that a difference-in-differences design is built to handle?
"""
answer = """
ITS on one series attributes everything changing at the intervention date to the
event, including contemporaneous shocks that hit all series. DiD subtracts a
control that felt those same shocks, differencing them out.
"""
options = [
  { text = "A contemporaneous shock (history): anything else that changed at the same date is absorbed into the ITS effect estimate", correct = true },
  { text = "Look-ahead bias: ITS could accidentally use future information in its features", note = "Look-ahead bias is handled upstream by announced_at / is_known_at, and is a feature-construction issue, not what distinguishes ITS from DiD. Both designs share the same leakage guard." },
  { text = "Autocorrelation in the daily price series", note = "Autocorrelation afflicts both ITS and DiD standard errors and is handled by the error model (Newey-West, ARIMA errors), not by switching to DiD. It is orthogonal to the history threat." },
  { text = "Measurement error in the recorded prices", note = "Noisy price observations are a data-quality problem present in both designs. DiD's advantage over ITS is a control for common time shocks, not cleaner measurement." },
]

[[question]]
id = "m18-q12"
kind = "mcq"
prompt = """
Someone reports: "the forecaster's MAE on consumables is only 6 percent across
the Season 2 start, so the model clearly captured the event's price effect."
What is wrong with using that as evidence of a causal effect?
"""
answer = """
Fit to the realized path is not an effect estimate. Low MAE says the model
tracked what happened; it says nothing about the counterfactual, and there is no
control condition anywhere in a forecast accuracy number.
"""
options = [
  { text = "MAE measures fit to the observed series, which already contains the event; a causal effect is the gap to an unobserved counterfactual, which MAE never estimates", correct = true },
  { text = "6 percent is too high to claim any effect was captured", note = "The magnitude of the MAE is beside the point. Even a 0 percent MAE would not be causal evidence, because perfect tracking of the realized path still has no counterfactual and no control." },
  { text = "The claim is fine, but only if the 28d horizon was used instead of 1d", note = "No horizon turns a forecast into a causal estimate. Changing the horizon changes what path you fit, not whether you have a counterfactual to compare against." },
  { text = "It is valid as long as the event features were leakage-safe", note = "Leakage-safety makes the forecast honest about what it knew; it does not convert prediction accuracy into an effect size. A clean forecast is still not a counterfactual comparison." },
]

[[question]]
id = "m18-q13"
kind = "mcq"
prompt = """
The impact seed for a season start uses lag_days = -3 for enchants. In causal
terms, what is that negative value asserting, and why does it depend on the
announcement/effective split existing?
"""
answer = """
Negative lag_days means the price effect begins before the event's effective
start_date: a pre-event run-up. That only makes sense if the information (the
announcement) predates the effective date, which is exactly what the two-column
split records.
"""
options = [
  { text = "The effect starts 3 days before start_date (anticipation run-up), which is only coherent because the announcement predates the effective date", correct = true },
  { text = "The event's data was recorded 3 days late and lag_days corrects the timestamp", note = "lag_days is a modeling parameter for when the price impact begins relative to the event, not a data-entry correction. It is about market timing, not clock skew." },
  { text = "The effect lasts 3 days; negative just encodes a short duration", note = "Duration is duration_days, a separate field. lag_days is the offset of the impact's onset from start_date, and negative means before it, not shorter." },
  { text = "It flags the event as unannounced, so is_known_at returns False", note = "Announcement status is announced_at (null-or-not), handled in a different table. A negative lag_days says nothing about whether the event was announced; it places the impact's onset before the effective date." },
]

# ── Predict ──────────────────────────────────────────────────────────────────

[[question]]
id = "m18-q14"
kind = "predict"
prompt = """
An event has announced_at = 2024-08-19T17:00:00+00:00. Feature computation runs
for a row with obs_date = 2024-08-19. Per compute_event_features, as_of is set to
23:59:59 UTC on the obs_date. Is the event known for this row, and what would
change if the code used midnight (00:00:00) instead?
"""
answer = """
Known. is_known_at checks announced_at <= as_of, and 2024-08-19 17:00 is <=
2024-08-19 23:59:59, so the same-day announcement counts. The end-of-day boundary
is deliberate: it means an event revealed at any hour of the observation day is
treated as knowable by the end of that day, which matches how a trader could act
on it.

If as_of were midnight (00:00:00) at the start of the day, the 17:00 announcement
would be after as_of, so is_known_at would return False and the event would be
wrongly excluded from that day's features. The row would silently drop a fact the
market already had. This is the one-line design choice the module docstring calls
out, and getting it wrong shifts every same-day announcement by a day.
"""
options = [
  { text = "Known (17:00 <= 23:59:59); with a midnight boundary the same-day announcement would be excluded until the next day", correct = true },
  { text = "Not known, because the announcement is on the same day as the observation and same-day events are held out to be safe", note = "The opposite is true. End-of-day as_of is chosen precisely so a same-day announcement IS included. It is knowable by day's end; excluding it would understate what the market knew." },
  { text = "Known either way; the boundary hour does not affect a 17:00 announcement", note = "The hour matters. Against a midnight (00:00) as_of, 17:00 is later, so is_known_at would return False. The 23:59:59 choice is exactly what makes the same-day case land as known." },
  { text = "Known, and a midnight boundary would include it a day earlier", note = "A midnight boundary is earlier in the day, so it would exclude the 17:00 announcement, not include it sooner. It can never make a same-day 17:00 reveal known before its own timestamp." },
]
source = "wow_forecaster/features/event_features.py"
anchor = "an event announced on the same calendar day as an observation is correctly"

[[question]]
id = "m18-q15"
kind = "predict"
prompt = """
A researcher adds a Midnight expansion event to the seed file but leaves
announced_at as null (unknown announcement date). build-events and build-datasets
run. What happens to that event in the feature layer, and what does
days_until_major_event report for rows before its start_date?
"""
answer = """
The event vanishes from every feature. load_known_events filters on
announced_at IS NOT NULL at the SQL level, so a null-announcement event is never
even loaded (Layer 1). Even if it somehow reached Python, is_known_at returns
False for a null announced_at (Layer 2), so it would be filtered again. It
contributes to nothing: not event_active, not severity, not impact magnitude.

Consequently days_until_major_event for rows before its start_date does not count
it. If that event was the only upcoming major event, days_until_major_event stays
null and is_pre_event_window stays False, exactly as if the event did not exist.
This is the conservative default: an event with no known announcement date is
treated as unknowable rather than guessed at, which is safe for forecasting but
means a mis-entered null silently erases an event you meant to include.
"""
options = [
  { text = "Excluded entirely (Layer 1 SQL filter drops it); days_until_major_event ignores it, staying null if it was the only upcoming major event", correct = true },
  { text = "Included with announced_at treated as its start_date, so it becomes known on the day it starts", note = "No such fallback exists in code. load_known_events filters null-announcement rows out at the SQL WHERE clause. The docs suggest using start_date as announced_at when seeding, but that is a manual authoring step, not automatic." },
  { text = "Included but flagged low-confidence; is_pre_event_window still fires within 7 days", note = "There is no low-confidence path. A null announced_at is a hard exclude at two layers. The event cannot drive is_pre_event_window because it is never loaded." },
  { text = "build-events fails validation because announced_at is required", note = "announced_at is nullable on WoWEvent (datetime | None = None). A null is valid and simply means unknown; it does not fail the build, it silently removes the event from features." },
]
source = "wow_forecaster/features/event_features.py"
anchor = "WHERE announced_at IS NOT NULL"

[[question]]
id = "m18-q16"
kind = "predict"
prompt = """
You run an ITS but date the intervention at start_date (the effective date). The
event was announced three weeks earlier and consumable prices climbed steadily
across those three weeks. The pre-period baseline for your ITS is fit over the
month before start_date. What does the estimated level shift at start_date look
like, relative to the true announcement-driven effect?
"""
answer = """
Biased toward zero, and possibly negative. Your pre-period baseline is fit over
the three weeks where prices were already running up on the announcement, so the
extrapolated pre-trend is steep and starts from an already-elevated level. By the
effective date, most of the price move has already happened and is baked into the
baseline. The "jump" at start_date is measured against that inflated counterfactual,
so it looks small, flat, or even like a slight fall as the run-up plateaus or
mean-reverts.

The fix is to date the intervention at the announcement, or to model both the
announcement window and the effective date as separate segments. This is the whole
reason announced_at and start_date are stored separately: dating the intervention
at the wrong one silently absorbs the anticipation into the baseline and hides the
effect you are trying to measure.
"""
options = [
  { text = "Attenuated toward zero (or even wrong-signed): the anticipation run-up is inside the pre-period baseline, so little effect remains to measure at start_date", correct = true },
  { text = "Correctly estimated; ITS extrapolates the pre-trend, so the run-up is handled automatically", note = "Extrapolating a pre-trend that already contains the effect is the bug, not the fix. The counterfactual line inherits the run-up and predicts the elevated level, leaving no gap for the effect to show." },
  { text = "Overstated, because the steep pre-trend makes the post-period look even higher", note = "A steep upward pre-trend raises the extrapolated counterfactual, which shrinks the gap to the observed post-period. It biases the estimate down, not up." },
  { text = "Unaffected, because the level-shift term only cares about the value at start_date, not the pre-trend", note = "The level shift is measured relative to the fitted counterfactual at start_date, which is the pre-trend extrapolated forward. A contaminated pre-trend moves that reference, so the shift is very much affected." },
]

