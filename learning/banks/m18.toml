Find the assumption the event-feature module states about event scope, and
explain in one or two sentences what it forces on a difference-in-differences
design built on this data.
"""
rubric = [
  "Locate the 'All seed events are scope = GLOBAL' note in event_features.py (Assumptions section)",
  "GLOBAL scope plus region-wide commodity AH means every realm is treated simultaneously",
  "So there is no untreated geographic control; the control must be a different item category",
  "Realm-specific scoping is called out as not yet implemented",
]
answer = """
It is in the "Assumptions & simplifications" block of event_features.py: all seed
events are scope = GLOBAL, and realm-specific scoping is not yet implemented.

For a DiD, that removes geography as a control axis. A global event on a
region-wide commodity market treats every realm at the same instant, so you cannot
hold out an untreated realm. The control group has to come from the cross-section
of item categories instead: a category the event does not touch stands in as the
counterfactual for one it does. It also means any future region-level panel design
(EU/KR, per-realm BoE auctions) is net-new data work, which is why PLAN files it as
a ceiling item rather than a current option.
"""
source = "wow_forecaster/features/event_features.py"
anchor = "- All seed events are ``scope = GLOBAL``.  Realm-specific scoping is not yet"

[[question]]
id = "m18-q18"
kind = "find"
prompt = """
Find the single line in event_features.py that sets the per-row knowledge
boundary, and explain why the end-of-day choice (rather than midnight) is the
correct one for both the forecasting guard and any causal timing that keys on the
announcement.
"""
rubric = [
  "Locate the Layer 2 comment / as_of construction in compute_event_features (23:59:59 UTC on obs_date)",
  "End-of-day means an event announced at any hour of the obs_date is treated as known for that day",
  "Midnight would exclude same-day announcements, understating what the market knew",
  "The precise timestamp (datetime, not date) is what lets a 17:00 reveal be distinguished and dated correctly",
]
answer = """
The boundary is set in compute_event_features, where each row builds
as_of = datetime(obs_date, 23, 59, 59, tzinfo=UTC) under the comment naming it the
Layer 2 per-row is_known_at guard. is_known_at then compares announced_at <= as_of.

End-of-day is correct because an announcement can land at any hour of the
observation day, and by the day's close a trader could have acted on it. Setting
as_of to midnight at the start of the day would mark a 17:00 reveal as unknown for
its own day, understating the information set and shifting every same-day
announcement one day late. That matters for the forecasting guard (features would
omit fresh news) and for any causal design that dates the intervention at the
announcement: the datetime precision, not a bare date, is what lets you place a
17:00 reveal on the right side of the boundary and separate anticipation from the
effective-date effect.
"""
source = "wow_forecaster/features/event_features.py"
anchor = "# Layer 2: per-row is_known_at guard using end-of-day boundary."
