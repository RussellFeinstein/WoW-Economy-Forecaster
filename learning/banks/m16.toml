[[question]]
id = "m16-q15"
kind = "recall"
prompt = """
Interview version. "Your roadmap says M1 adds Diebold-Mariano and Wilcoxon tests.
Walk me through why you need both, and what has to be true before either number is
worth reporting." Give the ninety-second answer.
"""
rubric = [
  "The comparison is paired on fold/test_date so shared per-day difficulty cancels and you gain power",
  "DM tests equal expected loss on the mean of the differential, with a HAC variance for autocorrelation, and leans on a normal approximation",
  "Wilcoxon is the outlier-resistant fallback on the median difference when the differentials are heavy-tailed or non-normal, giving up magnitude for resistance to outliers",
  "Across 3 horizons and 4 baselines multiplicity applies to exploration, though 'beats all' is a self-correcting conjunction",
  "And the precondition: fix the leaked split and put LightGBM in the backtest loop, or the tests certify a contaminated, unmatched comparison",
]
answer = """
A version that lands:

"Comparing two forecasters, the comparison has to be paired. Both models predict the
same test dates, so I take the per-fold difference of their errors first: hard days
inflate both errors and cancel in the difference, which cuts the variance and gives
me power a comparison of two summary MAEs would not have. I run two tests on that
difference series because they fail differently. Diebold-Mariano asks whether the
mean loss differential is zero, using a Newey-West variance because forecast errors
at overlapping horizons are autocorrelated and the naive standard error would
understate the variance and over-reject. It leans on a normal approximation, so on a
short, spiky history with a few catastrophic folds I do not trust it alone. Wilcoxon
signed-rank is the outlier-resistant check: it ranks the differences, so one 1600-gold miss
becomes just the top rank instead of dominating the mean. It tests the median rather
than the mean and gives up magnitude information, so when the two disagree that tells
me whether the edge lives in the tail or the body.

Across three horizons and four baselines there are twelve comparisons, so exploratory
reporting needs a multiplicity correction, family-wise error runs near 46% at
five percent otherwise. My actual bar, beat all four baselines, is a conjunction that
is self-correcting and if anything under-powered, so the penalty applies to
cherry-picking, not to the 'beats all' claim.

And the honest part: none of this is worth running yet. The training holdout leaks by
the forecast horizon and the model is never in the backtest loop, so today a
significance test would perfectly certify a contaminated, unmatched number. Fix the
split, add LightGBM to the walk-forward loop, align the horizons, then the tests
measure what their math claims."

The last paragraph is the tell that you understand a significance test inherits the
validity of its inputs and cannot manufacture it.
"""
see_also = ["LESSONS.md", "PLAN.md", "docs/ROADMAP.md"]

