  "Useful because it validates the whole pairing-and-testing pipeline on real data before LightGBM exists, and it answers a real question (does mean-reversion beat the random walk?)",
]
answer = """
The rows live in backtest_fold_results, and the access pattern is already indexed:
idx_bt_results_archetype on (archetype_id, model_name, horizon_days). To pair two
baselines you self-join the table on the shared target keys, archetype_id,
realm_slug, horizon_days, and test_date, taking model_name = 'rolling_mean' on one
side and model_name = 'last_value' on the other. The two abs_error columns over the
matched keys are e_A,t and e_B,t; their difference is the d_t series a DM or Wilcoxon
test consumes. No LightGBM, no split fix: the baselines are all present today.

Why bother before the real comparison exists. Two reasons. First, it exercises the
entire pipeline, join, difference, HAC variance, p-value, on real fold data, so when
LightGBM finally lands you are dropping a known-good model into a known-good test
rather than debugging both at once. Second, it answers a question the baselines were
literally chosen to pose. models.py frames rolling_mean as "does mean-reversion beat
the random walk?" and day_of_week as "is weekly seasonality exploitable?" Those are
real hypotheses about WoW markets, and a paired test across archetypes would settle
them with evidence instead of intuition, which is worth having on its own.
"""
