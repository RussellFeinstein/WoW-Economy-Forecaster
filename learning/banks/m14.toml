[[question]]
id = "m14-q13"
kind = "mcq"
prompt = """
Both `run_hourly.bat` and the catch-up sync take `data/db/.hourly.lock`, and both
take over a lock older than 180 minutes. They differ on what to do when the lock
is fresh and held. What is the difference, and what is the reasoning?
"""
answer = """
The bat skips and exits 0. The sync waits, and if the wait runs out it raises
`TimeoutError` and the command exits nonzero.

The asymmetry follows from what each one loses by not running. A skipped hourly
run costs exactly one sample, and the next hour will come around in an hour. A
skipped catch-up leaves the entire backlog unrecovered, which after an overnight
outage is a whole night of hours that only the bucket still holds, and the bucket
expires them at 30 days. Same lock, same staleness rule, opposite default,
because the cost of a false skip is not symmetric.

The second half of the reasoning is louder than the first. An exit-0 skip is
precisely the shape of the 2026-04 outage: a failure path that returned success,
so Task Scheduler recorded green for 105 days while nothing was being captured.
The design rule that came out of that postmortem is that a component which
declines to do its job must say so through its exit code. Waiting and then
failing loudly satisfies it; skipping quietly does not.

Why a lock at all, when SQLite serializes writers itself: the bulk inserts here
run to hundreds of thousands of rows and can exceed the 30-second busy timeout,
so relying on SQLite's own serialization would surface as sporadic "database is
locked" errors mid-drain rather than as clean mutual exclusion.
"""
options = [
  { text = "The bat skips and exits 0; the sync waits up to `lock_wait_seconds` and then fails loudly, because a skipped catch-up loses a whole night and an exit-0 skip is what hid the 96-day outage", correct = true },
  { text = "The bat waits and the sync skips, because the hourly run is the one that must not be missed", note = "Backwards. The hourly run is the cheap one to miss: another comes in an hour. The catch-up is the expensive one, because the backlog it would have drained expires from the bucket at 30 days." },
  { text = "Both skip on a fresh lock; only the staleness takeover threshold differs", note = "The takeover threshold is identical at 180 minutes, and it is the fresh-lock behavior that differs. The `hourly_lock` docstring calls the waiting a deliberate difference from the bat." },
  { text = "The sync does not need the lock, since SQLite serializes writers through the busy timeout", note = "The bulk inserts run to hundreds of thousands of rows and can exceed the 30-second busy timeout, so SQLite's own serialization is not sufficient here. That is stated as the reason the lock is taken at all." },
]
source = "wow_forecaster/ingestion/cloud_sync.py"
anchor = "skips when the lock is fresh because a skipped hourly run costs one sample;"
see_also = ["docs/postmortem-2026-04-lock-outage.md"]

[[question]]
id = "m14-q14"
kind = "predict"
prompt = """
The `SNAPSHOT_S3_*` credentials are added to `.env` for the first time, after the
desktop has been off for twenty days. The bucket holds roughly 20 days of hourly
captures. You run `wowfc sync-snapshots` with no flags.

What actually gets drained?
"""
answer = """
About three days of it. The other seventeen days stay in the bucket, untouched
and unmentioned.

`max_backfill_days` defaults to 3, so with no `--since` the stage sets
`since = now - 3 days`, and `list_objects_since` walks one prefix per UTC date
from that date to today. That window holds between 72 and 96 hourly objects, and
selection keeps one per UTC hour. `max_objects_per_run` is 96, so on the default
lookback the cap does not actually bite: `over_limit` stays 0 and nothing is
reported as waiting. The cap is there for the run where you pass `--since` and
widen the window past four days.

The seventeen older days are not skipped, counted, or logged. They were never
listed, so no skip counter mentions them, and the next default run makes the same
three-day choice, so they do not drain themselves later either. Only an explicit
`--since` reaches them. The stage does clamp `since` forward to the retention
cutoff whatever you pass, since ingesting rows the pruner deletes on the next
hourly run is pointless and touches the ToS line.

The short default is about the machine rather than the code. On the first run
nothing is recorded as ingested, so an unbounded default would select every
object in the bucket: hundreds of objects at roughly 250,000 records each, in one
pass, on a desktop with a documented history of instability and two SQLite
corruption events under sustained multi-gigabyte writes. Losing seventeen days of
capturable history is bad. Corrupting the database that holds the rollups nothing
can regenerate is worse. So the longer recovery is an explicit `--since`, run
with someone watching: the operator has to choose it rather than trip into it.
"""
options = [
  { text = "Roughly the last three days, about 72 to 96 objects. The other seventeen days sit outside the default lookback, are never listed, and no later default run picks them up either", correct = true },
  { text = "The full twenty days, since nothing is recorded as ingested and every object is a candidate", note = "That is exactly the behavior `max_backfill_days = 3` exists to prevent. Hundreds of objects at ~250K records each in a single pass is the sustained multi-gigabyte write pattern that has corrupted this machine before." },
  { text = "Nothing, because objects older than `max_backfill_days` are treated as beyond retention", note = "Two separate bounds. `max_backfill_days` narrows the listing window; the retention cutoff is 30 days and clamps `since` forward. A 20-day-old capture is inside retention, just outside the default lookback." },
  { text = "The last three days, then the 96-object cap truncates the run and the remainder is logged as waiting for the next run", note = "The cap is real but does not bite here. Three days of hourly captures is at most 96 objects, so `over_limit` stays 0 and nothing is reported as waiting; the cap matters once `--since` widens the window. What is actually left behind in this scenario is the seventeen days that were never listed at all, and those are reported nowhere." },
]
source = "config/default.toml"
anchor = "max_backfill_days = 3"
see_also = ["wow_forecaster/pipeline/sync_stage.py"]

# ── The other half: protecting the derived history ────────────────────────────

[[question]]
id = "m14-q15"
kind = "recall"
prompt = """
`build_durable_db` copies each table's `CREATE` statement from the live
database's `sqlite_master` rather than calling `apply_schema()`. Explain the
concrete failure that forced this, and the second benefit it buys.
"""
rubric = [
  "The live `recommendation_outputs` carries migration-added columns (`score`, `score_components`, `category_tag`, `risk_level`) that `schema.py`'s DDL does not declare",
  "So `apply_schema()` builds a narrower table and `INSERT ... SELECT *` fails on the column count",
  "`ALTER TABLE ADD COLUMN` rewrites the stored `CREATE TABLE` text, so `sqlite_master` is always the true current shape",
  "Second benefit: any future table or migration is captured with no change to the backup code",
]
answer = """
The concrete failure is a column-count mismatch. `schema.py` declares the
original shape of `recommendation_outputs`; migrations 0003 and 0006 added
`score`, `score_components`, `category_tag`, and `risk_level` on top of it. Build
the destination table from `apply_schema()` and you get the narrow version, then
`INSERT INTO main.recommendation_outputs SELECT * FROM src.recommendation_outputs`
hands it four more columns than it has and raises.

The insight is that `ALTER TABLE ADD COLUMN` rewrites the `CREATE TABLE` text
stored in `sqlite_master`. So the DDL in the repo is the schema's history and
`sqlite_master` is its present tense. For anything that has to match the live
shape exactly, the live catalog is the source of truth and the checked-in DDL is
a starting point that migrations have since moved past.

The second benefit is that the backup stops needing maintenance. Add a table in
migration 0011 and it appears in the next backup with no code change here,
because the loop walks whatever `sqlite_master` reports. A backup that has to be
updated whenever the schema changes is a backup that will eventually be missing
the newest table, and you find out during a restore.

`bi_export.py` hits the same drift and works around it differently, with a
`PRAGMA table_info` probe. Two places in this repo have independently discovered
that the checked-in DDL is not the current schema, which is a reasonable argument
that the migration system should reconcile the two rather than every consumer
routing around it.
"""
source = "wow_forecaster/backup/durable_backup.py"
anchor = "ADD COLUMN`` updates the stored ``CREATE TABLE`` text, so ``sqlite_master`` is"
see_also = ["docs/db-backup.md"]

[[question]]
id = "m14-q16"
kind = "mcq"
prompt = """
`run_backup` orders its steps: build the `.db`, gzip it, prune old local copies,
then upload. Why is upload last?
"""
answer = """
So a failed upload still leaves a good local backup on disk, while the error
still propagates to a non-zero exit.

The pattern generalizes: do the part that cannot fail halfway first, and put the
network last. Upload is the only step that depends on something outside the
machine, so it is the only one that fails for reasons unrelated to the data. If
it ran first, or if a failure there aborted before the local write, a Cloudflare
outage would cost you the night's backup entirely rather than just its off-site
copy. Ordered this way, the worst outcome of an upload failure is one backup that
exists only locally, plus a red task in Task Scheduler telling you so.

Two related details in the same function. `keep_local` pruning also runs before
the upload, so local retention is enforced on a schedule that does not depend on
the network either. And the uncompressed `.db` is unlinked right after gzip, so
the only artifact left is the compressed one, which is what gets uploaded and
what `check-data-health --backup-stale-hours` stats for freshness.

The build itself has the matching property one level down: on any exception it
closes the connection and unlinks the partial output, so a failed build leaves no
truncated `.db` that a later staleness check would mistake for a real backup.
"""
options = [
  { text = "So a failed upload still leaves a good local `.db.gz`, while the error still surfaces as a non-zero exit", correct = true },
  { text = "So the object key can carry the compressed size, which is only known after gzip", note = "The key is built from the timestamp alone (`db_backups/YYYY/MM/DD/durable_<ts>Z.db.gz`) and carries no size. Ordering is about failure containment, not about what the key needs." },
  { text = "So `foreign_key_check` runs against the uploaded copy rather than the local one", note = "The check runs inside `build_durable_db`, on the freshly built file, before compression or upload. Validating after upload would mean a known-bad object had already been stored." },
  { text = "So the upload can be skipped when pruning finds a recent enough backup already present", note = "Pruning deletes all but the `keep_local` newest files and never influences whether the upload runs. `--no-upload` is the only thing that skips it." },
]
source = "wow_forecaster/backup/durable_backup.py"
anchor = "upload LAST — so a failed upload still leaves a good local backup and the"

[[question]]
id = "m14-q17"
kind = "find"
prompt = """
The durable backup excludes two tables from the data copy but still creates them.
Find them, say why the file is still a drop-in restore, and give the compliance
argument for keeping these backups past 30 days when the snapshot bucket expires
its objects at 30.
"""
rubric = [
  "`market_observations_raw` and `market_observations_normalized`",
  "Their schema is still copied, so the restored file opens as a complete database with those two tables empty",
  "They are the transient 30-day-retention tables, and the next hourly ingest refills them",
  "ToS 2.r governs raw API data; the durable tables are derived aggregates, and excluding the observation data means the backup carries no raw per-listing data at all",
  "Practical effect: the build never reads the multi-gigabyte tables, only their CREATE text",
]
answer = """
`EXCLUDED_TABLES` holds `market_observations_raw` and
`market_observations_normalized`. Their `CREATE` statements are still executed in
the destination, so the restored file has both tables present and empty. Restore
is a copy: gunzip, drop it at `data/db/wow_forecaster.db`, and the next hourly
ingest refills the observations. `schema_versions` comes across too, so
migrations do not re-run against an already-current schema.

The compliance argument is the part worth being precise about, because it is what
makes a permanent backup legal alongside a 30-day snapshot bucket. Blizzard API
ToS 2.r governs raw API data. The rollups, forecasts, recommendations, backtests
and drift snapshots are derived aggregates, not raw data, so retaining them past
30 days is fine. Excluding the two observation tables' data means the backup
carries no raw per-listing data at all, which is a stronger position than
arguing about aggregation thresholds: there is simply nothing raw in the file.

The practical effect is the reason the exclusion is safe to be enthusiastic
about. Those two tables are most of the ~9.7 GB live database. Skipping their
data means the build reads their `CREATE` text and nothing else, so the whole job
is 118 MB uncompressed, 31 MB gzipped, and under six seconds, and it never goes
near the sustained multi-gigabyte read/write pattern that has corrupted this
machine twice.

And it is the reason the backup matters at all. Once a day's raw ages past 30
days the pruner deletes it everywhere, local rows and bucket objects alike, so
the rollups become the only surviving record of that day and cannot be
regenerated. The cloud capture protects the input stream for 30 days; this
protects the derived history forever.
"""
source = "wow_forecaster/backup/durable_backup.py"
anchor = "the whole point of the backup is"
see_also = ["docs/db-backup.md"]

[[question]]
id = "m14-q18"
kind = "recall"
prompt = """
This layer runs on five distinct credentials across two clouds. Name them, say
which direction each one points, and explain why the Worker's GitHub PAT is
called out as different in kind from the rest.
"""
rubric = [
  "Blizzard OAuth2 client credentials: read access out to the data source, held as Actions secrets",
  "The capture workflow's bucket credentials: write access to the snapshots bucket, resolved by boto3 as `AWS_*` on the runner",
  "`SNAPSHOT_S3_*` on the desktop: a separate read-only token on the same bucket, named explicitly rather than `AWS_*`",
  "`BACKUP_S3_*`: its own scoped token on a different bucket entirely",
  "The `GH_PAT` grants control into GitHub rather than access out to a data source, so a leak lets someone trigger the workflow rather than read data",
]
answer = """
Five, and they are deliberately not shared.

Blizzard OAuth2 client credentials authenticate out to the data source. On the
runner they are Actions secrets; on the desktop they are in `.env`.

The capture workflow writes to the snapshots bucket. Its R2 token needs write
access, and boto3 resolves it from the standard `AWS_ACCESS_KEY_ID` and
`AWS_SECRET_ACCESS_KEY`, which is fine on a runner where nothing else competes
for those names.

The desktop reads the same bucket through `SNAPSHOT_S3_*`, a separate token
scoped read-only. Two reasons for the different names: a desktop may already
carry unrelated `AWS_*` credentials in its environment, and the drain has no
business being able to write to the bucket it is draining.

`BACKUP_S3_*` points at an entirely different bucket with its own scoped token.
Separate because the snapshots bucket's 30-day lifecycle rule would otherwise
delete the backups it is meant to preserve, which is a good reminder that a
lifecycle rule is a property of the bucket, not of the object you intended it
for.

The PAT is the odd one out and the doc says so plainly: it is the first
credential that grants control into GitHub rather than access out to a data
source. Everything else, if leaked, lets an attacker read auction prices that
are public anyway, or read a bucket of them. The PAT lets someone cause work to
happen inside the repo. It is mitigated by being fine-grained: scoped to this one
repo, with the Actions permission and nothing else, so the blast radius is
triggering this one workflow. It is stored as an encrypted Worker secret rather
than in a third-party cron service's config, which was the rejected alternative
for exactly this reason, and it expires within a year, which is a renewal
reminder rather than a hazard.
"""
source = "docs/cloud-capture.md"
anchor = "The PAT is the first credential that grants control"
see_also = ["cloud-trigger/README.md", "docs/db-backup.md"]
