[[question]]
id = "m08-q12"
kind = "mcq"
prompt = """
PLAN.md's CEILING section names conformal prediction as the end state, above
quantile regression. What does split conformal prediction actually guarantee?
"""
answer = """
Split conformal gives a finite-sample marginal coverage guarantee at the nominal
level, assuming exchangeability, using a calibration set held out from training.

The construction: fit any point predictor on the training set, compute
nonconformity scores (typically absolute residuals) on a separate calibration
set, take the appropriate empirical quantile of those scores, and build the
interval as prediction plus or minus that quantile. The guarantee is that over
repeated draws the interval covers at least the nominal rate, regardless of what
the underlying model is or whether it is any good. A terrible model still gets
valid intervals from conformal; they are just very wide, which is the honest
result.

Two qualifications matter for this repo.

The guarantee is marginal, not conditional. It holds averaged over the
population of forecasts, not for any particular archetype. Coverage on
consumables could be 60 percent and on gems 95 percent while the pooled number
sits at 80. Mondrian or group-conditional conformal partitions the calibration
set by category to address this, and here the natural partition is
`category_tag`, which the recommendation layer already carries.

Exchangeability fails for time series. Prices are serially dependent and the
distribution shifts across patches and expansions, which is the entire premise of
the project. So plain split conformal is approximate here, and the honest version
reaches for a time-series variant such as EnbPI or adaptive conformal inference,
where the quantile is updated online against recent coverage errors. That
adaptive family is a good fit for this system precisely because it corrects
itself when a patch shifts the regime.
"""
options = [
  { text = "A finite-sample marginal coverage guarantee at the nominal level, under exchangeability, using a held-out calibration set", correct = true },
  { text = "That every individual archetype's intervals cover at the nominal rate", note = "That is conditional coverage, which split conformal does not give. Coverage is guaranteed averaged over the population; per-series coverage can be far off in both directions. Group-conditional variants narrow the gap but do not close it." },
  { text = "That the point forecasts become more accurate, since the calibration step corrects the model", note = "Conformal wraps an existing predictor and never changes its predictions. It only decides how far around them to draw the interval. A bad model stays bad and gets honestly wide intervals." },
  { text = "Coverage without needing any held-out data, since the method is distribution-free", note = "Distribution-free refers to making no parametric assumption about the error distribution, not to needing no data. Split conformal requires a calibration set disjoint from training; using training residuals instead is exactly how you get overconfident intervals." },
]
source = "PLAN.md"
anchor = "  ceiling is conformal intervals with measured empirical coverage, so the stated"

[[question]]
id = "m08-q13"
kind = "mcq"
prompt = """
You have one afternoon and can do exactly one of these. Which produces the most
information about whether this system's uncertainty is any good?
"""
answer = """
Measure coverage of the intervals you already have, per horizon, against realized
prices. That is one query joining `forecast_outputs` to the daily rollups on
target date, and the answer is the first fact anyone has ever had about these
intervals.

Every alternative changes the intervals before knowing anything about them. That
is the pattern this repo already got burned by: PLAN.md's DS-2 finding is that a
baseline harness was built and never run, so a stated acceptance bar went
unmeasured for the project's entire life. Replacing an unmeasured heuristic with
an unmeasured quantile model is the same shape of mistake with more work
attached.

There is a practical argument too. Roughly 305 thousand forecasts have already
matured. The measurement is retrospective and instant. Any modeling change has to
wait 28 days for its longest horizon to mature before it can be evaluated at all,
so measuring first also costs you nothing in schedule.
"""
options = [
  { text = "Join forecast_outputs to rollup actuals on target_date and compute the fraction of actuals inside the stored interval, split by horizon", correct = true },
  { text = "Swap the heuristic for quantile regression at alpha 0.10 and 0.90", note = "A real improvement that you will not be able to defend. With no before number, you cannot say the new intervals are better, only that they are different. Do the measurement first and the same work becomes a result." },
  { text = "Raise confidence_pct from 0.80 to 0.95, since the intervals are probably too narrow", note = "This changes z from 1.280 to 1.960, widening everything by 53 percent, on a hunch. The sign of the miscalibration is unknown: the 20 percent fallback and the cold-start widening push the other way. Widening a possibly-too-wide interval makes things worse and looks like a fix." },
  { text = "Remove the 10x cap, since it is the least defensible line in the function", note = "Defensible instinct, wrong order. The cap binds on the worst rows, so removing it changes the reported bounds on exactly the population you understand least, still without telling you whether the base width was right." },
]
see_also = ["PLAN.md", "docs/ROADMAP.md"]

# ── Downstream: what consumes the interval ───────────────────────────────────

[[question]]
id = "m08-q14"
kind = "recall"
prompt = """
`predictor.py` widens the interval by the drift-derived `uncertainty_multiplier`
after `compute_confidence_interval` returns. Two things about that block are
subtly wrong. Name them, plus the conceptual objection to the multiplier itself.
"""
rubric = [
  "It recentres on (ci_upper + ci_lower) / 2, which is not the prediction whenever the floor, the cap or the max(0.0, ...) clip made the interval asymmetric",
  "So widening also translates the interval away from the point forecast, rather than just scaling it",
  "The current-price floor and the 10x cap are not reapplied afterwards, so widening can push the upper bound back past the cap the previous step just enforced",
  "And the multiplier is keyed to feature drift severity, not to measured forecast error, so it is an uncertainty proxy stacked on an uncertainty proxy",
]
answer = """
The block computes `ci_half` and `center` from the returned bounds, scales the
half-width, and rebuilds the interval around that centre.

**It recentres on the wrong point.** The interval returned by
`compute_confidence_interval` is symmetric around `predicted` only when nothing
clipped it. `lower = max(0.0, predicted - ci_half)` breaks symmetry whenever the
half-width exceeds the prediction, and the current-price floor and 10x cap break
it whenever they bind. In all those cases the midpoint sits above or below the
prediction, and multiplying the half-width around that midpoint slides the whole
interval further from the point forecast. Scaling around `predicted` instead
would be a one-token change.

**It undoes the cap it just applied.** The floor and cap live inside
`compute_confidence_interval`; the widening happens after the call and reapplies
only `max(0.0, ...)` on the lower bound. So a CRITICAL drift multiplier of 3.0
can push `confidence_upper` well past 10x the current price, which is the exact
bound the previous step existed to enforce. Two guards, opposite directions, no
one reconciling them.

**And the multiplier answers to the wrong signal.** It comes from
`monitoring/drift.py` via `adaptive.py`, whose policy table maps drift severity
to 1.0 / 1.25 / 1.5 / 2.0 / 3.0. Drift there is a z-score on feature
distributions, plus an error-drift component that PLAN.md's DS-3 shows is
computed against a pooled blend of all four baselines with no model filter. So
the widening factor is a guess about degradation, applied to a heuristic that was
already a guess about spread. Neither guess has been checked against an outcome.

Worth reading `adaptive.py`'s own docstring next to this. It says the multiplier
is "applied to the uncertainty_penalty component in the recommendation scorer".
Grep the scorer: it never sees the multiplier. The effect reaches the scorer
indirectly, through the widened interval that `scorer.py` divides by
`forecast_price` to get `uncertainty_pct`. The docstring describes the intent one
step removed from where the code does the work.
"""
source = "wow_forecaster/ml/predictor.py"
anchor = "                center   = (ci_upper + ci_lower) / 2.0"
see_also = ["wow_forecaster/monitoring/adaptive.py", "PLAN.md"]

[[question]]
id = "m08-q15"
kind = "find"
prompt = """
`fetch_tsm_export_items` filters on `ci_quality = 'good'` and its docstring says
that excludes forecasts with extreme CI clamping. Follow the `ci_quality` value
back to where item-level forecasts are built. What does the filter actually
exclude?
"""
rubric = [
  "Nothing. Every item-level forecast has ci_quality = 'good'",
  "_generate_item_forecasts in pipeline/forecast.py constructs ForecastOutput without passing ci_quality",
  "ForecastOutput declares `ci_quality: CiQuality = \"good\"` as its default, and the forecast_outputs column also defaults to 'good'",
  "The TSM query restricts to item_id IS NOT NULL AND archetype_id IS NULL, which is exactly the population where the field was never computed",
]
answer = """
The filter excludes nothing.

`classify_ci_quality` is called in exactly one place, `predictor.py`, on
archetype-level forecasts. Item-level forecasts take a different path:
`_generate_item_forecasts` in `pipeline/forecast.py` scales the archetype's
bounds by the item's price ratio and builds a `ForecastOutput` whose keyword list
ends at `features_hash=None`. `ci_quality` is never passed, so the field takes
its model default of `"good"`, and the column default in `forecast_outputs` is
`'good'` as well, so nothing downstream corrects it.

Now read the TSM query's filter conditions together. It selects rows where
`item_id IS NOT NULL AND archetype_id IS NULL`, which is precisely the population
that never had `ci_quality` computed, and then filters that population on
`ci_quality = 'good'`, which every one of those rows satisfies. The condition
appears twice in the SQL, in the inner grouping and again on the join, and both
occurrences are no-ops.

Two things worth carrying away.

A defaulted field looks identical to a computed field once it is in the database.
`SELECT ci_quality FROM forecast_outputs WHERE item_id IS NOT NULL` returns a
clean column of `good`, and there is no way to tell from the data that no
classifier ever ran. Making the default `NULL` or `'unknown'` instead of `'good'`
would have made the gap visible the first time anyone looked, and it matches a
principle the repo states elsewhere: PLAN.md's DS-3 finding is that
`drift.py` returning `NONE` for "cannot compute" hides the failure, while
`health.py` returning `unknown` does not. Same mistake, different module.

And the ratio scaling would in fact have preserved the classification anyway: it
multiplies `predicted`, `ci_lower` and `ci_upper` by the same factor, so the
relative width, which is all `classify_ci_quality` looks at, is unchanged. One
call to `classify_ci_quality` at the bottom of that loop would make the filter
real.
"""
source = "wow_forecaster/pipeline/forecast.py"
anchor = "                ci_lower = max(0.0, item_current * (arch_fc.confidence_lower / archetype_current))"
see_also = ["wow_forecaster/reporting/tsm_export.py", "wow_forecaster/models/forecast.py"]

[[question]]
id = "m08-q16"
kind = "predict"
prompt = """
The last drift check for realm `us` classified drift as HIGH. `ForecastStage`
reads the multiplier and passes it to `run_inference`. For one archetype,
`compute_confidence_interval` returned `(900.0, 1100.0)` around a prediction of
1000.0.

What is stored, and what `uncertainty_pct` and `risk_level` does the scorer
derive from it?
"""
answer = """
Stored: `(800.0, 1200.0)`. Derived: `uncertainty_pct = 0.40`,
`uncertainty_penalty = 40.0`, `risk_level = "low"` (assuming volatility does not
carry it higher).

The policy table in `adaptive.py` maps `"high"` to `(2.00, True)`: multiplier
2.0, retrain recommended. In `predictor.py`, `ci_half = (1100 - 900) / 2 = 100`
and `center = (1100 + 900) / 2 = 1000`, which here does equal the prediction
because nothing clamped this interval. `new_half = 200`, so the bounds become
800 and 1200.

Then `scorer.py`: `uncertainty_pct = ci_width / forecast_price = 400 / 1000 =
0.40`, and `uncertainty_penalty = clamp(0.40 * 100, 0, 100) = 40.0`.
`determine_risk_level` needs 0.50 for medium, so this stays low.

Follow the consequence through the score formula. The uncertainty penalty carries
a weight of 0.10, the smallest of the five components, so doubling the interval
width moved the total score by 2 points on a roughly 0 to 100 scale. Meanwhile
opportunity carries 0.35. A drift level that the policy table describes as
"substantial drift, model likely stale" barely moves the ranking. `determine_action`
only forces `avoid` at `uncertainty_pct >= 0.95`, so the recommendation is
unchanged too.

Whether that is right depends on a number nobody has. If the intervals are
roughly calibrated, a 0.10 weight on uncertainty is a defensible risk appetite.
If they are undercovering badly, then the one component that carries risk
information is both wrong and down-weighted.
"""
options = [
  { text = "(800.0, 1200.0); uncertainty_pct 0.40; risk_level low", correct = true },
  { text = "(700.0, 1300.0); uncertainty_pct 0.60; risk_level medium", note = "That is the multiplier 3.0, which the policy table assigns to CRITICAL. HIGH maps to 2.00. Reading the table one row off changes the interval by 50 percent." },
  { text = "(800.0, 1200.0); uncertainty_pct 0.40; risk_level medium", note = "The arithmetic is right and the threshold is not. determine_risk_level needs uncertainty_pct >= 0.50 or volatility_cv >= 0.50 for medium; 0.40 falls through to low." },
  { text = "(900.0, 1100.0) unchanged; the multiplier is applied to uncertainty_penalty in the scorer, not to the stored interval", note = "This is what adaptive.py's docstring says, and it is not what the code does. The scorer never receives the multiplier; predictor.py applies it to the interval itself and the penalty follows from the widened width." },
]
source = "wow_forecaster/monitoring/adaptive.py"
anchor = "  - 2.0  (HIGH):     Substantial drift.  Doubles uncertainty.  Most"
see_also = ["wow_forecaster/recommendations/scorer.py"]

[[question]]
id = "m08-q17"
kind = "find"
prompt = """
There are two separate 5 percent floors inside `compute_confidence_interval`.
Find both, say what quantity each one bounds, and explain why the module
docstring only documents one of them.
"""
rubric = [
  "_MIN_CI_FRAC = 0.05 floors the half-width at 5 percent of predicted, before the bounds are formed",
  "A bare 0.05 literal floors ci_lower at 5 percent of current_price, after the bounds are formed",
  "Different quantities (half-width vs lower bound) against different references (predicted vs current), sharing the number 0.05 by coincidence",
  "The docstring's numbered item 4 describes only the current-price floor, so the named constant and the documented floor are not the same thing",
]
answer = """
First floor: `min_half = _MIN_CI_FRAC * predicted`, then
`ci_half = max(ci_half, min_half)`. This bounds the half-width from below at 5
percent of the prediction, and it applies unconditionally. On its own it keeps the
total width at or above 10 percent of predicted, but only until the current-price
block runs after it. When the 10x cap or the current-price floor binds hard
against the opposite bound, the final re-clamp can still drive the width to zero
(q09 is the cap version). So the 10 percent minimum holds only when no current
price is passed, or when neither the floor nor the cap binds.

Second floor: `lower = max(lower, current_price * 0.05)`, inside the
`current_price is not None` block. This bounds the lower endpoint from below at 5
percent of the current market price, and it only runs when a current price was
passed.

Four differences between them: half-width versus endpoint, predicted versus
current price, unconditional versus conditional, and named constant versus magic
literal. They share the number 0.05 and nothing else. If someone tuned
`_MIN_CI_FRAC` to 0.02 tomorrow, the second floor would not move, and a reader
who assumed one constant governed both would be wrong about half the function.

The docstring's numbered list documents the second and not the first. Item 4
says the floor is on `ci_lower` relative to `current_price`, which is accurate
for the literal and silent about the constant. Meanwhile the comment above the
constant says "Minimum CI half-width as fraction of predicted price", which is
accurate about the constant. Both pieces of prose are correct and neither is
complete, so the only way to know there are two floors is to read the body.

Worth doing this find exercise deliberately rather than reading the answer,
because it is the ordinary case. Not a bug, not a dramatic defect, just two
things named the same in a reader's head that the code treats differently. That
is what most of the confusion in a codebase is made of.
"""
source = "wow_forecaster/ml/cold_start.py"
anchor = "    min_half = _MIN_CI_FRAC * predicted"

[[question]]
id = "m08-q18"
kind = "recall"
prompt = """
An interviewer says: "you ship a confidence interval with every forecast. How do
you know it is right?" Give the ninety-second answer.
"""
rubric = [
  "Say plainly that it is not validated: the interval is heuristic and coverage has never been measured",
  "Describe the construction in one breath: z times a 7-day rolling std of the price level, cold-start widening, a 5 percent floor and a 10x cap",
  "Name the two structural problems: it uses level dispersion rather than forecast error, and it does not scale with the horizon",
  "Say what fixes it and in what order: the realization ledger measures coverage first, then quantile regression, then conformal with measured coverage",
  "Name where the wrong interval propagates: uncertainty_pct feeds the risk level and 10 percent of the recommendation score",
]
answer = """
A version that lands:

"It is not right, and I can tell you exactly how wrong it is allowed to be. The
interval is a heuristic. We take a z value for the configured 80 percent level,
multiply it by the 7-day rolling standard deviation of the archetype's daily mean
price, widen it for cold-start archetypes in proportion to how confident we are
in the transfer mapping, then floor the half-width at 5 percent of the prediction
and cap the upper bound at 10 times the current market price so the numbers do
not read as broken.

Two things are structurally wrong with that. It uses the dispersion of the price
level as a stand-in for the dispersion of our forecast error, so it cannot see
model bias at all: a model that runs consistently 10 percent high still gets a
neat symmetric interval around the biased number. And it takes no horizon
argument, so our 28-day interval is the same width as our 1-day interval, when
error variance should be growing roughly with the square root of the horizon.

What I have not done is measure coverage, which is the only thing that would
settle it: the fraction of realized prices that landed inside their own interval.
Nothing in the repo computes it today. The backtest harness cannot, because its
prediction record carries actuals and point predictions and no bounds. That is
the first item on the model-validation milestone, and it is retrospective, so
about 305 thousand already-matured forecasts become scoreable the day the ledger
table lands.

Then the sequence is quantile regression, which makes the bounds a learned
function of the features and fixes the horizon problem for free, and above that
conformal intervals, where you get a coverage guarantee instead of an assertion.

The reason I care about the order is that the interval is not decoration. Its
width becomes `uncertainty_pct`, which sets the risk level on every
recommendation and carries 10 percent of the ranking score. So an uncalibrated
interval is not a cosmetic problem, it is a wrong risk label on every row."

The part that separates a good answer from a defensive one is volunteering the
number you do not have, and saying what would produce it.
"""
source = "wow_forecaster/ml/cold_start.py"
anchor = "CIs produced here are HEURISTIC, not model-derived.  They do NOT come from"
see_also = ["PLAN.md#CEILING", "docs/ROADMAP.md"]
