# M08: Uncertainty.
#
# Citation rule: `source` is a path, `anchor` is a verbatim single-line snippet
# from that path. Never a line number. tests/test_learning/test_bank_integrity.py
# fails if an anchor stops matching, so editing the cited code forces the
# question to be updated in the same PR. Run `wowfc learn validate` while
# authoring.
#
# The through-line: every forecast in this system ships an interval, no interval
# has ever been scored against an outcome, and the word "80%" in the config is a
# label rather than a measurement.

# ── What the interval is actually made of ─────────────────────────────────────

[[question]]
id = "m08-q01"
kind = "recall"
prompt = """
Walk the full path that turns a LightGBM point prediction into the
`confidence_lower` and `confidence_upper` values stored in `forecast_outputs`.
Name every step in order, including the ones outside `cold_start.py`.
"""
rubric = [
  "z comes from _Z_LOOKUP keyed on confidence_pct (1.28 at 0.80), falling back to 1.28 for any level not in the table",
  "half-width = z x price_roll_std_7d, or 20 percent of predicted when the rolling std is None or zero",
  "cold-start rows multiply the half-width by 1.5 / transfer_confidence, or by 3.0 when no mapping exists",
  "then a 5 percent-of-predicted floor on the half-width, bounds around predicted, then a 5 percent-of-current floor on lower and a 10x-of-current cap on upper",
  "predictor.py then applies the drift uncertainty_multiplier and classifies the result with classify_ci_quality",
]
answer = """
Seven steps, and only one of them involves anything the model learned.

1. `z = _Z_LOOKUP.get(confidence_pct, _DEFAULT_Z)`. At the configured 0.80 that
   is 1.280. Any confidence level not in the five-entry table silently falls back
   to 1.280, so a config of 0.85 would produce an interval labelled 85 percent
   and built from the 80 percent z.
2. `ci_half = z * rolling_std_7d` when `price_roll_std_7d` is present and above
   zero. That is the rolling standard deviation of the daily `price_mean` over
   the past seven calendar days: a property of the price series, computed in the
   feature builder, never a property of the model's errors.
3. Otherwise `ci_half = 0.20 * predicted`, a flat 20 percent.
4. Cold start widens: `1.5 / transfer_confidence`, or 3.0 flat with no mapping.
   At `transfer_confidence = 0.60` that is 2.5x.
5. Floor the half-width at 5 percent of predicted, then set
   `lower = max(0.0, predicted - ci_half)` and `upper = predicted + ci_half`.
6. If `current_price` was passed, raise `lower` to at least 5 percent of current,
   lower `upper` to at most 10x current, then re-clamp `lower` down to `upper` so
   the invariant survives.
7. Back in `predictor.py`, if the drift multiplier is not 1.0, recompute the
   half-width and centre from the clamped bounds and scale the half-width. Then
   `classify_ci_quality` labels the width good, wide or unreliable.

The thing to notice is what never appears in that list: the model, its residuals,
the horizon, and any realized outcome. The interval is a function of recent price
dispersion and some constants. The module docstring says so plainly rather than
hiding it, which is the right call, and it is also why this is the weakest part
of the modeling story in the whole repo.
"""
source = "wow_forecaster/ml/cold_start.py"
anchor = "CIs produced here are HEURISTIC, not model-derived.  They do NOT come from"
see_also = ["PLAN.md#CEILING"]

[[question]]
id = "m08-q02"
kind = "mcq"
prompt = """
`ci_half = z * rolling_std_7d`. State precisely what statistical quantity that
line is treating `price_roll_std_7d` as.
"""
answer = """
It treats the recent dispersion of the price level as if it were the standard
deviation of the model's h-step-ahead forecast error, and then assumes that error
is normal, unbiased, and symmetric around the prediction.

Three separate substitutions are packed into one multiplication.

First, dispersion of the level is not dispersion of the error. A series can be
extremely volatile and still be easy to forecast (a strong weekly cycle), or
almost flat and still get forecast badly (a slow drift the model does not
capture). Only residuals tell you which.

Second, the interval is centred on `predicted` and extends symmetrically. Any
systematic bias in the model shifts the true error distribution off centre, and a
symmetric interval built from level dispersion cannot see that. If the model runs
10 percent high on consumables, the interval keeps sitting neatly around the
biased prediction.

Third, auction house prices are positive and right-skewed. A symmetric interval
in gold is the wrong shape for that; a symmetric interval on the log price would
at least respect the support. The `max(0.0, ...)` on the lower bound is the code
noticing this problem and clipping instead of fixing it.
"""
options = [
  { text = "The standard deviation of the model's h-step forecast error, assumed normal and unbiased", correct = true },
  { text = "The standard error of the prediction, estimated from the model's residuals", note = "No residual is involved anywhere in this path. compute_confidence_interval never sees an error, an actual, or a prediction from any earlier run. It reads one rolling feature off the inference row." },
  { text = "The variance of the LightGBM leaf values contributing to this prediction", note = "The default L2 objective produces a point estimate only, and lgbm_model.py never asks for per-leaf or per-tree spread. Nothing in the repo extracts a variance from the booster." },
  { text = "The spread of a bootstrap resample of the training set", note = "Nothing resamples. The value is price_roll_std_7d, computed once in features/lag_rolling.py from the last seven days of daily price_mean and carried through the inference Parquet." },
]
source = "wow_forecaster/ml/cold_start.py"
anchor = "        ci_half = z * rolling_std_7d"

[[question]]
id = "m08-q03"
kind = "predict"
prompt = """
An archetype has exactly one observation day inside the trailing 7-day window, so
`price_roll_std_7d` comes out as 0.0 (see the missing-data notes in
`features/lag_rolling.py`).

The row is not cold start. `predicted = 1000`, `current_price = 1000`,
`confidence_pct = 0.80`, drift multiplier 1.0.

What interval is stored, and what `ci_quality` does it get?
"""
answer = """
`(800.0, 1200.0)`, classified `"good"`.

The branch is `if rolling_std_7d is not None and rolling_std_7d > 0`. A std of
exactly 0.0 fails the second half of that test and drops into the fallback, so
`ci_half = 0.20 * 1000 = 200`. The 5 percent floor (50) does not bind. The
current-price floor (50) does not bind on a lower bound of 800, and the 10x cap
(10000) does not bind on 1200. Width is 400, which over a predicted 1000 is 0.40,
under the 0.50 threshold, so the label is `"good"`.

The `> 0` guard is the right instinct: a zero std here means "one data point",
not "this price never moves", and turning that into a zero-width interval would
be absurd. But look at where the guard lands. The thinnest evidence the system
can have, a single observation in a week, produces an interval that is labelled
good and, if this were an item-level forecast, would pass the TSM export filter.
The fallback is a constant. It cannot encode "we know almost nothing here"
because it does not depend on anything.

Contrast with a genuinely stable archetype observed all seven days: its std is
small but positive, `ci_half` collapses toward the 5 percent floor, and it also
scores `"good"`. Two opposite evidential situations, one label.
"""
options = [
  { text = "(800.0, 1200.0), ci_quality \"good\"", correct = true },
  { text = "(950.0, 1050.0), ci_quality \"good\"", note = "This is what you get if the zero std flows through as a zero half-width and only the 5 percent floor saves it. It does not: the `> 0` guard sends a std of 0.0 to the 20 percent fallback, and 200 beats the floor of 50." },
  { text = "(1000.0, 1000.0), ci_quality \"good\"", note = "A zero-width interval is exactly what the `rolling_std_7d > 0` guard exists to prevent. Without it, every thin series would report perfect certainty." },
  { text = "(800.0, 1200.0), ci_quality \"wide\"", note = "The arithmetic is right but the classification is not. classify_ci_quality compares (upper - lower) / predicted, which is 400 / 1000 = 0.40, and the good threshold is 0.50." },
]
source = "wow_forecaster/features/lag_rolling.py"
anchor = "- A window with exactly one non-None value produces that value for mean and 0.0 for std."
see_also = ["wow_forecaster/ml/cold_start.py"]

[[question]]
id = "m08-q04"
kind = "recall"
prompt = """
There is one argument `compute_confidence_interval` does not take, and its
absence is the single largest defect in the uncertainty story. Name it, say what
the code does as a result, and say what the interval width should scale with.
"""
rubric = [
  "It takes no horizon argument at all",
  "run_inference loops over horizons and passes the same price_roll_std_7d on every pass, so the 1d and 28d intervals come out the same width",
  "Forecast error variance grows with horizon: under a random walk the standard deviation scales like sigma x sqrt(h)",
  "So the 28d interval should be roughly sqrt(28) times the 1d one, about 5x wider, and it is not",
]
answer = """
`compute_confidence_interval` has no `horizon_days` parameter. Nothing in the
signature or the body knows whether it is describing tomorrow or four weeks out.

`run_inference` loops `for horizon_days, forecaster in forecasters.items()` and
calls the same function each time with the same `price_roll_std_7d` off the same
inference row. The only thing that differs between horizons is `predicted`, and
that only matters through the 5 percent floor and the 20 percent fallback, both
of which are proportions of the prediction rather than functions of time. So the
1d interval and the 28d interval come out essentially the same width, in a system
whose config sets `target_horizons_days = [1, 7, 28]`.

That is backwards in the most basic way. Forecast error accumulates. For a random
walk with per-step innovation standard deviation sigma, the h-step-ahead error
has standard deviation sigma x sqrt(h), so a 28-day interval should be about 5.3
times a 1-day interval. Under a trending or mean-reverting process the exponent
differs, but the direction never does: uncertainty about a further-away date is
larger.

Multiplying by sqrt(h) would be a real improvement and about four lines of work.
It would still be a heuristic. The honest sequence is: measure coverage per
horizon first, discover that the 1d intervals are probably too wide and the 28d
ones far too narrow, and let that measurement decide whether you reach for
sqrt(h) scaling or for quantile models. Guessing at a correction to an unmeasured
quantity just moves the guess.
"""
source = "wow_forecaster/ml/predictor.py"
anchor = "    for horizon_days, forecaster in forecasters.items():"
see_also = ["config/default.toml"]

# ── Coverage: the thing that is never measured ───────────────────────────────

[[question]]
id = "m08-q05"
kind = "recall"
prompt = """
Define empirical coverage for a set of forecast intervals. Then explain why an
interval can be honest, useful, and still fail on coverage in two opposite ways.
"""
rubric = [
  "Coverage is the fraction of realized outcomes that fell inside their own stated interval",
  "A calibrated 80 percent interval covers close to 80 percent over many forecasts, measured after the fact",
  "Undercoverage (say 55 percent) means the system is overconfident and its risk numbers understate the danger",
  "Overcoverage (say 98 percent) means the interval is so wide it excludes nothing and carries no information",
]
answer = """
Coverage is measured, not derived. Take every forecast that has matured, look up
the actual price on its target date, and count the fraction where
`confidence_lower <= actual <= confidence_upper`. For an interval labelled 80
percent, calibration means that fraction lands near 0.80 over a large enough
sample. Nothing about the interval's construction can tell you this. It is a
property of the pairing between intervals and outcomes.

Two failure directions, and both matter here.

Undercoverage is the dangerous one. If the stated 80 percent intervals actually
contain the truth 55 percent of the time, then every downstream consumer that
treats the interval as a risk statement is wrong in the direction that costs
money. In this repo the scorer derives `uncertainty_pct` from the interval width
and `determine_risk_level` turns that into low/medium/high/critical, so
undercoverage means the risk labels are systematically too calm.

Overcoverage is the useless one. An interval from 5 percent of current price to
10x current price covers almost everything, and correspondingly says almost
nothing. It would score 99 percent coverage and still be worthless, which is why
coverage alone is not the whole story: you report coverage alongside interval
width, and you want the narrowest interval that still hits its nominal rate.

Two numbers, always together. Coverage without width can be gamed by widening.
Width without coverage is what this repo currently reports.
"""
see_also = ["docs/ROADMAP.md"]

[[question]]
id = "m08-q06"
kind = "recall"
prompt = """
Give the concrete reasons a forecast from this system labelled `confidence_pct =
0.80` would not cover 80 percent of realized prices. Four is enough. Do not say
"because it is a heuristic": name mechanisms.
"""
rubric = [
  "It is built from dispersion of the price level, not from forecast error, so model bias is invisible to it",
  "It does not scale with the horizon, so at minimum the 1d and 28d intervals cannot both be right",
  "A normal z is used with a sample std from at most 7 daily points; the t value at 6 degrees of freedom is about 1.44, not 1.28",
  "The floor, the cap and the drift multiplier all move the endpoints for reasons that have nothing to do with a target probability",
  "And the sign of the total miscalibration is unknown, because nothing has ever measured it",
]
answer = """
Five mechanisms, running roughly from largest to smallest.

**Level dispersion is not error dispersion.** Covered in q02. This is first
because it means the interval cannot respond to the model being wrong, only to
the market being jumpy.

**No horizon term.** Covered in q04. Even if the 1d interval happened to be
calibrated, the 28d one built the same way cannot be.

**z where t belongs, on a tiny sample.** `price_roll_std_7d` is a sample standard
deviation from at most 7 daily observations, and often fewer. Plugging a sample
std into a normal quantile understates the spread. At 6 degrees of freedom the
two-sided 80 percent t value is about 1.44 against z of 1.28, so this alone
narrows the interval by roughly 11 percent. Small compared to the first two, but
it is a free correction that was not taken.

**Clamps that answer to presentation, not probability.** The 5 percent floor, the
10x cap and the drift multiplier each move an endpoint. None of them is derived
from a target coverage level. Once you multiply an interval by 2.0 because a
z-score drift check fired, whatever probabilistic claim the interval had is gone,
and the number 0.80 stored in `confidence_pct` is now just a column value.

**And the direction is unknown.** This is the point that matters most in an
interview. It is tempting to say "these intervals are surely too narrow", but the
20 percent fallback and the cold-start widening up to 3x cut the other way, and
the fallback fires on exactly the thin series where the true uncertainty is
highest. Whether the net effect is over or undercoverage, and whether it differs
by horizon or by archetype, is an empirical question nobody has asked.
"""
source = "config/default.toml"
anchor = "confidence_pct = 0.80"
see_also = ["PLAN.md#CEILING"]

[[question]]
id = "m08-q07"
kind = "find"
prompt = """
Go looking for the code that measures interval coverage in this repo. Report what
you find, and say what would have to change structurally before the backtest
harness could compute it.
"""
rubric = [
  "There is none: no coverage metric exists anywhere in wow_forecaster/",
  "BacktestMetrics carries mae, rmse, mape, directional_accuracy and no interval field",
  "PredictionRecord carries actual_price, predicted_price and last_known_price, with no interval bounds, so the harness structurally cannot compute coverage even if a metric were added",
  "Interval coverage is a planned field of the forecast_realizations ledger, ROADMAP M1 #13",
]
answer = """
Nothing measures it. A grep for `coverage` across `wow_forecaster/` returns
ingredient coverage in the crafting layer and data-coverage days in the health
check. Neither has anything to do with intervals.

`backtest/metrics.py` is where you would expect it, and its metric-design
docstring is careful and well argued about MAE, RMSE, MAPE and directional
accuracy. It says nothing about intervals, because `BacktestMetrics` has no
interval field. Go one level up and the reason is structural:
`PredictionRecord`, the unit the whole harness aggregates over, carries
`actual_price`, `predicted_price` and `last_known_price` and no bounds at all.
The baseline models return a single float from `predict()`. So adding a coverage
metric to `compute_metrics` would not be enough; the record would have to carry
the interval, and the baselines would have to produce one, before there was
anything to score.

That is not an oversight so much as a consequence of the DS-2 defect in PLAN.md:
the backtest harness evaluates four naive baselines against each other, and naive
baselines do not emit intervals. The production model's intervals live in
`forecast_outputs` and are never joined to actuals by anything.

The planned fix is the `forecast_realizations` ledger, ROADMAP M1 #13, which
scores every matured forecast against rollup actuals on MAE, MAPE, directional
accuracy and interval coverage. It is first in the M1 sequence for a reason:
around 305 thousand already-matured forecasts become scoreable the day it lands,
which means the first real coverage number for this system is a query away once
the table exists, not a year of waiting.
"""
source = "wow_forecaster/backtest/metrics.py"
anchor = "        directional_accuracy: Fraction of correctly predicted price directions."
see_also = ["docs/ROADMAP.md", "PLAN.md"]

# ── The floor, the cap, and what clamping costs ──────────────────────────────

[[question]]
id = "m08-q08"
kind = "recall"
prompt = """
The 5 percent floor and the 10x cap arrived together in v1.11.0. What symptom did
each one remove, and what did adding them cost?
"""
rubric = [
  "Floor: ci_lower was landing at 0.0 whenever ci_half exceeded predicted, because lower is max(0.0, predicted - ci_half)",
  "Cap: cold-start widening of up to 3x on top of a 20 percent fallback produced upper bounds far above any plausible price",
  "Both are guards on how the number reads in a report, not statements about probability",
  "Clamping changes the interval's coverage while leaving confidence_pct at 0.80, so the stated level and the actual behaviour separate further",
]
answer = """
Both were real symptoms, and the fix was aimed at the symptom.

The 0.0 lower bound came from `lower = max(0.0, predicted - ci_half)`. Whenever
the half-width exceeded the prediction, the subtraction went negative and clipped
to zero. That is the exact condition the docstring names: it arises when
`z * rolling_std_7d` is larger than the prediction, which a volatile archetype
reaches on its own, and cold-start widening pushes more rows over the line (3.0x
flat with no mapping, and `1.5 / transfer_confidence` with no upper bound when the
mapping confidence is low). Note the flat 20 percent fallback alone cannot do it:
`0.20 * 3.0` is 0.60 of predicted, so the fallback path only reaches a zero lower
bound through the transfer-confidence widening, not the no-mapping case. A report
saying "we expect 400g, somewhere between 0g and 1040g" reads as broken software,
and it is not a useful trading input either.

The absurd upper bounds are the same story on the other side. `upper = predicted
+ ci_half`, so a large half-width, or a `predicted` that has wandered far above the
current market, sends the upper bound past any price the item trades at. The cap
is written against `current_price` precisely because that is the reference the bad
rows blow past: it binds when the upper bound climbs above 10x what the item
currently costs, which is the q09 case where `predicted` sits far from the market.

What it cost: an interval that has been floored or capped no longer has whatever
probabilistic content it started with, and `confidence_pct` still says 0.80. The
clamp binds precisely on the forecasts where the model was least certain, which
are the ones that most needed a wide interval. So the intervals most likely to be
too narrow are exactly the ones that got narrowed.

This is a fair thing to have shipped and an unfair thing to leave unlabelled. A
presentation guard is legitimate: nobody wants a zero lower bound in a dashboard.
The missing half is a flag on the row saying the bound was clamped, so that a
later coverage study can exclude or separately report them. `ci_quality` looks
like it might be that flag, and q09 shows why it is not.
"""
source = "wow_forecaster/ml/cold_start.py"
anchor = "        upper = min(upper, current_price * 10.0)"
see_also = ["PLAN.md#CEILING"]

[[question]]
id = "m08-q09"
kind = "predict"
prompt = """
A model prediction goes badly wrong for one archetype. `predicted = 100.0`,
`current_price = 1.0`, `rolling_std_7d = None`, not cold start,
`confidence_pct = 0.80`, drift multiplier 1.0.

Trace `compute_confidence_interval` and `classify_ci_quality`. What is stored?
"""
answer = """
`(10.0, 10.0)`, classified `"good"`. A zero-width interval on the most obviously
broken forecast in the run.

The trace:

  ci_half   = 0.20 * 100          = 20.0     (rolling_std is None)
  min_half  = 0.05 * 100          = 5.0      (floor does not bind)
  lower     = max(0.0, 100 - 20)  = 80.0
  upper     = 100 + 20            = 120.0
  floor     = max(80.0, 1 * 0.05) = 80.0     (does not bind)
  cap       = min(120.0, 1 * 10)  = 10.0     (binds hard)
  re-clamp  = min(80.0, 10.0)     = 10.0     (lower dragged down to upper)

  width_pct = (10.0 - 10.0) / 100 = 0.0  ->  "good"

The re-clamp on the last line exists to keep `lower <= upper` so the frozen
`ForecastOutput` validator does not reject the row, and it does its job. The
side effect is that when the cap binds below the lower bound, the interval
collapses to a point, and `classify_ci_quality` reads a point interval as maximum
confidence.

So the pipeline's response to "the model predicted 100x the market price" is to
store a forecast of 100 with a certainty label of good. If this were an
item-level row, `fetch_tsm_export_items` would pick it up: it filters on
`ci_quality = 'good'`, computes ROI from predicted against current, keeps
anything above 10 percent, and sorts by ROI descending. This row would rank
first.

The lesson is about the direction of a derived flag. `ci_quality` is computed
from the interval after clamping, so it measures the output of the guard rather
than the condition the guard fired on. A flag derived downstream of a clamp
reports the clamp, not the problem.
"""
options = [
  { text = "(10.0, 10.0), ci_quality \"good\"", correct = true },
  { text = "(80.0, 120.0), ci_quality \"good\"", note = "This skips the current-price block. It runs whenever current_price is not None and above zero, which is every archetype row carrying a price_mean. With current_price = 1.0 the cap of 10x binds at 10.0." },
  { text = "(0.05, 10.0), ci_quality \"good\"", note = "The floor is max(lower, current_price * 0.05), which can only raise the lower bound. lower was already 80.0, so the floor does nothing; it is the cap and then the re-clamp that produce 10.0." },
  { text = "ValueError from the ForecastOutput validator, because lower (80.0) exceeds upper (10.0)", note = "That is what would happen without the final `lower = min(lower, upper)` line. It exists precisely to keep the invariant, so the row is written rather than rejected, which is the more dangerous outcome: a silent bad row instead of a loud failure." },
]
source = "wow_forecaster/ml/cold_start.py"
anchor = "        lower = min(lower, upper)"
see_also = ["wow_forecaster/reporting/tsm_export.py"]

[[question]]
id = "m08-q10"
kind = "mcq"
prompt = """
Suppose you measured coverage on this system tomorrow, separating rows where the
floor or the cap bound from rows where neither did. What should you expect
clamping to have done to coverage, and why?
"""
answer = """
Clamping lowers coverage, and it lowers it on the subset that could least afford
it.

Both clamps shrink the interval: the floor can only raise `lower`, the cap can
only lower `upper`. A smaller interval contains the actual less often. That is
arithmetic, not a hypothesis.

The selection effect is the interesting part. Neither clamp binds on a
well-behaved forecast, because a modest interval around a sane prediction stays
inside 5 percent to 10x of the current price without trying. The clamps bind on
wide intervals and on predictions far from the current price, which is to say on
exactly the rows where the model is least sure and most likely to be far off.
So the clamped subset combines the widest true uncertainty with the narrowest
reported interval.

If you ever run this study, split it three ways: unclamped, floor bound, cap
bound. The pooled number will hide the effect, because unclamped rows are the
majority and will drag the average toward whatever the base heuristic does.
"""
options = [
  { text = "Lowered it, and most on the forecasts that needed the widest intervals, because the clamps only bind when the interval was already wide", correct = true },
  { text = "Raised it, because narrower intervals are more precise and precision is what an interval is for", note = "Narrower intervals contain the actual less often, by definition. Precision without calibration is the failure mode, not the goal: a zero-width interval is maximally precise and has zero coverage." },
  { text = "Left it unchanged, because the floor and the cap move both endpoints together and the interval just shifts", note = "They do not move together and they do not shift the interval. The floor raises lower, the cap lowers upper, and either can bind on its own. Both shrink." },
  { text = "Affected only cold-start rows, since the clamps exist to contain cold-start widening", note = "Containing cold-start widening was the motivation, but the code applies floor and cap to every row where current_price was passed. The cold-start multiplier is a separate step earlier in the function." },
]
source = "wow_forecaster/ml/cold_start.py"
anchor = "        lower = max(lower, current_price * 0.05)"

[[question]]
id = "m08-q11"
kind = "recall"
prompt = """
`cold_start.py` names its own replacement. Describe how quantile regression would
change the interval, what it buys, and the claim it still does not let you make.
"""
rubric = [
  "Train additional LightGBM models with objective=\"quantile\" at alpha 0.10 and 0.90 for an 80 percent interval",
  "The bounds then come from features and data, so they vary per row and per horizon without any hand-written rule",
  "It removes the level-dispersion substitution: the quantile models are fit against the actual target, so bias shows up in the bounds",
  "It is still not a coverage guarantee: quantile models can be miscalibrated, so coverage must be measured either way",
]
answer = """
The mechanics are small. LightGBM supports `objective="quantile"` with an `alpha`
parameter, so an 80 percent interval means fitting two extra boosters per
horizon, at alpha 0.10 and 0.90, on the same feature matrix and the same target.
The prediction from the alpha-0.10 model is the lower bound and the alpha-0.90
model is the upper. Roughly triple the training cost, no new dependency, no new
data.

What it buys is that the bounds become a learned function of the features. A thin
series with a cold-start flag and no recent volume gets a wide interval because
the model learned that rows like that are hard, not because a constant said 20
percent. The horizon problem from q04 dissolves for free: the 28d quantile models
are fit against the 28d target, so they see the larger spread directly. And
because the quantile models are fit against the actual label, a biased central
prediction shows up as an asymmetric interval rather than being invisible.

What it does not buy is a guarantee. A quantile model is a fitted model like any
other, and it can be systematically off: pinball loss minimized on training data
says nothing about out-of-sample coverage, particularly when the training split
itself leaks (see M06). You still have to measure. That ordering matters for the
roadmap: ROADMAP M1 puts the realization ledger (#13) before quantile regression
(#19), which is the right way round, because #19 without #13 replaces one
unscored interval with another.
"""
source = "wow_forecaster/ml/cold_start.py"
anchor = "use LightGBM with ``objective=\"quantile\"`` to generate model-calibrated"
