[[question]]
id = "m20-q14"
kind = "recall"
prompt = """
The repo carries two planning documents: docs/ROADMAP.md and PLAN.md. What does
each own, and why is the interlock between them deliberately one-directional?
"""
rubric = [
  "ROADMAP.md owns the research arc and the GitHub issue numbering (M0-M6)",
  "PLAN.md owns the lifecycle and legibility arc (orchestration, serving, packaging, the methodology fixes)",
  "PLAN names the M1 issues it overlaps but does not renumber or restate them",
  "The interlock is one-directional: the roadmap does not reference PLAN, so neither goes stale when the other moves",
]
answer = """
ROADMAP.md is the source of truth for the research arc and for issue numbering:
M0 through M6, every GitHub milestone, every issue number. PLAN.md owns the
lifecycle and legibility arc: orchestration, serving, packaging, IaC, and the
three methodology defects the 2026-07-24 audit surfaced. They cover different
axes of the same project.

The interlock is one-directional on purpose. PLAN references the specific M1
issues it overlaps (Phase 1 is the minimum version of #14-#17, Phase 5 is blocked
on #13) but does not renumber or restate them. The roadmap, in turn, does not
reference PLAN at all. That asymmetry is the point: if each document pointed at
the other, moving one would stale the other, and two cross-linked planning docs
drift into contradiction. By making PLAN depend on ROADMAP and not the reverse,
ROADMAP can move freely and only PLAN needs reconciling, deliberately, not as a
