"""
source = "PLAN.md"
anchor = "the roadmap does not reference this document, so"
see_also = ["docs/ROADMAP.md"]

[[question]]
id = "m20-q15"
kind = "mcq"
prompt = """
OD-2 recommends MLflow with a local backend, and part of its case is that fixing
model selection also fixes a live bug. What is the live bug in how the serving
path picks a model today?
"""
answer = """
There are three model-selection strategies in the repo and they can disagree, and
the authoritative one is the one nobody reads. model_metadata carries is_active,
the flag that should decide which model serves. But forecast.py picks the model by
filesystem mtime glob and cli.py picks it lexicographically, so is_active is
written and never read.

The plan calls model_metadata write-only: nothing reads it back. That is the live
bug. MLflow's registry stage transitions replace the ignored is_active flag with a
selection the serving path actually consults, which is why OD-2 argues it fixes a
bug rather than adding ceremony. Selecting by mtime ties serving to a local
filesystem layout and can silently serve the wrong booster the moment two
artifacts land out of the expected order.
"""
options = [
  { text = "model_metadata.is_active is write-only; serving ignores it and globs the newest artifact by filesystem mtime instead", correct = true },
  { text = "The registry has no is_active column, so there is no way to mark a model current", note = "It does have is_active, and the right columns generally. The bug is not a missing column, it is that the serving path never reads the column that exists. That distinction is why OD-2 says the fix is wiring, not schema work." },
  { text = "Serving reads is_active correctly but the training path never sets it", note = "Reversed. The training path sets is_active (it promotes the new model); the serving path is the one that ignores it and globs by mtime. The write happens; the read does not." },
  { text = "The model is selected correctly but retraining overwrites the artifact in place", note = "Retraining writes a new artifact and unconditionally promotes it, which is a separate concern (no promotion gate). The selection bug here is that mtime globbing, not is_active, decides which artifact serves." },
]
source = "PLAN.md"
anchor = "Serving ignores it and globs by mtime"

