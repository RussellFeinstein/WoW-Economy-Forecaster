reasons the plan states for leading with it.
"""
rubric = [
  "It is days of work, not weeks, so it is cheap to front-load",
  "It is what applications going out now depend on (the visible portfolio surface)",
  "Two of its items are live defects on a public repo (the invalid split and the broken demo)",
  "It is the only phase that changes what a reader sees this month, whereas Phase 2 is invisible until it finishes",
]
answer = """
The plan gives three reasons, and they are about cost, urgency, and visibility.

First, DS legibility is days of work, not the weeks the orchestration migration
needs, so leading with it is cheap. Second, it is what applications going out right
now depend on: a reviewer clicks the repo this week, not after Phase 2 lands.
Third, two of its items are live defects on a public repo. The invalid
train/validation split (DS-1) and the Streamlit demo showing "no data" on every
tab are not future risks; they are wrong on the page a hiring manager sees today.

That third reason is what breaks the obvious order. Normally you build the
foundation (portability) first. But a foundation is invisible until it is done,
and this repo has visible defects live now. Fixing what a reader sees this month
outranks unblocking work whose payoff is a month out. Phase 2 is still the thing
everything depends on; it just is not the thing to do first.
"""
