containing four realms that will never have data.

Two details make this the sharpest instance of the class in the repo. First, the
comment is the bug: it says these values mirror `config/default.toml`, and at
some point they did, which is exactly why nobody re-checked them. A comment
asserting a relationship is a liability the moment the relationship is not
enforced. Second, this is the demo. It is a public repo, the dashboard is what a
reader clicks first, and it has been showing an empty product to anyone who tried
it.

The fix is not to update the list. It is to read `config.realms.defaults`, so the
relationship the comment describes becomes one the code enforces.
"""
options = [
  { text = "Every dashboard tab shows \"No data available\", because the pipeline stores observations under the realm slug \"us\" and none of the four hardcoded realms ever has rows", correct = true },
  { text = "The dashboard falls back to the config value when a selected realm returns nothing, so it works with an extra click", note = "There is no fallback. The realm selection is passed straight into the loaders, and an empty result renders as the empty state. The hardcoded list is the only source of options." },
  { text = "It only affects per-realm views; the commodity tabs read region-wide data and are unaffected", note = "The commodity data is what is stored under \"us\". Every loader filters by the selected realm slug, so the region-wide data is precisely what the four dead slugs fail to match." },
  { text = "It is cosmetic: the underlying data is correct, so any reader who edits the list sees the real product", note = "Requiring a reader to edit source before the demo works means the demo does not work. On a public repo whose purpose is to be looked at, an empty first screen is the product." },
