# M12: Every bug, by failure class.
#
# Citation rule: `source` is a path, `anchor` is a verbatim single-line snippet
# from that path. Never a line number. tests/test_learning/test_bank_integrity.py
# fails if an anchor stops matching, so editing the cited code forces the
# question to be updated in the same PR. Run `wowfc learn validate` while
# authoring.
#
# The taxonomy this module uses, and the names the answers stick to:
#   1. Silent substitution      a default stands in for missing data
#   2. Config-to-code drift     a config value stops matching what reads it
#   3. Documentation drift      a count or claim stops matching the thing counted
#   4. Contention under load    correct small, wrong at production volume
#   5. Fixture and clock drift  the test's world diverges from production

# ── The taxonomy ─────────────────────────────────────────────────────────────

[[question]]
id = "m12-q01"
kind = "recall"
prompt = """
Twenty-two fix entries in this CHANGELOG sort into five recurring classes. Name
the five, and give one concrete instance of each from this repo.
"""
rubric = [
  "Silent substitution: a default, a zero, or a skip stands in for missing data (event-feature zeroing on an empty wow_events table; the exit-0 lock skip; _classify_error_drift(None) returning NONE)",
  "Config-to-code drift: a config value stops matching what consumes it (\"30d\" versus \"28d\"; backtest.horizons_days versus features.target_horizons_days; the dashboard realm list)",
  "Documentation drift: a stated count stops matching the thing it counts (37 features against 40; 21 tables against 23; three different command counts in three documents)",
  "Contention under load: correct at fixture scale, wrong at production volume (the write lock held across the HTTP fetch; a 4.2 GB WAL; DATE(observed_at) forcing table scans)",
  "Fixture and clock drift: the test's model of the world diverges from production (the hand-rolled ingestion_snapshots fixture; tests pinned to a wall clock that moved past them)",
]
answer = """
Five classes, and the useful thing about them is that they are diagnostic
categories rather than descriptive ones. Each implies a different place to look.

**Silent substitution.** Something is missing and the code supplies a value
instead of an error. `wow_events` empty produced eight all-zero event feature
columns. A leaked lock produced `exit /b 0`. A missing baseline MAE produced
`DriftLevel.NONE`, which reads as "no drift" rather than "not measured". The
output is always plausible, which is what makes it expensive.

**Config-to-code drift.** A value written in one place and consumed in another
stops agreeing. The horizon strings "30d" and "28d". `config.py` defaults
diverging from `default.toml`. `backtest.horizons_days = [1, 3]` against
`target_horizons_days = [1, 7, 28]`. The dashboard's hardcoded realm list against
`realms.defaults = ["us"]`. None of these throws.

**Documentation drift.** A count in prose stops matching what it counts. The
README's 37 model features against an actual 40, its 21 tables against an actual
23, and three documents claiming 39, 40, and 41 CLI commands.

**Contention under load.** Code that is correct on a fixture and wrong on the
real database. Holding the SQLite write lock across a Blizzard HTTP fetch. A
5-second `busy_timeout` against batch inserts. A 4.2 GB write-ahead log. A
`DATE(observed_at)` predicate that cannot use an index.

**Fixture and clock drift.** The test asserts against a world that is not
production. A hand-rolled `ingestion_snapshots` fixture with invented columns let
a query that crashes on every real database pass its tests for four minor
versions. Tests pinned to relative dates started failing when the calendar moved,
and several neighbors had been passing vacuously on empty result sets the whole
time.

The classes are not disjoint and are not meant to be. Their value is as a search
strategy: given one instance, go looking for the others in the same class.
"""
see_also = ["CHANGELOG.md", "PLAN.md"]

[[question]]
id = "m12-q02"
kind = "recall"
prompt = """
`build_feature_datasets()` refuses to run when `wow_events` is empty rather than
building a dataset with zeroed event columns. State the general argument for
raising over substituting, and say what specifically would have gone wrong here.
"""
rubric = [
  "A zero is a legal value for these columns, so the artifact is indistinguishable from a valid one",
  "The failure surfaces far downstream (a model with no event signal, then forecasts, then recommendations) with nothing pointing back at the cause",
  "Raising fails at the one place that knows why, and the message names the fix (run build-events first)",
  "The cost of raising is a stopped pipeline; the cost of substituting is a plausible wrong answer that ships",
]
answer = """
The argument turns on whether the substituted value is distinguishable from a
real one. Zero is a legal value for every one of the eight event feature columns:
no event nearby genuinely means `event_days_to_next` is null and the impact
columns are zero. So a dataset built with no events seeded is byte-for-byte the
kind of dataset you would get in a quiet week. Nothing downstream can tell them
apart, and nothing downstream is even looking.

Follow the blast radius. The Parquet is valid. Training succeeds. The model
learns that event features carry no signal, which is true of the data it was
shown and false of the world. Forecasts are produced. `event_boost` contributes
0.15 of every recommendation score and now contributes nothing. A CSV lands in
`data/outputs/recommendations/` on schedule. Every step reports success. The
person reading the CSV has no path back to `build-events` from any of it.

Raising costs one stopped pipeline run and one error message, and the error
message can name the fix because the code that raises is the code that knows what
is missing. That asymmetry is the whole rule: the cost of failing loudly is
bounded and immediate, the cost of substituting is unbounded and deferred.

The same reasoning appears in `cloud_sync.select_objects_to_ingest`, where a run
capped at `max_objects_per_run` reports the count it dropped rather than
returning a short list that looks complete. Different subsystem, identical
principle.
"""
source = "wow_forecaster/features/dataset_builder.py"
anchor = "and silently produce a degraded artifact.  Fail loudly instead."
see_also = ["CHANGELOG.md"]

[[question]]
id = "m12-q03"
kind = "mcq"
prompt = """
`_classify_error_drift(None)` returns `DriftLevel.NONE`. `_classify_health(None)`
returns `"unknown"`. Both are reached when `mae_ratio` could not be computed.
Which reading is correct, and why does it matter which one an operator sees?
"""
answer = """
`health.py` is right and `drift.py` is wrong, and the two files disagreeing is
what makes it visible.

`NONE` and `unknown` are different propositions. `NONE` says the check ran and
found nothing. `unknown` says the check could not run. An operator scanning a
drift report sees a column of `none` and concludes the model is fine. The actual
state is that no baseline MAE existed, so nothing was compared.

This is not hypothetical here. `baseline_mae` comes from `AVG(abs_error)` over
`backtest_fold_results` with no `model_name` filter and no staleness check, so it
is a pooled blend of four baselines from whichever backtest ran last. And
`backtest.horizons_days` is `[1, 3]` while forecasts run at 1, 7, and 28, so the
7d and 28d ratios can never be computed at all. Two of the three production
horizons permanently report `NONE`, meaning "no drift", when what they mean is
"never measured".

The repo already states the right principle in another subsystem: the cloud
capture gap guard keeps its floor at 20 distinct hours on purpose, because a
floor the failure mode can satisfy would hide the failure. Making `drift.py`
match `health.py` is applying a rule this project already wrote down.
"""
options = [
  { text = "unknown is correct: NONE conflates \"measured and clean\" with \"could not measure\", and the operator reads the first when the second is true", correct = true },
  { text = "NONE is correct: with no baseline there is no evidence of drift, and reporting a non-value would be inventing a signal", note = "Absence of evidence is being reported as evidence of absence. \"unknown\" is not a non-value, it is the accurate one: the check has four outcomes (ok, degraded, critical, could-not-run) and collapsing the fourth into the first is what hides the failure." },
  { text = "Both are defensible: the enum simply has no unknown member, so NONE is the closest available value", note = "The enum shape is the thing to change, not the reason to accept the wrong answer. Reaching for the closest available member when none of them says what you mean is how a type system talks you into a lie." },
  { text = "It only matters for the 1d horizon, since 7d and 28d have no backtest rows anyway", note = "Backwards. The horizons with no backtest rows are exactly the ones that always take this branch, so they are where the wrong label does all of its damage." },
]
source = "wow_forecaster/monitoring/drift.py"
anchor = "mae_ratio:  live_mae / baseline_mae.  None → NONE (can't detect)."
see_also = ["PLAN.md"]

[[question]]
id = "m12-q04"
kind = "predict"
prompt = """
It is 00:10 UTC. GitHub dropped every firing before 06:00 yesterday, so the
bucket's earliest object from yesterday is stamped 06:00Z. Trailing 24 hours:
14 distinct capture hours. Guard floor: 20.

`list_recent_keys()` lists three day-prefixes and `evaluate_gap_guard()` scores
the result. What happens, and what would have happened under the two-prefix
listing this replaced?
"""
answer = """
Today: the guard trips. `(False, "only 14 distinct hours covered in the trailing
24h ...")`, and `cloud_fetch` exits 3.

Before issue #68 it passed. The guard has a bootstrap escape hatch: if no listed
object is older than the 24-hour cutoff, low coverage is treated as expected
(first day of operation, or a resume after a long outage whose failed runs
already alerted). With only today and yesterday listed at 00:10Z, the cutoff sits
at yesterday 00:10 and the earliest listed object is yesterday 06:00, so `older`
counted zero and the bootstrap rule fired on a day that genuinely had gaps. The
2026-07-22 00:10Z run passed on a day whose two previous runs had failed.

The fix is not in the guard logic at all. It is in the listing: three day-prefixes
mean objects older than the cutoff are always visible, so `older` is only zero
when the history is genuinely empty. That is the shape worth remembering. The
guard's rule was right; it was being fed a window that could not see the evidence
it depended on. When a check passes for a reason unrelated to the thing it checks,
look at the input range before you look at the predicate.
"""
options = [
  { text = "It trips: 14 < 20 and the third day-prefix supplies objects older than the cutoff, so the bootstrap rule cannot fire", correct = true },
  { text = "It passes under the bootstrap rule, which is why #68 widened the listing", note = "That was the old behavior and it is what #68 fixed. With three prefixes the day-before-yesterday objects are all older than the cutoff, so `older` is non-zero and the bootstrap branch is unreachable." },
  { text = "It passes, because the guard counts objects rather than hours and two triggers an hour clear the floor", note = "The metric changed to distinct UTC hours in v2.8.0 for exactly this reason. Counting objects let a gappy day clear the floor on duplicate captures within the hours it did cover." },
  { text = "It never gets there: the run already failed the 50,000-record sanity floor", note = "Different check on different data. The sanity floor guards the freshly fetched snapshot's record count against a Blizzard brownout. The gap guard runs after a successful upload and looks at bucket history." },
]
source = "wow_forecaster/ingestion/cloud_fetch.py"
anchor = "count read 0 in that window and the bootstrap rule fired on days"

# ── Config-to-code drift ─────────────────────────────────────────────────────

[[question]]
id = "m12-q05"
kind = "recall"
prompt = """
Why is a config value that no longer matches the code reading it a correctness
bug rather than untidiness? Give the argument, then two instances from this repo
that land in different places.
"""
rubric = [
  "Config is an assertion about what the code does, and a wrong assertion silently misleads every reader including the author",
  "It produces no error: both sides are individually valid, so nothing throws and no test fails",
  "\"30d\" against a code path computing 28d is a wrong number in output, not a wrong label",
  "backtest.horizons_days = [1, 3] against target_horizons_days = [1, 7, 28] made the stated acceptance bar unmeasurable, and the tell sat in config in plain sight",
]
answer = """
Config is a claim about behavior. When the claim is wrong, everyone who reads it
to decide what the system does (including the person who wrote it, six months
later) reasons from a false premise, and nothing anywhere raises. Both halves are
individually well-formed. There is no type error to catch, no exception to log,
no test that fails. The mismatch lives only in the relationship between two
files, which is precisely the thing no tool in a default Python project checks.

Two instances that fail in different ways:

The v1.3.0 horizon mismatch, "30d" against a code path computing 28 days, is a
wrong number reaching output. Anything keyed on that string labels a 28-day
forecast as a 30-day one, and downstream arithmetic done from the label is off by
two days.

The horizon-list mismatch is worse because it disables a check rather than
corrupting a value. `backtest.horizons_days = [1, 3]` and
`features.target_horizons_days = [1, 7, 28]` share only the value 1. Two of the
three production horizons had no baseline to be compared against, so the
acceptance bar stated out loud in `backtest/models.py`, that a model must beat
every baseline, was unmeasurable from the day both lines were written. No output
was wrong. A standard simply went unenforced, invisibly, for months.

The habit that catches both: when two files must agree, something has to assert
it. `cloud_sync.py` does the cheap version, a comment saying `LOCK_STALE_MINUTES`
must match `STALE_MINUTES` in the bat file. A comment is better than nothing and
strictly weaker than a test.
"""
source = "CHANGELOG.md"
anchor = "Horizon mismatch (\"30d\" vs \"28d\"), dead Literal entries, stale assertions"
see_also = ["LESSONS.md", "config/default.toml"]

[[question]]
