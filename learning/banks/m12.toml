prompt = """
`dashboard/app.py` sets `_DEFAULT_REALMS = ["area-52", "illidan", "stormrage",
"tichondrius"]` under a comment saying these mirror `config/default.toml`.
`config/default.toml` sets `defaults = ["us"]`. What is the actual consequence?
"""
