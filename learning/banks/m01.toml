# ── Events as the fourth constraint ───────────────────────────────────────────

[[question]]
id = "m01-q15"
kind = "recall"
prompt = """
The event taxonomy splits every event across three orthogonal dimensions, plus a
fourth enum that lives somewhere else. Name all four, say what question each
answers, and then say what epistemic status `EventSeverity` actually has.
"""
rubric = [
  "EventType is the what, EventScope is the who, EventSeverity is the how much",
  "ImpactDirection (spike, crash, mixed, neutral) is the fourth, and it is per archetype rather than per event",
  "It lives in the event_archetype_impacts table, because direction depends on which archetype you ask about",
  "The severity bands are hand-authored expected magnitudes, not measurements, so they encode a prior rather than a finding",
]
answer = """
`EventType` is the what: 28 kinds from expansion launch to content drought.
`EventScope` is the who: global, region, realm cluster, faction. `EventSeverity`
is the how much: five bands with explicit percentage ranges attached, from
critical at over 50 percent movement down to negligible under 5 percent.
`ImpactDirection` is the fourth, and it is deliberately not a property of the
event: the same patch spikes one archetype and crashes another, so direction is
recorded per event-and-archetype pair in `event_archetype_impacts`.

Now the part that matters for how you read every event feature downstream. Those
severity percentages are authored by a person from domain knowledge. Nothing
measured them. `config/events/tww_event_impacts.json` carries 56 category-level
impact records in the same spirit, and they feed the event feature columns and
the `event_boost` term in the recommendation score.

So the event layer encodes a prior about what events do, and the system then
acts on that prior. Measuring the actual effect is a separate piece of work: an
interrupted time series or a difference-in-differences design per event, which
is M18 and roadmap milestone M5. PLAN.md's ceiling names closing that loop, so
that measured effects replace the hand-authored records rather than sitting
beside them.

The design that makes the measurement possible later is `announced_at` plus
`is_known_at()`: separating when an event became known from when it took effect
is both a look-ahead guard for forecasting and the identification backbone for
the causal study.
"""
source = "wow_forecaster/taxonomy/event_taxonomy.py"
anchor = "  - ``EventSeverity`` — the *how much*: expected market impact magnitude?"
see_also = ["wow_forecaster/models/event.py"]

[[question]]
id = "m01-q16"
kind = "predict"
prompt = """
An archetype has price observations on only 6 distinct dates inside a 90-day
requested range. `build-datasets` runs over that range.

What do that archetype's rows look like coming out of the daily aggregation and
the lag/rolling step?
"""
answer = """
You get 90 rows, not 6. The date spine is generated in Python over the full
calendar range and every date with no observation becomes a row with
`price_mean = None` and `obs_count = 0`. Nothing is forward filled: the fill is
an explicit null, which is the honest representation of "no price was observed"
and is distinguishable from a real price.

The labels are worse than the features. `target_price_28d` is
`price_lookup.get(d + 28 days)`, a plain dict lookup with no fallback, so it is
None unless that exact future date happens to be one of the six with data. For a
series this thin, nearly every row has no usable 28-day label at all, and those
rows contribute nothing to training for that horizon.

This is the "thin per-archetype series" constraint in concrete form, and it
drives design decisions elsewhere: one global cross-archetype model rather than
one model per series (M07), a 14-distinct-day threshold before an item is
eligible for its own forecast row, and cold-start blending toward a transferred
source price when there is not enough history to fit against.
"""
options = [
  { text = "90 rows, 84 of them with price_mean None; target_price_28d is a dict lookup with no fallback, so it is null on nearly every row", correct = true },
  { text = "6 rows, since the aggregation only emits dates that actually have observations", note = "That is what the SQL alone returns. daily_agg then generates the full calendar range in Python and fills the gaps, specifically so downstream lag and rolling windows can index by calendar offset." },
  { text = "90 rows with prices forward-filled from the last observed day, so no feature is null", note = "There is no forward fill anywhere in daily_agg or lag_rolling. Filling would manufacture prices that were never observed and would quietly flatten volatility features toward zero." },
  { text = "90 rows, with target_price_28d falling back to the most recent known price when the target date is empty", note = "The target is price_lookup.get(target_date) with no default. A fallback there would be label fabrication, and it would bias the model toward predicting no change." },
]
source = "wow_forecaster/features/daily_agg.py"
anchor = "one row per (archetype_id, realm_slug, calendar_date).  That daily-grain table"
see_also = ["wow_forecaster/features/lag_rolling.py"]

# ── Saying it out loud ────────────────────────────────────────────────────────

[[question]]
id = "m01-q17"
kind = "recall"
prompt = """
You are asked: "it is a price forecaster, what is hard about that?" Give the
ninety-second answer, grounded in this system rather than in generic time-series
talk.
"""
rubric = [
  "State the target precisely: an archetype's daily mean price, h days out, not an item's",
  "Cold start: the expansion you care about has no history and its item IDs did not exist when the mapping was written",
  "The 30-day retention wall plus a current-snapshot-only API, so history only accumulates forward from the day capture started",
  "Thin, sparse series and discrete event shocks rather than long smooth histories",
  "The honest close: the model has never been compared to a baseline, so nothing here is established yet",
]
answer = """
A ninety-second version that lands:

"The unit of prediction is not an item, it is an economic archetype: a behavior
group like stat flasks or common ore. Each one has a daily mean price per
region, and the model predicts that price 1, 7 and 28 days out.

Three things make it harder than it sounds. First, the whole point is
forecasting an expansion that has no price history, so item-to-item mapping is
impossible by construction. The item IDs do not exist when you write the map.
Transfer has to happen at the behavior level, with a stated confidence and a
written rationale for every mapping, and on day one the forecast is mostly a
transferred prior rather than a fit.

Second, the data constraint is structural, not an engineering shortfall. The API
terms require raw data to be deleted within 30 days, and the commodities
endpoint serves only the current snapshot. There is no historical endpoint. So
history exists only as derived daily aggregates, only forward from the day
capture started, and an hour missed is an hour gone permanently. We learned that
one the expensive way: a leaked lock file silenced ingestion for 105 days and
those dates are simply empty now.

Third, the series are thin and the moves are discrete. Archetypes do not trade
every day, so the date spine is mostly fill, and prices step on scheduled events
(expansion launch, season start, race to world first, patch day) rather than
drifting smoothly.

And the honest part: the model has never been compared to a baseline. The
walk-forward harness exists, the four baselines exist, the acceptance bar is
written down in the source, and the comparison has not been run. So the pipeline
is real and the accuracy claim is not established yet."

The last paragraph is the one that makes the rest credible. A candidate who can
name what their own system has not proved is a different candidate.
"""
source = "PLAN.md"
anchor = "cold start across expansions, the 30-day ToS retention wall capping evaluation history, thin per-archetype series, event shocks"
see_also = ["LESSONS.md", "README.md"]
