[[question]]
id = "m01-q14"
kind = "mcq"
prompt = """
Both taxonomy modules end their docstring with the same sentence: this module
has no imports from any other `wow_forecaster` package. Why is that stated as a
rule rather than left as a coincidence?
"""
answer = """
The taxonomy is the bottom of the dependency graph. `models/` imports
`ArchetypeCategory` and `ArchetypeTag` to type its fields, so if the taxonomy
ever imported back from `models/` there would be a circular import. Stating the
rule in the docstring turns an accident of current structure into a constraint a
future change has to respect.

It also reflects what these modules are. They hold vocabulary, not behavior:
`StrEnum` members with docstrings explaining what each one means economically.
Anything that needs configuration, a database or a Pydantic model is by
definition not vocabulary and belongs a layer up.

The practical payoff is that the taxonomy can be imported from anywhere,
including a test, a notebook, or a script, with no risk of dragging in the
config loader or a database connection.
"""
options = [
  { text = "The taxonomy is the base layer that models/ imports from, so an import back would create a cycle; the docstring makes that a rule instead of an accident", correct = true },
  { text = "So the taxonomy can be published as a standalone package for other tools to depend on", note = "Nothing packages it separately. pyproject.toml declares one distribution, and no code or doc treats the taxonomy as an independently versioned artifact." },
  { text = "To keep Pydantic out of the import chain, which measurably speeds up CLI startup", note = "The stated reason is circular imports. Pydantic is imported by models/ anyway, and every CLI path that touches an archetype loads it, so no import cost is avoided." },
  { text = "Because StrEnum members cannot be defined in a module that has other imports", note = "There is no such restriction. StrEnum is ordinary Python; the constraint here is architectural, chosen by the author, not imposed by the language." },
]
