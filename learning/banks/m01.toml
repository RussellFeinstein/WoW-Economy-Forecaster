[[question]]
id = "m01-q10"
kind = "mcq"
prompt = """
Region-wide commodities plus a single region means each archetype has exactly
one cross-sectional unit. Which reading of that is correct?
"""
answer = """
It removes the natural control group. A patch, a season start or a race to world
first hits the entire region at once, so there is no untreated series of the
same thing to compare against. That is a limit on what can be identified, not
just a smaller dataset.

This is why PLAN.md's ceiling lists panel data across regions as a real item
rather than a nice-to-have. EU and KR, plus per-realm BoE auctions, turn one set
of series into a panel, and cross-sectional methods need a panel to exist before
they can be applied at all. M18 is where that bites hardest: difference-in-
differences needs a comparison group that did not receive the treatment, and
one region does not have one.

The tempting workaround, using other archetypes as controls, is worth thinking
through rather than dismissing. It is not useless, since an event can hit
consumables hard and gems barely. But it is not a clean control either, because
a global event touches every series to some degree and archetypes share
upstream reagents, so treatment spills across the supposed control.
"""
options = [
  { text = "It removes the untreated comparison series a causal design needs, which is why the ceiling names panel data across regions", correct = true },
  { text = "It does not matter, since archetypes are independent series and can act as controls for each other", note = "Independence is exactly what fails. A global event moves every archetype to some degree, and archetypes share reagents, so the supposed control is partly treated. Useful as a sanity check, not as identification." },
  { text = "Adding EU and KR would only add more rows, not new methods", note = "It adds cross-sectional units, which is a different thing from more rows. Cross-sectional methods cannot be applied to a single unit at all, so this is the step that opens them rather than one that improves precision." },
  { text = "Drift detection already covers it, since it computes z-scores per archetype and realm", note = "With one realm the realm dimension is degenerate, so per-archetype-and-realm is just per-archetype. Drift also answers a different question: it flags distribution shift, it does not attribute a move to a cause." },
]
source = "PLAN.md"
anchor = "- **Panel data across regions.** EU and KR plus per-realm BoE auctions turn one"

# ── The taxonomy as a contract ────────────────────────────────────────────────

[[question]]
id = "m01-q11"
kind = "find"
prompt = """
The README states how many archetype tags and how many event types exist. Count
the enum members yourself and compare. Then explain why the taxonomy test suite
never caught the difference.
"""
rubric = [
  "ArchetypeTag has 40 members; the README says 36",
  "EventType has 28 members; the README (and CLAUDE.md) say 26",
  "The taxonomy tests assert structure (value uniqueness, every tag in exactly one category, prefix match) and never assert a count",
  "So the enums grew, the docs did not, and nothing in CI could notice",
]
answer = """
Forty tags and twenty-eight event types. Count them with the enums rather than
by eye:

    from wow_forecaster.taxonomy.archetype_taxonomy import ArchetypeTag
    from wow_forecaster.taxonomy.event_taxonomy import EventType
    len(ArchetypeTag), len(EventType)   # (40, 28)

The README says 36 and 26 in several places, and so does CLAUDE.md.

The reason CI is silent is the interesting part.
`tests/test_taxonomy/test_archetype_taxonomy.py` is a genuinely good test file:
it checks that every value is unique, that every tag appears in exactly one
category's list, that every category has an entry, and that tags carry their
category's slug prefix. Every one of those is a property that stays true as the
enum grows. A count is the one assertion that would have to change every time a
tag is added, and it is the one nobody wrote.

That is the general shape of documentation drift and it is worth naming: the
invariants got tested and the counts got written down. A number in prose has no
test attached unless someone deliberately attaches one, which is exactly the
problem the anchor guard in this learning track was built to solve for citations.
"""
source = "README.md"
anchor = "defines 36 economic behavior tags"
see_also = ["wow_forecaster/taxonomy/archetype_taxonomy.py", "PLAN.md"]

[[question]]
id = "m01-q12"
kind = "find"
prompt = """
Two entries in `CATEGORY_TAG_MAP` map to an empty list. Find them, say why that
does not break the integrity contract, and say what it means for an item that
would belong to one of them.
"""
rubric = [
  "SERVICE and COLLECTION both map to an empty list",
  "The contract requires every category to have an entry, and an empty list is an entry, so the test passes",
  "No ArchetypeTag can carry those prefixes, so nothing can ever be classified into them",
  "An item with no archetype assignment is excluded from daily aggregation entirely, so it is never forecast",
]
answer = """
`ArchetypeCategory.SERVICE` and `ArchetypeCategory.COLLECTION`, both marked in a
comment as placeholders for future expansion.

The contract holds because of how it is phrased. Every category must have an
entry, every tag must appear in exactly one category's list, and tags must share
their category's prefix. An empty list satisfies the first rule and is vacuously
fine on the other two. The test passes and should pass: the placeholder is a
deliberate statement that the category is known and not yet populated.

The consequence is downstream and it is real. `daily_agg` joins through
`items.archetype_id`, and items with no archetype assignment are excluded from
aggregation rather than bucketed somewhere. So the entire pet, mount and
transmog segment (a long-tail auction house market the COLLECTION docstring
names explicitly) is outside the forecast grain, not badly forecast within it.

The repo does surface this rather than hide it:
`quality.count_items_without_archetype()` reports how many items are being
dropped. Knowing an exclusion exists and knowing how large it is are different
things, and the second one is what makes the first defensible.
"""
source = "wow_forecaster/taxonomy/archetype_taxonomy.py"
anchor = "# Placeholder categories — no tags defined yet (future expansion)"
see_also = ["wow_forecaster/features/daily_agg.py"]

[[question]]
id = "m01-q13"
kind = "recall"
prompt = """
`CATEGORY_TAG_MAP` is described as the canonical integrity contract. State the
three rules it enforces, and then name two things it deliberately does not
check.
"""
rubric = [
  "Every ArchetypeCategory must have an entry in the dict",
  "Every ArchetypeTag must appear in exactly one category's list",
  "Tags for a category must share that category's slug prefix",
  "It does not check counts, and it does not check that any tag is ever used by a real item or that the grouping matches actual market behavior",
]
answer = """
Three rules: every category has an entry, every tag appears in exactly one
category's list, and a tag's slug carries its category's prefix. The prefix rule
is what makes `ArchetypeTag` filterable by string prefix, which is why the
naming convention is stated in the enum docstring rather than left implicit.

What it does not check is the more useful half of the answer.

It says nothing about counts, which is how the README drifted to 36 (q11).

It says nothing about usage. A tag can exist with zero items assigned to it and
the contract is perfectly happy. `gem.meta` is annotated in its own docstring as
a placeholder for a classic-era mechanic, and nothing enforces that a live
archetype has a live market.

And it says nothing about whether the grouping is economically correct. The
premise of the whole project is that items inside one archetype move together
and items across archetypes do not. That is an empirical claim, it is asserted
by a hand-authored taxonomy, and no test in this repo measures within-archetype
price correlation against between-archetype correlation. That measurement would
be a genuinely good addition and it does not exist yet.
"""
source = "wow_forecaster/taxonomy/archetype_taxonomy.py"
