# M01: The market and the problem.
#
# Citation rule: `source` is a path, `anchor` is a verbatim single-line snippet
# from that path. Never a line number. tests/test_learning/test_bank_integrity.py
# fails if an anchor stops matching, so editing the cited code or doc forces the
# question to be updated in the same PR. Run `wowfc learn validate` while
# authoring.

# ── What is actually being forecast ───────────────────────────────────────────

[[question]]
id = "m01-q01"
kind = "recall"
prompt = """
The model's label is one column, in one table, at one grain. Name the grain,
name the column, say how the value for horizon h is produced, and say what the
label is not.
"""
rubric = [
  "The grain is (archetype_id, realm_slug, obs_date): one row per archetype per realm per calendar day",
  "The label column is target_price_{h}d, produced by looking up price_mean h calendar days forward on the same series",
  "price_mean is the mean non-outlier min-buyout price in gold for that archetype on that day",
  "It is not an item's price, and it is a price level rather than a return",
]
answer = """
The grain is the daily archetype series. `daily_agg.py` collapses every
normalized observation into one row per (archetype_id, realm_slug,
calendar_date), and `price_mean` on that row is the mean min-buyout price in
gold across every non-outlier observation of every item in that archetype on
that day.

The label is `target_price_1d`, `target_price_7d`, or `target_price_28d`. Each
one is built in `lag_rolling.py` by taking the row's own date, adding h calendar
days, and looking that date up in the same price series. No interpolation, no
forward fill: if the future date has no price, the label is None.

Two consequences fall straight out of that definition and are worth carrying
into the rest of the track.

First, `price_mean` is both an input feature and the basis of the target. A
model that learns nothing except "tomorrow looks like today" will post a
respectable MAE, and that is exactly the `last_value` baseline. This is why M05
and M06 keep insisting the comparison against baselines is the load-bearing
measurement rather than the reported validation number.

Second, the target is a level in gold, not a percentage change. Archetypes
differ in price by orders of magnitude, so an absolute error pooled across them
is dominated by the expensive ones and moves when the archetype mix changes.
That defect shows up again in the drift baseline, and PLAN.md names it there.
"""
source = "wow_forecaster/features/lag_rolling.py"
anchor = "out[f\"target_price_{h}d\"] = price_lookup.get(target_date)"
see_also = ["wow_forecaster/features/daily_agg.py"]

[[question]]
id = "m01-q02"
kind = "mcq"
prompt = """
`forecast_outputs` contains rows keyed by `item_id` as well as rows keyed by
`archetype_id`. Where do the item-level numbers come from?
"""
answer = """
They are the archetype forecast rescaled by the item's own current price. The
formula in `_generate_item_forecasts` is
`item_forecast = item_current x (archetype_forecast / archetype_current)`, so
the item keeps its own price level and inherits the archetype's direction
wholesale.

That is a reasonable heuristic and it is honest about what it is, but know what
it means: there is no item-level model. Every item under one archetype moves by
the same proportion on the same day. If an individual item diverges from its
archetype (a nerfed reagent, a new recipe that consumes only one of the five
items in the group), nothing in the system can express that.

Coverage is the union of recipe-linked items and any item with at least 14
distinct observation days, which is a history threshold rather than a modeling
decision. Items with no current price or no archetype mapping are skipped
entirely, so they never reach a forecast at all.

PLAN.md's ceiling names the principled version: item, archetype and category
form a genuine hierarchy, and MinT or OLS reconciliation would make the levels
coherent by construction instead of by a ratio.
"""
options = [
  { text = "The archetype forecast rescaled by the item's current price ratio, so direction comes entirely from the archetype model", correct = true },
  { text = "A separate LightGBM model trained per item on daily_rollup_item", note = "No per-item model exists anywhere in ml/. _generate_item_forecasts takes the archetype ForecastOutputs that were just written and derives from them; it never fits anything." },
  { text = "A fourth target column in the training Parquet, at item grain", note = "The registry declares exactly three target columns, all of them price_mean forward at archetype grain. The training Parquet has no item-keyed row at all." },
  { text = "The mean of the item's own observations, so item and archetype forecasts agree by construction", note = "They do not agree by construction. The trend ratio deliberately preserves each item's own price level, which is the point: items inside an archetype differ in price by a lot even when they move together." },
]
source = "wow_forecaster/pipeline/forecast.py"
anchor = "Uses trend-ratio scaling: item_forecast = item_current × (archetype_forecast"
see_also = ["PLAN.md"]

# ── Why transfer is category-level ────────────────────────────────────────────

[[question]]
id = "m01-q03"
kind = "recall"
prompt = """
The premise of the whole project is that patterns learned on one expansion apply
to the next. Say why that transfer is defined over archetypes and not over item
IDs, and give the two separate reasons item-to-item cannot work.
"""
rubric = [
  "Before the target expansion ships, its item IDs do not exist, so an item-to-item map cannot be authored at all",
  "After it ships, a new item has no price history, so an item-keyed model has nothing to fit on day one",
  "Economic behavior repeats across expansions even though item identity does not: the stat flask is a new item with the same demand cycle",
  "The archetype is the unit that has both history in the source expansion and a stated analogue in the target",
]
answer = """
Two failures, and they bite at different times.

Before the target expansion ships, there is no list of its item IDs to map to.
An item-to-item table cannot be written in advance, so the "Day 1 forecast"
claim would be vacuous.

After it ships, the IDs exist but the series do not. A model keyed on item 12345
has zero rows for that item, and no amount of clever feature engineering
recovers history that was never observed.

What does survive an expansion boundary is behavior. A stat flask in the new
expansion is a different item with the same economics: crafted by alchemy,
consumed on raid nights, price spiking before the race to world first, crashing
at season end. `EconomicArchetype` is the model of that claim, and
`ArchetypeMapping` formalizes one source archetype to one target archetype with
a `confidence_score` and a required rationale.

Be precise about the epistemic status. The mapping is a prior asserted by a
human, not a measured relationship. `transfer_confidence` documents how strong
the analogy is believed to be (1.0 for a near-identical role, 0.0 for none), and
`is_transferable` marks archetypes with no parallel at all. Nothing in the repo
currently checks a mapping against realized prices after the fact, which is the
same gap the realization ledger closes for forecasts in M15.
"""
source = "wow_forecaster/models/archetype.py"
anchor = "Rather than mapping TWW item IDs to Midnight item IDs (impossible before"
see_also = ["README.md", "wow_forecaster/taxonomy/archetype_taxonomy.py"]

[[question]]
id = "m01-q04"
kind = "mcq"
prompt = """
`ArchetypeMapping` refuses to be constructed without a `mapping_rationale`
string. What does making that field required actually buy?
"""
answer = """
It buys an audit trail for the failure case. The docstring says so directly: the
required field forces the researcher to state why the mapping is valid, so when
transfer produces bad forecasts there is a written claim to go back and falsify.

This is the same instinct as `mapping_rationale`'s neighbors elsewhere in the
repo. `config_snapshot` on every run and `features_hash` on every forecast exist
so a past result can be explained rather than re-derived. A confidence score on
its own is a number with no argument attached, and a number with no argument
cannot be reviewed.

The cost is that it is prose, so nothing can validate it. Pydantic checks that
the string exists and is non-empty. It cannot check that the reasoning is any
good. That is a fair trade for a field whose whole job is to make a human
commitment legible.
"""
options = [
  { text = "A written, reviewable claim about why the analogy holds, so a failed transfer can be traced back to the assertion that failed", correct = true },
  { text = "An input feature: the rationale text is embedded and fed to the model", note = "Nothing embeds it. The two transfer features in the registry are has_transfer_mapping and the max confidence_score of any mapping for the archetype. The prose never reaches the model." },
  { text = "Compliance with the Blizzard API Terms of Service, which requires documented derivation", note = "The ToS requirement this repo tracks is section 2.r, a 30-day deletion window on raw API data. It says nothing about documenting how derived models were built." },
  { text = "Validation against the taxonomy's category-prefix rule, so a mapping cannot cross categories", note = "The prefix rule governs ArchetypeTag slugs inside CATEGORY_TAG_MAP. It is never applied to mappings, and a cross-category mapping is legal (it would just deserve a very good rationale)." },
]
source = "wow_forecaster/models/archetype.py"
anchor = "is intentional: it forces the researcher to reason explicitly about *why*"

# ── The structural constraints ────────────────────────────────────────────────

[[question]]
id = "m01-q05"
kind = "recall"
prompt = """
PLAN.md names four constraints that make this problem genuinely hard, and notes
that all four are documented in module docstrings and absent from the README.
Name them, and give one concrete consequence of each.
"""
rubric = [
  "Cold start across expansions: the target expansion has no history, so day-one forecasts must come from a transferred prior rather than from data",
  "The 30-day ToS retention wall on raw API data, which caps how much per-observation history any evaluation can ever see",
  "Thin per-archetype series: prices are sparse, the date spine is mostly fill, and a 28-day label is missing wherever the future date has no observation",
  "Event shocks: prices move on discrete scheduled events (launches, seasons, races, patches) rather than on smooth trends",
]
answer = """
Cold start. A new expansion ships with items that have never been listed. The
whole archetype apparatus exists to answer "what is this worth on day one" from
a mapped source archetype, and `cold_start.blend_cold_start_prediction` is where
that borrowed prior is mixed with the model output.

The retention wall. Blizzard's API terms require raw data obtained through the
API to be deleted within 30 days, and `SnapshotPruner` enforces it on both the
JSON files and the database rows. Long-horizon evaluation over raw observations
is structurally capped no matter how good the engineering is.

Thin series. Listings are sparse. `daily_agg` builds a full calendar spine in
Python and fills missing days with nulls precisely because an archetype does not
trade every day, and a 28-day label is a dict lookup that returns None whenever
that future date is empty. Per-series history is measured in dozens of rows, not
thousands, which is a large part of the argument for a single pooled
cross-archetype model in M07.

Event shocks. The event taxonomy has 28 types across expansion, patch, season,
competitive, recurring, structured content, supply, infrastructure and external
groups. Prices step
on discrete dates, and a model with no notion of those dates is trying to fit
steps with a smooth function.

Add a fifth that PLAN.md folds into its framing rather than listing: the
commodity auction house is region-wide, so there is exactly one cross-sectional
unit per archetype. That is q08 and q10.
"""
source = "PLAN.md"
anchor = "cold start across expansions, the 30-day ToS retention wall capping evaluation history, thin per-archetype series, event shocks"
see_also = ["README.md"]

[[question]]
id = "m01-q06"
kind = "mcq"
prompt = """
Blizzard's API terms require deletion of API data within 30 days, and this repo
enforces that in `governance/pruner.py`. Exactly what is deleted, and what
survives?
"""
answer = """
Raw per-observation data is deleted: the JSON snapshot files on disk and the
`market_observations_raw` rows, with `market_observations_normalized` deleted
first because those rows are foreign-key children. Derived artifacts are kept:
the daily rollup tables, the Parquet feature datasets and the model weights.
The pruner docstring states that split explicitly and calls the derived layer
the one that survives the 30-day window.

That split is what makes the system viable at all. If rollups aged out too,
there would be no history to train on beyond a month. Instead, history
accumulates in derived form, and only forward in wall-clock time from the day
capture started.

Hold on to the second half of that sentence, because it is the sharpest
constraint in the project. The commodities endpoint serves only the current
snapshot. There is no historical endpoint. So an hour that was never captured
cannot be recovered later at any price, and the April to July 2026 outage is a
permanent hole in the local rollups rather than a backfill task.

PLAN.md's ceiling is honest that the current split is defensible rather than
settled: the principled version is a derived-aggregate archive designed from the
start to be clean under the terms and to outlive the raw window, plus an
independent historical source for backfill.
"""
options = [
  { text = "Raw snapshot files and raw observation rows go (normalized children first, for the FK); rollups, Parquet features and model weights stay", correct = true },
  { text = "Everything derived from API data goes, rollups included, since the rollups are also API-derived", note = "The pruner docstring rules this out in as many words: derived artifacts are not pruned and are the layer that survives the window. If it were true, no model could ever be trained on more than 30 days." },
  { text = "Only the JSON files on disk; the database rows are the system of record and are kept", note = "Backwards. The pruner deletes rows in both observation tables as well as the files, and it deletes the normalized rows first so the foreign key onto raw is satisfied." },
  { text = "Raw is kept 30 days and can be re-fetched from the API afterwards if it is needed again", note = "There is nothing to re-fetch. The commodities endpoint returns only the current snapshot, which is why cloud capture exists and why a missed hour is gone for good." },
]
source = "wow_forecaster/governance/pruner.py"
anchor = "artefacts (daily rollup tables, Parquet features, model weights) are NOT"
see_also = ["config/default.toml"]

[[question]]
id = "m01-q07"
kind = "predict"
prompt = """
Ingestion on this machine was dead from 2026-04-08 to 2026-07-20. It has since
been restored, cloud capture into R2 has been live since 2026-07-20, and
`sync-snapshots` is implemented and working.

What can be recovered for the missing 105 days?
"""
answer = """
Nothing. Those dates stay empty in the local rollups permanently.

Three separate facts have to line up before you can recover a past hour, and for
that window none of them do. The API serves only the current snapshot, so there
is no historical endpoint to ask. The cloud bucket only started receiving
objects on 2026-07-20, so there is no stored copy of anything earlier.
`sync-snapshots` refuses to read past the retention window anyway, since those
rows would be deleted by the next pruner run.

The right conclusion is not "add a backfill feature". It is that capture is the
only moment recovery is possible, and every guard added after the outage
(the lock takeover, the freshness gate, the health alert, the cloud capture, the
gap guard) exists because that moment does not come back. M11 and M14 are the
full version of this argument.

A practical consequence for evaluation: any long-horizon backtest has to work
around a hole in the middle of its date range, and the 30-day retention window
means raw observations from before the hole are gone as well.
"""
options = [
  { text = "Nothing: the API has no historical endpoint, the bucket has no objects from before 2026-07-20, and sync-snapshots will not read past retention anyway", correct = true },
  { text = "Run sync-snapshots --since 2026-04-08 to drain the bucket for the missing window", note = "The command would run and find nothing. Cloud capture started 2026-07-20; --since widens the listing window, it does not create objects that were never written." },
  { text = "Raise retention.raw_snapshot_days above 30 and re-ingest the window", note = "Two problems. It would break the 30-day ToS requirement the pruner exists to enforce, and there is still no source to re-ingest from." },
  { text = "The rollups self-heal, because the rollup step upserts both the previous and the current UTC date on every run", note = "That previous-date upsert completes the tail of a day that has observations. It cannot invent observations for a day where none were ever written." },
]
source = "README.md"
anchor = "hour missed while this machine slept is unrecoverable from the API; draining the"
see_also = ["docs/cloud-capture.md"]

# ── Region-wide commodities and realm handling ────────────────────────────────

[[question]]
id = "m01-q08"
kind = "recall"
prompt = """
The commodity auction house has been region-wide since patch 9.2.7. Work out
what that implies for every place a realm or a faction appears in this system.
"""
rubric = [
  "realms.defaults is [\"us\"], and \"us\" is a region standing in for the region-wide commodity AH, not a realm slug",
  "Every parsed record is tagged faction = \"neutral\", because commodity listings are not faction-segregated",
  "There is one price series per archetype rather than one per realm, so realm_slug is effectively a constant column",
  "Per-realm slugs are reserved for future per-connected-realm BoE auctions, which are the genuinely realm-scoped market",
]
answer = """
One API call covers the whole region. `_fetch_blizzard_commodities` fetches
once, tags every record with `realm_slug = blizzard.region` (which is the string
"us") and `faction = "neutral"`, and that is the entire market.

So the realm dimension that runs through the schema, the rollups, the drift
detector and the CLI options is real in shape and degenerate in content. Every
`(archetype, realm)` series is an `(archetype, "us")` series. Keeping the column
is the right call, because non-commodity BoE auctions genuinely are per
connected realm and the config comment reserves per-realm slugs for exactly
that. But do not read the column as evidence that cross-realm variation is being
modeled today.

Faction is the same story in miniature. It is a column, it is always
"neutral", and the ingest docstring says why rather than leaving a reader to
infer it.

The practical fallout is real and it is q09: the Streamlit dashboard hardcodes
four per-realm slugs, none of which has ever had a row.
"""
source = "config/default.toml"
anchor = "# \"us\" = region-wide commodity AH (covers all US realms since patch 9.2.7)."
see_also = ["wow_forecaster/pipeline/ingest.py"]

