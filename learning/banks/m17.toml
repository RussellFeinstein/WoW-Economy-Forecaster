]
answer = """
The five weights live in the total property on ScoreComponents: opportunity 0.35,
liquidity 0.20, volatility 0.20 (subtracted), event_boost 0.15, uncertainty 0.10
(subtracted). They are bare float literals in the method body, not read from config
and not named anywhere. The module docstring restates the same formula at the top,
so the numbers actually appear twice, which is its own small drift risk.

The #32 ScoringPolicy extraction would lift those five numbers into a named object
that the scorer takes as an argument. The mechanical change is small; the
consequence is not. Today the ranking policy is a constant with no name, so there
is nothing to compare it against. Turning it into a parameter means a second policy
can exist as a distinct, labeled thing, and two policies over the same forecasts is
the minimum the A/B test needs. The arbitrariness of the specific weights is a
real critique, but the blocking problem is that they are frozen into a method where
no alternative can be expressed.
"""
