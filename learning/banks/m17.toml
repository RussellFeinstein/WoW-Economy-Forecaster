# ── Where the two questions meet ──────────────────────────────────────────────

[[question]]
id = "m17-q15"
kind = "recall"
prompt = """
An interviewer says: "your model has a decent MAE. Does it make money?" Give the
ninety-second answer, including what you would build to find out and what would
count as a real yes.
"""
rubric = [
  "MAE and profit are different questions over different populations, and I do not currently know the profit answer",
  "A paper-trading simulator executes the recommendations with auction-house fees and per-horizon exit rules over the window where actuals exist",
  "It reports an equity curve and P&L against random-portfolio and buy-everything, not just a total return",
  "A real yes is beating both comparators, and the live A/B (which needs weeks of wall clock) confirming it forward, not just in replay",
]
answer = """
A version that lands:

"Honestly, I do not know yet, and that gap is the point. MAE tells me the forecast
is close on average across every archetype. Profit is a different question: it only
counts the archetypes I actually trade, sized by position, and it has to clear the
auction-house cut. A model can win on MAE and lose on gold if it is calibrated
everywhere except the rows it bets on.

To answer it I would run a paper-trading simulator: take the daily recommendations,
execute them with fees and a per-horizon exit rule (a 7-day signal is held 7 days),
and backfill over the Feb-through-April window where real prices exist to mark the
trades against. I would report the equity curve, not just the total return, because
the total hides drawdown and whether the return was one lucky trade or steady
accumulation.

A positive number alone would not convince me. I would compare against two
baselines: buy-everything, which is pure market beta with no selection, and a
random portfolio of the same size, which fixes exposure and isolates whether my
specific picks carry skill. Beating both is the bar. And because the 28-day
forecasts take weeks to mature, the live A/B has to run on wall clock, so I would
start its clock early and treat the fast offline replay as suggestive, not as the
verdict."

That last distinction, between a replay that ranks policies over a past window and
a live test that earns a forward claim, is what separates someone who understands
evaluation from someone who ran a backtest once and believed it.
"""
source = "docs/ROADMAP.md"
anchor = "P&L and equity curves report against random-portfolio and buy-everything baselines."
see_also = ["wow_forecaster/recommendations/scorer.py"]

