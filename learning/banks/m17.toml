[[question]]
id = "m17-q13"
kind = "recall"
prompt = """
The simulator design specifies per-horizon exit rules and backfills over the
Feb-Apr window. Explain what a per-horizon exit rule is and why the backfill is
restricted to that window.
"""
rubric = [
  "A buy driven by an h-day forecast is closed h days later, so the holding period matches the horizon the signal was made on",
  "Without a defined exit, a P&L is undefined: you cannot book profit until you say when you sell",
  "Backfill needs actual realized prices to mark trades to, and those only exist where rollup history survives",
  "Feb-Apr is the window where actuals exist; the 30-day raw retention wall and the outage bound how much history there is",
]
answer = """
A per-horizon exit rule ties the holding period to the horizon that generated the
signal. A buy made on the strength of a 7-day forecast is closed out 7 days later;
a 28-day signal is held 28 days. That is what makes the trade well-defined: a
recommendation without an exit has no P&L, because profit is a round trip and you
have to say when the round trip closes. Matching the hold to the horizon also keeps
the test honest, since the forecast only claimed to know the price at that horizon,
not at some other arbitrary sell date.

The backfill is restricted to Feb-Apr because a paper trade can only be marked to
prices that actually happened, and those live in the rollup history. That history
is bounded: raw observations are capped at 30 days by the Terms of Service, the
durable rollups reach further back, and the April lock outage cut the series off.
Feb-Apr is the stretch where enough real prices exist to open a trade and see it
mature. You cannot backfill a P&L over a period whose actuals were never captured,
which is the same retention wall that limits every long-horizon evaluation in this
repo.
"""
source = "docs/ROADMAP.md"
anchor = "Does it make gold? A paper-trading simulator executes recommendations with auction-house fees"

