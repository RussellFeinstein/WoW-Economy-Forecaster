31 + 30 + 31 + 30 + 23 = 145 days. Nothing outside that range is generated,
however wide the request was.

The archetype list is the other half of the shape and it is easy to miss: it
comes from a DISTINCT query with no date filter, so it is every archetype that
has ever appeared in the rollup for this realm, not just those active in the
window. An archetype that stopped trading in April still gets 145 rows, most of
them spine-only.

The first row is (archetype_id = smallest id, realm, 2026-03-01). Whether its
price fields are populated depends on whether that archetype had data that day.
If not, it is a spine-only row: prices None, obs_count 0, quantity_sum None,
is_volume_proxy True.
"""
options = [
  { text = "2,900 rows: 20 archetypes x 145 dates, spanning 2026-03-01 to 2026-07-23", correct = true },
  { text = "7,300 rows: 20 archetypes x 365 dates, with all-NULL rows outside the data extent", correct = false, note = "This is the unclamped answer. spine_start and spine_end are clamped to the data bounds before the range is generated, so no row exists for a date outside [data_min, data_max]. The docstring in this file still describes the unclamped behavior, which is why the guess is reasonable and still wrong." },
  { text = "An empty list, because the requested range extends past the available data", correct = false, note = "The empty return fires only when spine_start > spine_end after clamping, or when start_date > end_date on input. A request wider than the data is normal and gets the intersection." },
  { text = "2,900 rows, but only for archetypes with at least one observation inside the window", correct = false, note = "The archetype list query carries no date filter: it is DISTINCT archetype_id for the realm across all time. An archetype dormant for the whole window still contributes a full column of spine-only rows." },
