[[question]]
id = "m03-q11"
kind = "find"
prompt = """
fetch_daily_agg's own docstring contradicts its code about one specific case.
Find the sentence, say what the code actually does, and say which behavior came
first.
"""
rubric = [
  "The docstring says that if start_date is before the earliest observation, the spine still produces NULL rows at the beginning",
  "The code clamps spine_start to max(start_date, data_min), so no leading NULL rows are produced",
  "The docstring describes the pre-clamp behavior and was not updated when the clamp landed",
  "Same paragraph also says rows outside the data extent have obs_count = 0, which cannot happen now because those rows are not generated",
]
answer = """
The sentence is in the Args-preceding paragraph: it says that if the requested
start_date is before the earliest observation, the Python spine still works
because it simply produces NULL rows at the beginning, and that rows outside the
data extent have obs_count = 0 with all price fields None.

The code does the opposite at both ends. spine_start = max(start_date, data_min)
and spine_end = min(end_date, data_max), so a request that extends past the data
in either direction is silently narrowed and no row outside the data extent is
ever constructed. The obs_count = 0 rows the docstring describes do exist, but
only for holes inside the data extent, never outside it.

The docstring is the older behavior left in place when the clamp was added. It is
a small drift and it costs a specific thing: someone reading only the docstring
would conclude the spine is a reliable calendar and would not predict the
frozen-window failure in q09. The clamp is precisely what made the outage
invisible, and the docstring says the clamp is not there.

Fixing it is a two-line doc edit and would be a legitimate patch-level PR. That
is the point of the find questions: half the defects in a codebase this age are
sentences, not statements.
"""
source = "wow_forecaster/features/daily_agg.py"
anchor = "``start_date`` is before the earliest observation, the Python spine still"

[[question]]
id = "m03-q12"
kind = "mcq"
prompt = """
fetch_daily_agg picks between a rollup fast path and a legacy path that scans the
normalized table. The check is _rollup_has_data: does this realm have any row at
all in daily_rollup_archetype?

Rollups exist for 2026-03-01 to 2026-03-20. The normalized table holds data
through 2026-07-23. What comes back for a build over the full range?
"""
answer = """
Only 2026-03-01 through 2026-03-20. Four months of normalized data is invisible,
and nothing says so.

The reason is that the path choice and the bounds query are the same decision.
_rollup_has_data returns True on a single matching row, and from that point every
subsequent query in the function reads the rollup: the bounds come from
_ROLLUP_BOUNDS_SQL, so data_max is the rollup's newest date, not the normalized
table's. The clamp from q09 and q10 then narrows the spine to the rollup's extent
and the build proceeds normally over a short window.

This is the same failure shape as the outage, one layer in. A pipeline that
derives its own extent from a cache cannot tell a complete cache from a stale
one. It is not hypothetical here either: the 2026 restore ran with rollup
coverage at 22 dates while the normalized table held more, and backfill-rollups
exists precisely because the two can diverge.

The mitigation that would actually work is a freshness comparison rather than an
existence check: compare MAX(obs_date) in the rollup against MAX(observed_at) in
the normalized table and either backfill or fall back when they disagree. The
existence check is cheap and was chosen for that reason. Know what it buys and
what it cannot see.
"""
options = [
  { text = "20 days of spine, clamped to the rollup's extent, because the bounds query reads the rollup once the fast path is chosen", correct = true },
  { text = "The full range, because the bounds query always reads the normalized table and only the daily aggregates come from the rollup", note = "Both queries switch together. bounds_sql is assigned from the same use_rollup flag as daily_sql, so choosing the fast path also chooses where the extent comes from." },
  { text = "20 days of populated rows followed by all-NULL spine rows through July", note = "That would require the spine to extend past data_max. The clamp is min(end_date, data_max), so dates past the rollup's newest are not generated at all." },
  { text = "The legacy path is used, because 20 days of rollup coverage is below the threshold for the fast path", note = "There is no threshold. _rollup_has_data runs a LIMIT 1 existence check, so one row anywhere for the realm commits the whole build to the rollup path." },
]
source = "wow_forecaster/features/daily_agg.py"
anchor = "# Choose fast path (rollup) or legacy path based on data availability."

[[question]]
id = "m03-q13"
kind = "recall"
prompt = """
Spine-only rows carry price_mean = None and obs_count = 0 but a real forward
target whenever the target date happens to land on a day with data. Explain how
those rows reach the training matrix and what the fix is.
"""
rubric = [
  "The spine emits a row for every (archetype, date) whether or not observations exist",
  "The dataset builder attaches the forward label price(obs_date + h), which is a lookup on a different date and can be non-null",
  "LightGBMForecaster.fit filters rows only on a null target, so a row with every feature null and a real label survives",
  "The model then trains on rows with no signal in any feature and a genuine label, which is pure noise",
  "Fix: also require a usable feature, price_mean non-null being the simplest rule, either at dataset build or next to the target filter",
]
answer = """
The chain is short and each link is individually reasonable.

The spine deliberately emits a row for a day with no observations, because
positional lag features need it (q08). The dataset builder attaches the target
price(obs_date + h), which is a lookup at a different date, so a gap day at T can
easily have a real price at T + h. The fit-time filter in lgbm_model.py keeps
every row whose target is non-null and asks nothing about the features. So rows
with every price feature null and a genuine label go into the matrix.

That is noise with a label attached. The model cannot condition on anything, so
the best it can do on those rows is learn the unconditional mean of the target,
which drags the fit toward a constant.

Issue #71 measured it after the 96-day gap: 100 contaminated target cells in one
day's training Parquet, 20 rows at 1d (obs_date 2026-07-20 with a target landing
on the fresh 07-21), 40 at 7d, 40 at 28d, roughly 3 percent of usable rows per
horizon. The proposed fix is one predicate: require price_mean non-null, either
in dataset_builder or beside the existing target check.

The framing that makes this worth studying: it is the mirror image of the leakage
check everyone runs. The gap verification confirmed no row carries a target
pointing into the gap. Nobody checked the other direction, rows inside the gap
carrying targets pointing out of it. And the condition is not exotic. It recurs
in miniature every time a single spine day has no data, which on a sparse
archetype is often.
"""
source = "wow_forecaster/ml/lgbm_model.py"
anchor = "train_valid = [r for r in train_rows if r.get(target_col) is not None]"
see_also = ["wow_forecaster/features/daily_agg.py", "docs/postmortem-2026-04-lock-outage.md"]

# ── Rollups, the UTC anchor, and index-serviceable predicates ────────────────

[[question]]
id = "m03-q14"
kind = "recall"
prompt = """
The hourly rollup step used to anchor on the machine's local date and upsert one
date. It now anchors on an injectable UTC clock and upserts two.

State both defects the old version had, and say which one the previous-date
upsert fixes.
"""
rubric = [
  "Observations are stamped UTC but the target date was the local calendar date, so the two disagreed by the UTC offset",
  "An evening run on a US machine wrote UTC-stamped rows for tomorrow's UTC date and then rolled up today's local date, producing zero rollup rows for what it had just ingested",
  "Rollups lagged intraday by up to the offset and only self-healed on the next local day's run",
  "The second defect: a machine that went down before the next local day lost that UTC day's tail permanently",
  "The previous-date upsert fixes the tail: rows arriving after the last pre-midnight run are only ever rolled up by a post-midnight run, so re-doing yesterday is what closes each UTC day",
]
answer = """
Two defects, one root cause. Observations carry UTC timestamps; the rollup step
targeted date.today() in local time.

Defect one is the mismatch. This was found during the 2026 restore: a 22:43 EDT
run ingested 237,983 rows stamped with the next UTC date and then upserted the
rollup for the local date, which matched none of them. Zero rollup rows for a
successful ingest. It self-healed the following day, so the symptom was a lag of
up to the UTC offset rather than a permanent hole, which is exactly why it went
unnoticed.

Defect two is the tail, and it is the one that survives fixing the timezone.
Observations landing in the final hours of a UTC day arrive after the last run
that fires before UTC midnight. No run inside that UTC day ever sees them. Only a
run after midnight can roll them up, and it will only do so if it looks
backwards. Hence the loop over (today_utc - 1 day, today_utc): the previous-date
upsert is what actually completes each UTC day, and the current-date upsert is
what keeps the day fresh as it fills.

Re-upserting a finished date costs nothing correctness-wise, because the
statement is an idempotent recompute-and-replace: it recounts the same source
rows and writes the same values, a zero-delta upsert. It does cost a query per
realm per table per run, which is what made the predicate rewrite in q16 worth
doing.

The clock is injectable (run(now=...)) so the incident can be pinned in a test
from any timezone. That pattern is applied in about three places in this repo and
absent in twenty; PLAN.md recommends extending it opportunistically rather than
as a sweep.
"""
source = "wow_forecaster/pipeline/orchestrator.py"
anchor = "previous-date upsert is what completes each day"
see_also = ["wow_forecaster/db/rollup.py", "CHANGELOG.md"]

[[question]]
id = "m03-q15"
kind = "mcq"
prompt = """
Someone proposes dropping the previous-date upsert and keeping only the current
UTC date, on the grounds that rollups self-heal anyway.

What breaks?
"""
answer = """
The tail of every UTC day stops being written by anything, so a machine that is
off or asleep across the seam loses that day permanently.

Follow the timing. The hourly task fires at :16. The last firing before UTC
midnight is 23:16 UTC, which is not the end of the day: the 23:16 to 00:00
window's observations arrive in the 00:16 run, which is already the next UTC
date. With only a current-date upsert, that run rolls up a UTC day 16 minutes
old and never touches the one that just closed. Nothing else in the pipeline
revisits a past date.

"It self-heals" was true of the old local-date bug for a different reason: the
local date lagged the UTC date, so the next day's runs happened to target the
previous UTC date and swept it up. Remove the lag by anchoring on UTC and that
accidental backfill disappears. The two-date loop is the deliberate version of
what the bug was doing by accident.

The relevant hardware fact makes it concrete: this machine sleeps between runs
and a powered-off machine does not wake. Missing a single post-midnight run is
routine, not exceptional, which is why the recompute is worth its cost.
"""
options = [
  { text = "Observations from the last part of each UTC day only arrive in post-midnight runs, so nothing would ever roll them up and a machine down across the seam loses that day's tail", correct = true },
  { text = "Nothing breaks: backfill-rollups can reconstruct any missing date on demand", note = "It can, but only from market_observations_normalized, and those rows are deleted after retention.raw_snapshot_days. A hole discovered more than 30 days later is unreconstructable. The rollups are the durable layer precisely because the source is not." },
  { text = "The upserts would no longer be idempotent, so re-running a date would double-count", note = "Idempotency is unaffected. The statement recomputes each date's aggregates from source rows and replaces them via ON CONFLICT DO UPDATE, so re-running any date is a zero-delta write. That property is what makes the second upsert cheap, not what depends on it." },
  { text = "The daily forecast would fail its freshness gate, so the loss would at least be loud", note = "The freshness gate reads the newest normalized observation, not the rollup. Normalization would be current while the rollups had a hole, so the gate would pass and the gap would stay silent." },
]
source = "wow_forecaster/db/rollup.py"
anchor = "via UPSERT (two dates so post-midnight runs complete the prior day's tail)."

[[question]]
id = "m03-q16"
kind = "recall"
prompt = """
The rollup UPSERTs used to select rows with DATE(observed_at) = ?. They now use
a half-open range on the bare column, and DATE(observed_at) survives only in the
SELECT list and GROUP BY.

Explain why the first form cannot use an index, why the second can, and why the
two return the same rows.
"""
rubric = [
  "The index stores raw observed_at values in sorted order; wrapping the column in DATE() means SQLite cannot map the constant to a contiguous key range",
  "So it evaluates the expression row by row: a full scan of the realm's rows, not a seek",
  "The range form compares the bare column, so idx_obs_norm_realm_outlier_time serves it as a seek plus a scan of exactly the matching keys",
  "observed_at is zero-padded ISO-8601 text, so lexicographic order equals chronological order and the 10-character date prefix dominates the comparison",
  "DATE() in the SELECT list and GROUP BY cannot affect index selection, and with the range covering one date it produces the same single group",
]
answer = """
An index on (realm_slug, is_outlier, observed_at) is a sorted structure over the
stored column values. A query planner can use it when the predicate defines a
contiguous range of those values. DATE(observed_at) = '2026-07-23' does not:
SQLite would have to invert DATE() to know which stored strings satisfy it, and
it does not reason about function inverses. So it falls back to reading rows and
evaluating the expression on each one. On a table heading for its 30-day steady
state, and with two dates x two rollup tables x one run per hour, this was on
track to be the hottest DATE() site in the codebase.

The rewrite compares the raw column: observed_at >= '2026-07-23' AND observed_at
< DATE('2026-07-23', '+1 day'). Both bounds are constants of the same type as the
stored values, so the planner seeks to the first matching key and walks forward.

Equivalence comes from the storage format. observed_at is zero-padded ISO-8601
text, so lexicographic comparison and chronological comparison agree, and the
first ten characters are the date. Every timestamp on 2026-07-23 sorts at or
after the bare string '2026-07-23' and strictly before '2026-07-24'. Same rows.

DATE(mon.observed_at) stays in the SELECT list and GROUP BY, where it cannot
influence index selection, and since the range covers exactly one date it yields
the one group the equality predicate used to produce.

The pattern generalizes and the repo applies it in three places: here, in the
health-check coverage queries, and in the pruner's range deletes. The rule to
carry: do not put a function on the indexed side of a predicate. Transform the
constant instead, or add an expression index if you truly need the function.
There is one more twist in health.py worth knowing, that SQLite's one-probe
min/max optimization requires a bare column and exactly one aggregate per query,
which is why a single MIN/MAX query there was split into two.
"""
source = "wow_forecaster/db/rollup.py"
anchor = "wrapping the column in ``DATE()`` there would force a table scan (issue #65)."
see_also = ["wow_forecaster/reporting/health.py", "wow_forecaster/db/schema.py"]

[[question]]
id = "m03-q17"
kind = "predict"
prompt = """
The upper bound of the rollup range is written as:

    AND mon.observed_at <  DATE(?, '+1 day')

with the parameter '2026-07-23'. Four rows exist for the realm with these
observed_at values, all with is_outlier = 0:

    A  "2026-07-23T00:16:04"
    B  "2026-07-23T23:59:59"
    C  "2026-07-24"
    D  "2026-07-22T23:59:59"

Which are included, and does DATE() on the bound reintroduce the scan problem?
"""
answer = """
A and B are in. C and D are out. And no, the DATE() call on the bound does not
cost anything.

The bound expression contains no column reference. DATE(?, '+1 day') is a
function of a bind parameter, so SQLite evaluates it once and compares the result
against the indexed column. That is the whole trick: the function moved from the
column side to the constant side. Whether a predicate can use an index depends on
which side the transformation sits on, not on whether a function appears at all.

Row by row. A: '2026-07-23T00:16:04' >= '2026-07-23' and < '2026-07-24'. In.
B: same, and the T-suffixed string still sorts before '2026-07-24'. In. That is
the important case, because it is the tail-of-the-day row from q14 and q15.
C: '2026-07-24' is not < '2026-07-24'. Out, correctly, since it belongs to the
next date's group. D: '2026-07-22T23:59:59' < '2026-07-23'. Out.

Worth noticing what C shows: a bare date string with no time component sorts
before every timestamp on that date, which is exactly the behavior the half-open
bound needs. It works because ISO-8601 is zero-padded and the separator 'T' sorts
after every digit, so a longer string with the same 10-character prefix stays
inside the date's range.
"""
options = [
  { text = "A and B included, C and D excluded; DATE() applies to the bind parameter, not to a column, so the predicate is still index-serviceable", correct = true },
  { text = "A, B and C included, D excluded; DATE(?, '+1 day') is inclusive of the following midnight", note = "The comparison is strictly less than, and '2026-07-24' is not less than '2026-07-24'. If it were included, every midnight-stamped row would be counted in two dates' rollups." },
  { text = "A and B included, C and D excluded, but the DATE() call still forces a scan because a function appears in the WHERE clause", note = "What defeats an index is a function wrapping the indexed column, which prevents mapping the predicate to a contiguous key range. A function over a bind parameter is evaluated once to a constant and is harmless." },
  { text = "Only A is included; B falls outside because its time component pushes it past the date bound", note = "Backwards. '2026-07-23T23:59:59' shares the 10-character date prefix and the T separator sorts after every digit, so it lands inside the range. If it did not, the last hours of every day would be lost from the rollups, which is the exact failure the two-date upsert exists to prevent." },
]
source = "wow_forecaster/db/rollup.py"
anchor = "AND mon.observed_at <  DATE(?, '+1 day')"

[[question]]
id = "m03-q18"
kind = "recall"
prompt = """
Three tables could answer "what was this archetype's mean price on 2026-07-23":
market_observations_normalized, daily_rollup_archetype, and the training Parquet.

Say what each one is for, which one is durable, and what the rollup stores
instead of a mean.
"""
rubric = [
  "market_observations_normalized is per-scan grain and is deleted with its parent raw rows at retention.raw_snapshot_days",
  "daily_rollup_archetype is the durable daily layer: the pruner never touches it, so it outlives the 30-day raw window",
  "The training Parquet is a derived artifact rebuilt on demand from the rollup, not a source of truth",
  "The rollup stores additive components (price_sum, price_obs_count, price_sum_sq) rather than a mean, so rows can be recomputed and merged, and variance derived",
  "daily_agg divides price_sum by price_obs_count to reconstruct price_mean at read time",
]
answer = """
market_observations_normalized is the per-scan grain, one row per item per realm
per snapshot. It is the input to everything and it is temporary: the pruner
deletes it alongside the raw rows it derives from, at retention.raw_snapshot_days
(30, set by the API terms of service). Anything you need past 30 days cannot live
here.

daily_rollup_archetype and daily_rollup_item are the durable layer. The pruner
never touches them, which is the whole reason they exist beyond query speed. They
are also what makes the 30-day retention wall survivable: the raw window is
capped, the derived daily aggregates are not. PLAN.md names escaping that wall as
the binding data constraint on this project, and a ToS-clean derived archive is
the answer it proposes.

The training Parquet is a derived artifact. It is rebuilt from the rollup by
build-datasets and carries a manifest; losing it costs a rebuild, not history.

The design detail worth taking away: the rollup does not store a mean. It stores
price_sum, price_obs_count, price_sum_sq, price_min, price_max and the
quantity-weighted equivalents. Sums are additive and means are not, so a rollup
of sums can be recomputed for a partial day, merged across dates, and used to
derive variance via the same E[X^2] - E[X]^2 identity from q04, all without going
back to the source rows. daily_agg reconstructs price_mean at read time with
CASE WHEN price_obs_count > 0 THEN price_sum / price_obs_count.

That is the standard shape for a pre-aggregation layer: store the additive
components, derive the statistic. Storing the mean would make the two-date upsert
in q14 a merge problem instead of an idempotent replace.
"""
source = "wow_forecaster/db/rollup.py"
anchor = "rollup instead of scanning the full 110M-row normalized table."
see_also = ["wow_forecaster/governance/pruner.py", "PLAN.md"]
