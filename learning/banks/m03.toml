# ── The rolling z-score: pipeline/normalize.py ────────────────────────────────

[[question]]
id = "m03-q01"
kind = "recall"
prompt = """
NormalizeStage computes a z-score for every observation it writes. Name the
grain the baseline is computed at, the rows it is computed over, and the two
things the z-score is actually used for downstream.
"""
rubric = [
  "The baseline is per (item_id, realm_slug), not per archetype and not global",
  "Mean and std come from market_observations_normalized over the last normalize_rolling_days (default 30), non-outlier rows only",
  "It sets is_outlier when |z| > outlier_z_threshold (default 3.0)",
  "is_outlier = 1 rows are then excluded from both rollup tables and from every daily aggregate, so the flag removes the row from the series",
]
answer = """
Grain: (item_id, realm_slug). Not archetype. That matters, because everything
downstream of this stage aggregates to archetype, so the outlier decision is made
at a finer grain than the thing being forecast. An item whose price jumped is
judged against its own history, not against the category average, which is the
right call.

Rows: prior rows in market_observations_normalized inside a rolling window of
config.pipeline.normalize_rolling_days calendar days (default 30), filtered to
is_outlier = 0.

Use: the z-score itself is stored on the row, but the load-bearing output is the
boolean it produces. is_outlier = |z| > outlier_z_threshold, default 3.0. Both
rollup UPSERTs and the legacy daily_agg query carry AND mon.is_outlier = 0, so
flagging a row does not annotate it, it deletes it from the daily series.

Worth holding onto: a symmetric z threshold on prices is a modeling assumption,
not a neutral one. Auction prices are bounded below by zero and have a long right
tail, so a fixed |z| > 3 rule flags more upside moves than downside ones. Nothing
in the repo corrects for that, and no question here pretends otherwise.
"""
source = "wow_forecaster/pipeline/normalize.py"
anchor = "3. Compute a rolling z-score per (item_id, realm_slug) using historical mean/std"

[[question]]
id = "m03-q02"
kind = "mcq"
prompt = """
The rolling-baseline query filters to is_outlier = 0. What does that filter buy,
and what does it cost when a market genuinely changes level (a patch changes a
material's drop rate and the price permanently doubles)?
"""
answer = """
It buys baseline stability: a single spike does not inflate the std and thereby
mask the next spike, and does not drag the mean toward a price that never held.

The cost is a feedback loop on a true level shift. The new price is more than
three std from the old baseline, so it is flagged. Flagged rows are excluded from
the baseline, so the baseline stays anchored to the old regime. Flagged rows are
also excluded from the rollups, so the archetype's daily series thins out or goes
blank during exactly the regime change the forecaster most wants to see.

It does self-heal, and the mechanism is worth tracing rather than assuming. The
window is 30 days wide and rolling. Once the last pre-shift observation ages out,
the only rows left in the window are flagged ones, so the pair fails HAVING
COUNT(*) >= _MIN_ROLLING_OBS, drops out of rolling_stats entirely, and falls to
the cold-start batch path. The batch path scores a single-observation group as
z = None, which is not an outlier, so the row is written unflagged and the new
level starts rebuilding a baseline. Recovery takes up to the full window plus a
run. For a month, the series is degraded in a way nothing alerts on.
"""
options = [
  { text = "It stops a spike from corrupting future baselines, but a real level shift is flagged as a run of outliers and is excluded from both the baseline and the daily rollups until the 30-day window rolls past the old regime", correct = true },
  { text = "It stops a spike from corrupting future baselines, and a real level shift is unaffected because the mean moves with it", note = "The mean cannot move with it. Every post-shift row is flagged, and flagged rows are excluded from the query that computes the mean, so the baseline is pinned to the pre-shift regime until those rows age out of the window." },
  { text = "It has no statistical effect and exists only to keep the query on the covering index", note = "The index on (realm_slug, is_outlier, observed_at) does include is_outlier, but the filter is a modeling decision. Removing it would change every mean and std this stage computes." },
  { text = "It prevents double-counting, since an outlier row is also written to the rollup tables", note = "Backwards. Outlier rows are excluded from the rollups by the same is_outlier = 0 predicate, so they are counted nowhere rather than twice." },
]
source = "wow_forecaster/pipeline/normalize.py"
anchor = "rolling window are included so that previously flagged spikes don't corrupt"
see_also = ["wow_forecaster/db/rollup.py"]

[[question]]
id = "m03-q03"
kind = "predict"
prompt = """
The normalized table is empty (fresh database, or the state right after the 2026
restore). One hourly ingest lands: roughly 314,000 rows, one observation per
item, all for realm "us". NormalizeStage runs.

What do the z_score and is_outlier columns look like on those rows?
"""
answer = """
z_score is NULL on essentially every row and is_outlier is 0 on all of them.

Trace it. _fetch_rolling_stats returns an empty dict, because there is no
normalized history to compute a baseline from. _normalize_batch then groups the
batch by (item_id, realm_slug). A commodity snapshot carries one observation per
item, so each group holds exactly one row. That hits the len(valid_prices) == 1
branch: mean_p is the price itself and std_p is 0.0. The z-score is only computed
when std_p > 0, so it stays None, and is_outlier is None-safe and evaluates
False.

Two consequences. First, day one produces no outlier flags at all, which means
day one also loses nothing from the rollups. Second, the flag only becomes
meaningful from about the third hourly run, once at least _MIN_ROLLING_OBS = 2
prior non-outlier rows exist per pair. The postmortem's day-one gap verification
recorded an outlier rate of 3.4 to 4.5 percent, which is the third-run-onward
regime, not this one.
"""
options = [
  { text = "z_score NULL and is_outlier 0 on effectively every row: no rolling history, and each single-observation group has std 0", correct = true },
  { text = "z_score 0.0 and is_outlier 0 on every row, since each price equals its own group mean", note = "0.0 would be the answer if the code divided by std anyway. It does not: the z-score is guarded by std_p > 0, so a degenerate group yields None, not zero. The distinction matters because NULL and 0.0 mean different things to every downstream consumer." },
  { text = "z_score computed against the batch mean across all 314,000 items, with roughly 0.3 percent flagged as outliers", note = "Batch statistics are computed per (item_id, realm_slug) group, not across the whole batch. Pooling unrelated items would compare a herb against a gem, which is not a meaningful scale." },
  { text = "NormalizeStage refuses to run and logs that no baseline exists", note = "The cold-start path is deliberate, not an error. The stage writes the rows with a NULL z-score so the prices land and the baseline can start building. Refusing would mean a fresh database never bootstraps." },
]
source = "wow_forecaster/pipeline/normalize.py"
anchor = "For single-observation groups with no rolling history, z_score is None"
see_also = ["docs/postmortem-2026-04-lock-outage.md"]

[[question]]
id = "m03-q04"
kind = "recall"
prompt = """
SQLite has no STDEV, so the baseline query computes variance in one pass with
AVG(price*price) - AVG(price)*AVG(price). The Python that reads the result clamps
the value at zero before taking a square root.

Why is that clamp there, and what is the general name for the problem it papers
over?
"""
rubric = [
  "The identity Var(X) = E[X^2] - E[X]^2 is exact in real arithmetic but not in floating point",
  "It subtracts two large nearly-equal numbers, so the result loses most of its significant digits",
  "That is catastrophic cancellation, and it can produce a small negative variance",
  "A negative variance would raise or produce a complex value at the ** 0.5 step, so the code clamps to 0.0 first",
  "The numerically stable alternative is a two-pass or Welford computation, which SQL in one pass makes awkward",
]
answer = """
The identity is algebraically exact and numerically poor. E[X^2] and E[X]^2 are
both large when prices are large, and their difference is small when prices are
stable. Subtracting two nearly-equal doubles cancels the leading digits and
leaves whatever rounding error survived, which can be negative. That is
catastrophic cancellation, and it is the classic reason this identity is called
the naive variance formula.

Concretely: an item sitting at 12,000 gold with a few gold of spread gives
E[X^2] near 1.44e8 and E[X]^2 within a rounding error of it. Doubles carry about
15 to 16 significant decimal digits, so a difference six or seven orders of
magnitude below the operands has already lost most of its precision. Taking
** 0.5 of a negative would raise for floats or, in Python, return a complex
number, so the clamp is not cosmetic.

The stable alternatives are a two-pass computation (mean first, then the mean of
squared deviations) or Welford's online algorithm. Neither is expressible as a
single grouped SQL aggregate without either a second query or a user-defined
function, which is exactly the tradeoff being made here: one round trip, accept
the precision loss, clamp the sign.

The honest read is that this is fine at the magnitudes involved, and the clamp is
the right one-line defense. But note what it hides: the clamp turns an unusable
negative into 0.0, and std 0.0 makes the z-score None. A precision failure and a
genuinely constant price are indistinguishable in the output.
"""
source = "wow_forecaster/pipeline/normalize.py"
anchor = "Guard against tiny negative floating-point variance"

[[question]]
id = "m03-q05"
kind = "mcq"
prompt = """
_MIN_ROLLING_OBS = 2. A pair with two prior non-outlier observations gets a
rolling baseline; a pair with one falls back to batch stats.

What does a two-observation baseline do to the outlier flag on the third
observation?
"""
answer = """
It makes it hair-trigger. The query computes population variance, dividing by n
rather than n - 1, so with two points the std is exactly half the gap between
them. Two consecutive hourly scans of a stable item might differ by a few gold,
giving a std of a couple of gold against a mean in the thousands. Any ordinary
intraday move is then dozens of standard deviations out and gets flagged.

Then the loop from q02 engages: the flagged row is excluded from the baseline, so
the baseline stays as tight as it was, so the next row is flagged too.

The threshold exists to avoid something worse (a one-observation "baseline" has
std 0 and no scale at all), so 2 is an improvement on 1. But 2 is not a sample
size, and nothing in the repo ramps the threshold or widens the interval while
the sample is small. If you want one concrete improvement to this module, this is
it: require enough observations that the scale estimate means something, or shrink
the estimate toward a pooled archetype-level std while n is small.
"""
options = [
  { text = "The std is half the gap between the two prior prices, so the scale is tiny and ordinary moves get flagged, and the flag then keeps the baseline tight because outliers are excluded from it", correct = true },
  { text = "Nothing unusual: with n = 2 the sample variance is unbiased, so the z-score is well calibrated", note = "The query divides by n, not n - 1, so it is the population variance and is biased low. Even with Bessel's correction, an unbiased estimator with n = 2 still has enormous variance of its own, which is the actual problem." },
  { text = "The z-score is undefined because at least three points are needed for a standard deviation", note = "Two points give a perfectly well-defined std, just a nearly useless one. The code computes it and uses it, which is what makes the threshold worth arguing about." },
  { text = "It matches min_obs_for_feature = 30, so the feature layer filters those rows out anyway", note = "min_obs_for_feature is a separate config value used elsewhere and does not gate normalization. Nothing downstream re-checks how many observations backed an is_outlier decision, and once the row is flagged it is gone from the rollups." },
]
source = "wow_forecaster/pipeline/normalize.py"
anchor = "_MIN_ROLLING_OBS = 2"
see_also = ["config/default.toml"]

[[question]]
id = "m03-q06"
kind = "recall"
prompt = """
The rolling baseline is fetched once per run, before the batch loop, and its
window is expressed as datetime('now', '-N days') with no upper bound.

Name the two consequences. One is documented and defensible; one is not
documented and is a real property of the output.
"""
rubric = [
  "Every batch in one run shares one baseline instead of re-querying per batch",
  "That is documented and justified: a 30-day window dwarfs what one ingest run adds",
  "The window is anchored on wall-clock time at run time, not on each row's own observed_at, and has no upper bound",
  "So a row is scored against history that can be newer than the row itself, which matters when draining a backlog",
  "And the z-score is therefore not reproducible: re-normalizing the same raw rows later gives different values",
]
answer = """
First consequence, the documented one: the prefetch replaced a per-batch query.
The comment argues that a 30-day window dwarfs what one ingest run adds, so
every batch would have gotten effectively the same numbers anyway. That is sound.
The cost is that rows normalized late in a long run are scored against a baseline
that excludes rows normalized earlier in the same run, which at these magnitudes
is noise.

Second consequence, undocumented: the window is relative to the clock at run
time, not to the observation being scored, and it is open-ended on the right.
The predicate is observed_at >= now - 30 days, with nothing capping it above. So
the baseline is "the last 30 days of whatever is already normalized", not "the 30
days preceding this row".

In steady hourly operation the two are nearly the same thing and this does not
bite. It bites when the pipeline is behind. sync-snapshots drains cloud objects
that may be hours or a night old, and a longer catch-up drains older ones still.
Those rows are z-scored against a window whose right edge is now, which can sit
after the row's own timestamp. Normalization is a leakage surface people rarely
think about, and this is what it looks like.

The reproducibility point follows from the same fact. Every pipeline run stamps a
config_snapshot so the run can be reconstructed, but re-running normalization over
the same raw rows on a different day produces different z-scores and potentially
different is_outlier flags, because the window moved. The stage is not a pure
function of its inputs and config.
"""
source = "wow_forecaster/pipeline/normalize.py"
anchor = "AND observed_at >= datetime('now', '-{window_days} days')"
see_also = ["wow_forecaster/ingestion/cloud_sync.py"]

[[question]]
id = "m03-q07"
kind = "find"
prompt = """
An observation whose min_buyout_raw is NULL still gets written to the normalized
table. Find what goes into price_gold for that row, then find the place in the
rollup layer that exists because of it. Explain the connection.
"""
rubric = [
  "price_gold is set to 0.0 when the source price is None, because the column is NOT NULL",
  "The rollup tables store both zero-inclusive and positive-only price aggregates",
  "The docstring reason: consumers disagree about whether to filter price_gold > 0",
  "So a sentinel written at normalize time forces every downstream aggregate to carry two versions of the same statistic",
]
answer = """
In _normalize_batch the row is built with price_gold set to 0.0 whenever the
converted price is None. The column is NOT NULL in the schema, so a sentinel was
needed and zero was chosen.

The consequence is visible one layer down. daily_rollup_archetype carries both
price_sum_all / price_sum_sq_all / obs_count (zero-inclusive) and price_sum /
price_sum_sq / price_obs_count (guarded by CASE WHEN price_gold > 0), and
daily_rollup_item does the same with its _pos columns. The module docstring says
why plainly: consumers differ on whether they filter price_gold > 0.

That is the connection. A missing price and a price of zero became the same value
at normalize time, so every consumer downstream has to decide independently what
to do about zeros, and the rollup schema pays for that indecision by storing each
price statistic twice.

The alternative worth being able to argue for: make price_gold nullable and let
NULL mean "no price observed". SQL aggregates already skip NULLs, which is the
behavior every one of the price_gold > 0 guards is reimplementing by hand. The
cost is a schema migration and touching every consumer, which is why it has not
happened. But recognize the shape: a NOT NULL column plus a sentinel value is a
nullable column with the type system switched off.
"""
source = "wow_forecaster/pipeline/normalize.py"
anchor = "price_gold=price_gold if price_gold is not None else 0.0,"
see_also = ["wow_forecaster/db/rollup.py", "wow_forecaster/db/schema.py"]

# ── The date spine: features/daily_agg.py ────────────────────────────────────

[[question]]
id = "m03-q08"
kind = "recall"
prompt = """
Prices are sparse: an archetype may have no observation on a given day. The daily
aggregation still emits one row per (archetype, date) across the whole range.

Explain why that densification is required at all, and why it is done in Python
rather than by the recursive CTE plus CROSS JOIN that used to do it.
"""
rubric = [
  "Lag and rolling features index by position in a date series, so a missing day would silently shift lag_7 to mean something other than seven days",
  "The spine makes the gap explicit as a row with obs_count 0 and NULL prices, rather than invisible by absence",
  "The CTE approach forced SQLite to materialize N_dates x N_archetypes rows before the LEFT JOIN could run",
  "The Python version queries only the rows that exist and fills the rest from a dict, which is O(rows) instead of O(dates x archetypes) inside the database",
]
answer = """
Densification first. Every feature built on top of this table is positional:
lag_1, lag_7, a 7-day rolling mean. If a day with no observations simply did not
appear as a row, "seven rows back" would not be "seven days back", and the lag
would quietly mean something different for every series depending on how sparse
it was. The spine turns an absent day into a present row with obs_count = 0 and
NULL prices, which the lag and rolling code can then handle explicitly. The
postmortem's day-one verification checked exactly this: lag and rolling windows
returned None rather than fabricated values when they reached into the 90-day
gap.

Why Python. The database version had to build the full cross product first. A
recursive CTE generated the dates, a CROSS JOIN paired them with archetypes, and
only then could the LEFT JOIN attach the real aggregates, so SQLite materialized
N_dates x N_archetypes rows regardless of how few of them had data. The Python
version inverts it: fetch only the rows that exist, index them in a dict by
(archetype_id, obs_date), generate the calendar range with a list comprehension,
and do the lookup in memory. Same output, and the expensive part now scales with
the data rather than with the size of the grid.

The generalizable point: densifying a sparse series is a cross product, and a
cross product is the one thing you want the database to do least of. Doing the
join key generation outside SQL is a legitimate optimization, not a hack, as long
as the output shape is identical.
"""
source = "wow_forecaster/features/daily_agg.py"
anchor = "for days with no data via a dict lookup.  This avoids the recursive CTE and"
see_also = ["wow_forecaster/features/lag_rolling.py"]

[[question]]
id = "m03-q09"
kind = "mcq"
prompt = """
The spine is clamped: spine_start = max(requested_start, data_min) and
spine_end = min(requested_end, data_max), where the bounds come from the data
itself.

During the 96-day ingestion outage, what did that clamp do?
"""
answer = """
It made the outage invisible to the forecast pipeline. The clamp derives the
right-hand edge of the spine from the newest row in the data, not from the
calendar. With ingestion dead, data_max stopped moving, so every daily build
produced a spine ending at the last real observation, filled it with the same
frozen history, trained on it, forecast from it, and wrote a CSV. No error, no
empty result, no short series. From the outside it looked like a healthy system
producing output on schedule.

This is root cause four in the postmortem, and its lesson is the one to carry:
a pipeline that clamps to the newest data cannot tell fresh from frozen.
Freshness is a statement about the clock, and it has to be checked against the
clock.

Note that the clamp itself is not a bug and was not removed. Extending the spine
to a requested end date beyond the data would fabricate a tail of empty rows and
push the problem into the feature layer. The fix went elsewhere: a freshness gate
in ForecastStage (max_data_age_hours, default 26) and a scheduled health check
that compares the newest observation against now. Two seams, both clock-based.
"""
options = [
  { text = "It kept the spine ending at the last real observation, so training and forecasting ran on a frozen window every day without error", correct = true },
  { text = "It produced a growing tail of all-NULL rows, so the model degraded gradually and visibly", note = "That is what an unclamped spine would have done, and it would arguably have surfaced the problem sooner. The clamp is min(end_date, data_max), so no rows past data_max are generated at all." },
  { text = "It returned an empty list once the requested start date passed the data end", note = "The empty return only triggers when spine_start > spine_end. The requested start was always well before data_max, so the function kept returning a full frozen window. An empty result would have been loud." },
  { text = "It had no effect: the health check caught the outage within hours", note = "check-data-health existed since v2.1.0 and would have caught it, but it was never registered as a scheduled task. Monitoring that is not scheduled catches nothing, which is root cause three." },
]
source = "docs/postmortem-2026-04-lock-outage.md"
anchor = "A pipeline that clamps to the newest data cannot tell"
see_also = ["wow_forecaster/features/daily_agg.py", "config/default.toml"]

