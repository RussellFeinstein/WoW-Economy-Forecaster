# M11: How this system fails.
#
# Citation rule: `source` is a path, `anchor` is a verbatim single-line snippet
# from that path. Never a line number. tests/test_learning/test_bank_integrity.py
# fails if an anchor stops matching, so editing the cited code or doc forces the
# question to be updated in the same PR. Run `wowfc learn validate` while
# authoring.
#
# This module is about the 2026-04-15 lock leak and the 96-day silent outage it
# caused, plus every guard added afterwards. It is the most transferable content
# in the track: nothing here is specific to auction houses.

# ── The outage itself ─────────────────────────────────────────────────────────

[[question]]
id = "m11-q01"
kind = "recall"
prompt = """
The postmortem says four independent failures had to line up. Name all four,
one line each.
"""
rubric = [
  "The overlap guard had no staleness handling: any existing lock read as 'previous run still active'",
  "The skip path exited 0, so Task Scheduler's Last Run Result showed success 1,933 times",
  "check-data-health existed since v2.1.0 but was never registered as a scheduled task",
  "The daily forecast could not notice, because the feature date spine clamps to the newest observation",
]
answer = """
1. **No staleness handling in the overlap guard.** `run_hourly.bat` treated the
existence of a lock file as proof that a previous run was still going. A
crash-leaked lock is indistinguishable from a live run under that rule, and
crash-leaked locks are a certainty: a .bat has no cleanup path when its process
tree is killed.

2. **The skip path exited 0.** Skipping was modeled as a normal outcome, so every
layer above the log file saw success. The word SKIPPED appeared in exactly one
place, a log nobody was reading.

3. **The health check was never scheduled.** The code that would have caught this
within hours shipped months earlier. It was never registered as a task, so it
caught nothing.

4. **The forecast pipeline could not notice.** The date spine clamps to the data
extent, so training and inference kept running on a frozen window without an
error. Forecast CSVs kept appearing daily, which reads as a healthy system.

A fifth factor did not cause the outage but shaped the restore: the retention
pruner deletes raw rows past 30 days on every hourly run, so by discovery time the
wedged lock was the only thing standing between the surviving history and a mass
delete.

One honest note while reading the timeline: it dates the last successful ingest to
2026-04-07 and the lock-leaking crash to 2026-04-15. The eight days between them
are not accounted for anywhere in the document.
"""
source = "docs/postmortem-2026-04-lock-outage.md"
anchor = "A crash-leaked lock is indistinguishable from a running job under that rule"

[[question]]
id = "m11-q02"
kind = "mcq"
prompt = """
Four failures lined up. Which one made the outage invisible at the layer that was
actually being watched?
"""
answer = """
The exit-0 skip path. That is the failure that removed the signal from the only
surface anyone looks at without being asked to.

Windows Task Scheduler shows Last Run Result. It showed 0 for 1,933 consecutive
runs. Every other failure in the chain contributed a missing control or a missing
recovery; this one actively produced a green light. A system that is broken and
silent is worse than a system that is broken and loud, because the silent one
consumes the attention budget of a working system.

The postmortem puts it as a rule: loud beats correct-but-quiet. Skipping really
was the correct behavior under the guard's own logic, and reporting it as success
was defensible in isolation. The defect is that "correct" and "worth reporting"
were treated as the same question.
"""
options = [
  { text = "The skip path exiting 0, which made Task Scheduler's Last Run Result read success for 1,933 consecutive runs", correct = true },
  { text = "The crash that leaked the lock file in the first place", note = "Crash-leaked locks are inevitable on a long enough timeline: a .bat killed by process-tree termination has no cleanup path. The design defect is treating any lock as live, not the crash, and even with the leak a loud skip would have surfaced this on day one." },
  { text = "The health check never being registered as a scheduled task", note = "A real failure and one of the two cheap day-one catches the postmortem names. But it is an absent control rather than a false signal: nothing about it produced the green light that kept anyone from looking." },
  { text = "The retention pruner standing ready to delete the surviving history", note = "That is the fifth factor, and it made the restore harder rather than the outage longer. It never ran during the wedge, precisely because the lock stopped the run that would have called it." },
]
source = "docs/postmortem-2026-04-lock-outage.md"
anchor = "Loud beats correct-but-quiet."
see_also = ["docs/ROADMAP.md"]

[[question]]
id = "m11-q03"
kind = "recall"
prompt = """
The overlap guard was not deleted, it was given staleness handling. Describe the
rule `run_hourly.bat` uses now, including what it does when the age check itself
fails, and state the cost asymmetry that justifies the bias.
"""
rubric = [
  "A lock older than STALE_MINUTES (180) is treated as leaked: logged as STALE LOCK TAKEOVER, deleted, and the run continues",
  "A lock younger than that still skips with exit 0",
  "PowerShell exits 0 only when the lock is provably fresh, so a vanished file or any PowerShell failure falls through to takeover",
  "The asymmetry: a wedged lock already cost 96 days, while a rare double run is covered by SQLite's 30s busy timeout",
]
answer = """
The guard now asks how old the lock is rather than whether it exists. Past 180
minutes it is assumed leaked, logged as STALE LOCK TAKEOVER, deleted, and the run
proceeds. Under 180 minutes it still skips with exit 0, which is correct: a
genuinely overlapping run is a real condition and a healthy hourly run finishes in
well under an hour.

The part worth stealing is the failure bias. The PowerShell one-liner exits 0 only
when it can prove the lock is fresh. A vanished file (a race with the run that is
finishing), a PowerShell that will not start, an unresolvable path: all of them
exit nonzero, and `if errorlevel 1` means "greater than or equal to 1", so all of
them take the lock over. Uncertainty resolves toward running.

That is a deliberate choice made by comparing costs, not by picking the safer
sounding branch. Taking over a lock that was actually live means two runs write
concurrently, and SQLite's 30-second busy timeout absorbs that. Skipping a lock
that was actually leaked means the pipeline is dead until a human notices, and the
measured price of that outcome is 96 days. When the two errors cost that
differently, the guard should be tuned to make the cheap mistake.
"""
source = "scripts/run_hourly.bat"
anchor = "already caused a 96-day silent outage; a rare double run is"

[[question]]
id = "m11-q04"
kind = "predict"
prompt = """
`run_hourly.bat` fires. `data\\db\\.hourly.lock` exists and was written 20 minutes
ago. But PowerShell is not resolvable on this machine's PATH at all, so the
age-check command cannot run.

What does the script do?
"""
answer = """
It takes the lock over: logs STALE LOCK TAKEOVER, deletes the lock, and runs the
pipeline, even though the lock is only 20 minutes old and probably belongs to a
live run.

The mechanism is that an unresolvable executable leaves a nonzero errorlevel, and
the branch is `if errorlevel 1`, which tests for "greater than or equal to 1"
rather than equality. So a failed check is indistinguishable from a stale lock by
design. The comment block says so directly: the age check failing biases toward
takeover.

The consequence in this scenario is a concurrent run, which SQLite's busy timeout
is expected to survive. The alternative bias would have been to skip whenever the
check cannot be completed, and that is the exact shape of the original bug:
uncertainty resolving toward doing nothing, quietly.

Note that the block is evaluated at execution time, which is why no delayed
expansion is needed inside it. That is a cmd-specific detail, but it is the kind of
detail that silently inverts a guard if you get it wrong.
"""
options = [
  { text = "Logs STALE LOCK TAKEOVER, deletes the lock, and runs the pipeline", correct = true },
  { text = "Logs SKIPPED and exits 0, because the lock is younger than STALE_MINUTES", note = "That would require the age check to succeed and report a fresh lock. It could not run at all, and the script only skips when freshness is proven. This branch is what the original bug looked like." },
  { text = "Exits nonzero so Task Scheduler records a failure, since the environment is broken", note = "Plausible, but the script has no such branch. A broken age check is treated as a stale lock, not as a fatal environment error. Whether that is the right call is a judgement about which mistake is cheaper, and this repo chose to keep running." },
  { text = "Waits and retries the age check until PowerShell becomes available", note = "That is the sync-snapshots behavior, not the hourly wrapper's. The bat has no wait loop: it decides once and moves on, because a delayed hourly run has already missed its sample." },
]
source = "scripts/run_hourly.bat"
anchor = "set STALE_MINUTES=180"

# ── The dead-man principle ────────────────────────────────────────────────────

[[question]]
id = "m11-q05"
kind = "recall"
prompt = """
State the dead-man principle in one sentence, then give two places in this repo
where it is applied. For each, say what the "man" is and what happens when it dies.
"""
rubric = [
  "One sentence roughly: a monitor must go red when the thing it watches stops, and the alarm must not be satisfiable by the failure mode itself",
  "Cloud capture: the GitHub :06 schedule is kept as a fallback so Worker or PAT death drops coverage below the 20-hour gap guard floor and the runs go red",
  "Health check: no durable backup at all sets backup_is_stale = True, so a backup task that silently stopped is caught, not exempted",
  "Also acceptable: run_healthcheck.bat raises the alert window when the suppression flag is unverifiable, and run_hourly.bat takes over on an unverifiable lock age",
]
answer = """
One sentence: an alarm must fire when the thing it watches stops existing, and its
threshold must sit above anything the failure mode can produce on its own.

**Cloud capture (issue #83).** The Cloudflare Worker POSTs a workflow_dispatch at
:16 and :46 and is the primary trigger. The GitHub `schedule:` was thinned to a
single :06 firing rather than removed, and that single firing is the alarm. If the
Worker or its token dies, capture falls back to GitHub cron alone, which measurably
delivers only about 11 of 24 hours a day for this repo. That is below the guard's
floor of 20 distinct captured hours, so the runs turn red. The failure of the
trigger is detected by the surviving trigger being insufficient.

**Backup freshness (issue #80).** In `collect_health_report`, an empty or absent
backup directory sets `backup_is_stale = True`. Finding no backups is not "nothing
to check", it is the worst possible reading, because the point of the check is to
catch a task that stopped running. A check that treats absence as a pass is not a
check.

Two smaller instances of the same reflex: `run_healthcheck.bat` raises its alert
window when it cannot verify the suppression flag's age, and `run_hourly.bat` takes
the lock over when it cannot verify the lock's age. Both comments name the outage
as the reason. Skip-on-uncertainty is how a silent outage happens.

The general form is the negative: any alarm whose "everything is fine" state is
also reachable by the failure it watches for is decorative. Absence of a
heartbeat, absence of a backup, absence of a captured hour: all three must count as
failures rather than as missing data.
"""
source = "docs/cloud-capture.md"
anchor = "The guard floor stays at 20 deliberately; a floor the failure mode can satisfy would hide the failure."
see_also = ["wow_forecaster/reporting/health.py", "scripts/run_healthcheck.bat"]

[[question]]
id = "m11-q06"
kind = "mcq"
prompt = """
The cloud gap guard trips below 20 distinct captured UTC hours in the trailing 24.
GitHub's own cron reliably delivers about 11 hours a day for this repo. Why is the
floor 20 and not, say, 10?
"""
answer = """
Because a floor of 10 would be satisfiable by the exact failure the guard exists to
detect. If the Worker trigger dies, GitHub cron alone still delivers around 11
hours, so a floor of 10 would report green through a total loss of the primary
trigger. The alarm has to be set above the failure mode's own ceiling or it is not
an alarm.

Note also the choice of metric. The guard counts distinct UTC hours, not objects.
The Worker fires twice an hour and the fallback fires once more, so a day that
missed a third of its hours can still hold a healthy-looking object count. Counting
hours keeps the number meaning "hours are being missed" no matter how many triggers
fire per hour.

Both decisions are the same idea from two directions: pick the metric and the
threshold so the failure you care about cannot dress up as success.
"""
options = [
  { text = "A floor of 10 would still be met by GitHub cron alone, so a dead Worker would report green: the threshold must sit above what the failure mode can deliver", correct = true },
  { text = "20 out of 24 allows a four-hour tolerance budget for Blizzard API downtime and retry jitter", note = "Backwards. The floor is chosen against the failure mode's ceiling, not derived from a tolerance budget. It happens to leave slack, but if the reasoning were tolerance-first you could argue 10 down from the same premises and lose the alarm entirely." },
  { text = "Counting objects instead of hours would give the same answer, since one capture uploads one object per hour", note = "Not true here. The Worker dispatches at :16 and :46 and the GitHub fallback adds :06, so several objects can land in a single hour. An object count can look healthy on a day that missed a third of its hours, which is why the guard counts distinct UTC hours." },
  { text = "The floor should really be 24, and 20 is a concession to flakiness that weakens the guard", note = "A floor of 24 would be red on ordinary retry jitter, one dropped dispatch, or a slow runner. An alarm that is red every day is functionally off, which is a different way of losing the signal." },
]
source = "wow_forecaster/ingestion/cloud_fetch.py"
anchor = "GUARD_MIN_HOURS_DEFAULT = 20"
see_also = ["docs/cloud-capture.md"]

[[question]]
id = "m11-q07"
kind = "find"
prompt = """
`evaluate_gap_guard` has an escape hatch that returns ok even when coverage is
below the floor. Find it, say why it exists, and describe the bug that made it fire
on days that genuinely had gaps.
"""
rubric = [
  "The bootstrap rule: when no listed object is older than 24 hours, low coverage passes",
  "It exists so the first day of operation, or a resume after a 48h+ outage whose failed runs already alerted, does not report red for an expected condition",
  "Issue #68: the listing spanned only two day-prefixes, so just after UTC midnight every object older than 24h lived under a prefix that was never listed",
  "The `older` count then read 0 and the bootstrap rule fired on days with real gaps; the fix lists three day-prefixes (today, yesterday, and the day before)",
]
answer = """
The rule is: if nothing in the listing is older than the 24-hour cutoff, pass.
That is a reasonable exemption. On the very first day of operation the trailing 24
hours cannot be full, and after a long outage the failed runs have already raised
their own alarms, so a red gap guard on the first recovered run adds nothing.

The bug is what "nothing older than 24 hours" was computed from. The listing walked
day-prefixed keys, and it originally walked only today and yesterday. Just after
UTC midnight, every object older than 24 hours lives under the day-before-yesterday
prefix, which was never listed. So `older` counted 0, the bootstrap rule fired, and
a day with real gaps passed. Issue #68 fixed it by listing three prefixes.

The transferable shape: an exemption clause is a second alarm, and it needs its own
correctness argument. Here the exemption's input was derived from a listing whose
window did not reach as far back as the exemption's own reasoning required. Every
"unless" in a guard is a place where the guard can be talked out of firing, and the
guards in this repo have been talked out of firing before.
"""
source = "wow_forecaster/ingestion/cloud_fetch.py"
anchor = "Bootstrap rule: when no listed object is"

# ── Wait, do not skip ─────────────────────────────────────────────────────────

[[question]]
id = "m11-q08"
kind = "recall"
prompt = """
`cloud_sync.hourly_lock` takes the same lock file `run_hourly.bat` takes, with the
same 180-minute takeover, and deliberately differs in one way. What is the
difference, and what cost comparison produced it?
"""
rubric = [
  "The bat skips when the lock is fresh; the sync waits, polling, and then fails loudly",
  "A skipped hourly run costs one sample, which the next hour replaces",
  "A skipped catch-up run silently leaves a whole night of cloud snapshots unrecovered",
  "And an exit-0 skip is precisely the pattern that hid the 96-day outage, so failing loudly is the point",
]
answer = """
The bat skips. The sync waits, and if the wait runs out it raises `TimeoutError`
instead of returning quietly.

The reasoning is a comparison of what each skip costs. An hourly run that skips
loses one sample of a series that gets another one in an hour. A catch-up run that
skips loses whatever the cloud bucket was holding, and since `sync-snapshots` runs
on demand or on a schedule you may not be watching, a quiet skip can leave an
entire night unrecovered with no trace beyond a log line. The unrecoverable case
gets the loud behavior.

Both halves matter. Waiting alone would not be enough if the timeout then returned
0: that would recreate the original defect in a new file. The docstring names it,
which is a good habit in itself. When you write a guard whose behavior was chosen
because of a specific past failure, say so in the code, or the next person will
"simplify" it back.

Also worth noticing why a file lock is used at all rather than trusting SQLite.
Bulk inserts here run to hundreds of thousands of rows and can exceed the 30-second
busy timeout, so serialization at the database level is not sufficient. The lock is
the coarse-grained answer, and reusing the bat's lock file (rather than inventing a
second one) is what makes the two paths actually mutually exclusive.
"""
source = "wow_forecaster/ingestion/cloud_sync.py"
anchor = "skips when the lock is fresh because a skipped hourly run costs one sample;"

