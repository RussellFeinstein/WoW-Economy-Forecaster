# ── The freshness gate ────────────────────────────────────────────────────────

[[question]]
id = "m11-q10"
kind = "recall"
prompt = """
What does the freshness gate protect against, and at which two seams is it
enforced? Say why one seam is not enough.
"""
rubric = [
  "It protects against generating forecasts from frozen features when ingestion has stopped",
  "Seam 1: run_daily.bat runs check-data-health --stale-hours 26 as step 1 and exits non-zero, skipping build-datasets and the forecast",
  "Seam 2: ForecastStage._execute raises StaleDataError before any inference when the newest normalized observation exceeds config.forecast.max_data_age_hours",
  "The bat protects the scheduled path and the scheduler's visible exit code; the stage protects every other entry point, including a manual run or a future orchestrator",
]
answer = """
It protects the fourth link in the root cause chain: about 90 days of forecasts
were generated from features frozen at the last real ingest, and nothing in the
pipeline objected, because the date spine simply clamps to whatever data exists.

Seam one is `run_daily.bat`. Step 1 of 3 is `check-data-health --stale-hours 26`,
and a nonzero exit skips both the dataset build and the forecast and propagates the
code so Task Scheduler records a failure. This is the seam that makes the outage
visible: it converts a data condition into a red scheduled task.

Seam two is `ForecastStage._execute`, which checks the age of the newest
non-outlier normalized observation per realm and raises `StaleDataError` before
loading a single model. Setting `max_data_age_hours` to 0 or below disables it, and
the check takes an injectable `now` so tests are deterministic.

Two seams because they cover different things. The bat is the only place that can
stop `build-datasets` from running and can make the scheduler's Last Run Result
truthful. The stage is the only place that covers `run-daily-forecast` invoked by
hand, by the scheduler daemon, or by whatever orchestrator replaces the .bat
layer later. A guard that lives only in a Windows batch file guards only the paths
that go through that Windows batch file, and PLAN.md's phase 2 explicitly treats
the .bat hardening as requirements to be carried forward rather than implementation
details to be discarded.

There is a design point here beyond redundancy: the two seams check different
things. The bat asks the database when the last row landed. The stage asks how old
the newest observation is. A pipeline that ingests rows with stale timestamps would
fail the second check and pass the first.
"""
source = "wow_forecaster/pipeline/forecast.py"
anchor = "of forecasts from stale data before anyone noticed)."
see_also = ["scripts/run_daily.bat", "PLAN.md"]

[[question]]
id = "m11-q11"
kind = "mcq"
prompt = """
`run_healthcheck.bat` passes `--stale-hours 4`. `run_daily.bat` passes
`--stale-hours 26`. Same command, same check, two thresholds. Why?
"""
answer = """
Because one of them blocks the product and the other only notifies, so a false
positive costs a different amount in each.

The health check is an alarm. Its cost when wrong is one console window and one
red task, so it can sit tight at 4 hours and catch a stall within a single missed
run or two. The daily gate is a hard block on the day's forecasts and
recommendations. Its cost when wrong is a day of missing output, so it is set at 26
hours: past a full day plus scheduling slack, which means a couple of missed hourly
runs never cancels a forecast, while a genuinely dead pipeline still fails on the
second morning.

That is the generalizable rule. Thresholds are not properties of the data, they are
properties of what happens when they fire. The same measurement gets a different
threshold at a notify seam and at a block seam, and a system with only one
threshold for both is either alarming too late or blocking too eagerly.
"""
options = [
  { text = "The 4h check only notifies while the 26h check blocks output, so each is tuned to the cost of firing wrongly", correct = true },
  { text = "26 mirrors ForecastStage's max_data_age_hours default, so there is really only one threshold and the bat just repeats it", note = "The two do match on purpose, and that consistency is deliberate, but it explains why the two seams agree rather than why the number is 26 and not 4. The health check reads the same field family with a different threshold, which proves the number is a policy choice, not a fixed property." },
  { text = "check-data-health can only apply one threshold per invocation, so the daily gate reuses the loosest value it can", note = "--stale-hours is a parameter, and run_daily.bat passes 26 explicitly. Nothing forces the choice; it is a decision about what should block a forecast." },
  { text = "26 hours is chosen to match the 30-hour durable backup staleness threshold used by the health check", note = "Different check and different job. 30h spans a daily 07:30 backup task plus slack; 26h spans a 24-hour forecast cycle plus slack. They are both 'one cycle plus grace' for two different cycles." },
]
source = "scripts/run_daily.bat"
anchor = "check-data-health --stale-hours 26"

[[question]]
id = "m11-q12"
kind = "predict"
prompt = """
The WoWForecaster-Backup scheduled task is accidentally disabled and stops running.
Everything else stays healthy: ingestion runs hourly, forecasts run daily.

What goes red, and when?
"""
answer = """
Only the 6-hourly health check, and only once the newest `durable_*.db.gz` passes
30 hours old. The daily forecast keeps running normally.

The wiring: `collect_health_report` runs the backup check only when a `backup_dir`
is supplied, and the CLI supplies one only when `--backup-stale-hours` is greater
than 0. `run_healthcheck.bat` passes 30. `run_daily.bat` passes nothing, so
`backup_checked` stays False there and the backup fields are inert.

That split is intentional. `backup_is_stale` joins `has_failures`, which is the
single source for the exit code, so if the daily gate opted into the backup check
a missed backup would cancel that day's forecasts. A missing backup is a real
problem and a reason to raise the alert window; it is not a reason to stop
producing forecasts. Opt-in per caller is how one shared report serves both a notify
seam and a block seam without the block seam inheriting every future check.

Note the threshold too: 30 hours, not 24. The task runs daily at 07:30, so 24 would
alarm on ordinary scheduling slack.
"""
options = [
  { text = "The 6-hourly health check exits 1 and raises the alert window once the newest backup passes 30 hours; the daily forecast is unaffected", correct = true },
  { text = "Both go red, because backup_is_stale feeds has_failures and has_failures drives the exit code everywhere", note = "backup_is_stale does feed has_failures, but it can only become True when a backup_dir was passed, and the CLI passes one only when --backup-stale-hours > 0. run_daily.bat does not pass it, so the field stays False on that path." },
  { text = "Nothing goes red, because an absent or empty backup directory is treated as 'nothing to check' rather than a failure", note = "Inverted. No backup at all sets backup_is_stale = True on purpose: the whole point is catching a task that silently stopped, so absence is the worst case rather than an exemption. That is the dead-man principle applied to backups." },
  { text = "The health check goes red at the next firing after the missed 07:30 run, since the backup is then overdue", note = "The threshold is 30 hours, not 24, precisely so a late or slipped run does not alarm. It goes red after a full day is genuinely missed." },
]
source = "wow_forecaster/reporting/health.py"
anchor = "a stale backup can never affect the exit code of a"

[[question]]
id = "m11-q13"
kind = "recall"
prompt = """
The forecast pipeline ran daily for three months on data that stopped moving, and
never raised. Explain the mechanism, then state the rule the postmortem draws from
it.
"""
rubric = [
  "The daily aggregation builds a date spine clamped to the actual data extent",
  "Dates outside the extent produce rows with obs_count = 0 and None price fields rather than an error",
  "So training and inference kept operating on the frozen window as a legitimate, if empty, series",
  "The rule: a pipeline that clamps to the newest data cannot tell fresh from frozen, so freshness must be checked against the clock, not against the data",
]
answer = """
The date spine is generated in Python and clamped to the data extent. Ask for a
range that reaches past the newest observation and you do not get an error, you get
rows with `obs_count = 0` and None prices. Lag and rolling features over those rows
return None rather than fabricating values, which is correct behavior in isolation
and was verified on day one of the restore. Everything downstream then treated a
dead series as a sparse one.

This is why the pipeline could not self-diagnose. Every component was doing the
right thing with the data it was given, and no component was positioned to ask
whether the data should have been newer. The system's internal consistency was
intact throughout the outage. Consistency is not liveness.

The rule the postmortem states: a pipeline that clamps to the newest data cannot
tell fresh from frozen, so freshness has to be checked against the clock, not
against the data. Any check derived only from the contents of the store will agree
with a store that stopped growing. Something has to compare a timestamp to now, and
that comparison has to live somewhere that runs whether or not new data arrived.

The generalizable version, which applies far outside this repo: monitor the arrival
process, not just the arrived data. Row counts, null rates, and distribution checks
all look fine on a table nobody is writing to.
"""
source = "docs/postmortem-2026-04-lock-outage.md"
anchor = "Freshness has to be checked against the clock, not the data."
see_also = ["wow_forecaster/features/daily_agg.py"]

# ── Reading the record critically ─────────────────────────────────────────────

[[question]]
id = "m11-q14"
kind = "find"
prompt = """
Open the postmortem's timeline and compare its first two rows against the data
impact section. Something does not reconcile. Find it and say what the document
does and does not establish.
"""
rubric = [
  "Row one dates the last successful hourly ingest to 2026-04-07; row two dates the lock-leaking crash to 2026-04-15 07:16:01",
  "The data impact section dates the permanent loss from 2026-04-08, which lines up with row one and not with row two",
  "The document never explains what happened during those eight days: the root cause chain accounts for the wedge, not for the period before it",
  "The honest conclusion is to say the wedge explains the 96 days it names and the eight days before are unexplained, rather than back-filling a cause",
]
answer = """
The timeline says the last successful hourly ingest was 2026-04-07 and the crash
that leaked the lock was 2026-04-15 07:16:01. The data impact section dates the
permanent loss from 2026-04-08. So by the document's own numbers, ingestion had
already stopped delivering roughly eight days before the wedge began, and the
root cause chain does not cover that period. `docs/ROADMAP.md` repeats the same two
dates without reconciling them either.

There are ordinary explanations available (the machine was off, runs were failing
for an unrelated reason, or the crashed run of 04-15 was the last of a series). The
point of the question is that none of them are in the record, so none of them are
findings. A postmortem's job is to make the chain checkable, and the checkable part
here is the 96 days from the wedge forward.

Two things to take away. First, read a postmortem the way you read a result: the
timeline and the impact section are two measurements of the same event, and where
they disagree you have found the edge of what was actually established. Second, when
you write one, treat an unexplained interval as a finding of its own rather than
smoothing it into the narrative. Writing "we do not know what happened between the
7th and the 15th" costs one line and preserves the reader's ability to trust
everything else in the document.
"""
source = "docs/postmortem-2026-04-lock-outage.md"
anchor = "Last successful hourly ingest."
see_also = ["docs/ROADMAP.md"]

[[question]]
id = "m11-q15"
kind = "mcq"
prompt = """
Replay 2026-04-15 against today's code. The lock leaks at 07:16. Which guard goes
red first?
"""
answer = """
The scheduled health check. It runs every 6 hours anchored at 00:45, and it passes
`--stale-hours 4`, so at 12:45 the last ingest is over five hours old, `is_stale`
is True, `has_failures` is True, the command exits 1, and the bat writes
`health_alert.json` and raises the red console window. The lock-age sentinel joins
it: at 180 minutes of lock age the check also reports STALE LOCK, which points at
the actual cause rather than just the symptom.

The daily gate is second, and later than most people guess. The daily task runs at
07:00, so at the first firing after the wedge the newest observation is roughly 24.7
hours old, under the 26-hour threshold. It passes. It fails the following morning at
around 48 hours. That is the gate working as designed: it is deliberately loose
enough that a couple of missed hourly runs do not cancel a day's forecasts, which is
exactly why it is not the primary alarm.
"""
options = [
  { text = "The scheduled health check, at the first 6-hourly firing more than 4 hours after the last ingest", correct = true },
  { text = "The daily forecast freshness gate, at the next 07:00 run", note = "It passes that morning. The last ingest is about 24.7 hours old and the gate's threshold is 26 hours, so it fails on the second morning, not the first. That looseness is intentional: the gate blocks output, so it is tuned not to fire on ordinary slack." },
  { text = "The cloud capture gap guard, once the trailing 24 hours drops below 20 distinct captured hours", note = "The cloud guard watches an independent capture stream running on GitHub Actions. A wedged lock on the desktop does not reduce cloud coverage at all, so the guard stays green. It backstops data loss, not desktop wedging, which is precisely why both exist." },
  { text = "The retention sentinel, once the pruner stops deleting rows past the 30-day window", note = "It does eventually fire, but not on day one. The threshold is a 32-day age on the oldest surviving raw row (retention_days 30 plus 2 days of grace), and at the wedge that row is already about 30 days old because the pruner has been trimming to the boundary every hour. So it crosses the line a little over two days after the wedge, not 32 days later. Correct signal, still too slow for a day-one catch." },
]
source = "scripts/setup_tasks.bat"
anchor = "the 06:45 run finishes before the 07:00 daily task starts."
see_also = ["scripts/run_healthcheck.bat"]

[[question]]
id = "m11-q16"
kind = "recall"
prompt = """
When the outage was discovered, the lock was deliberately left in place for over a
week. Why, and what general rule does the postmortem draw from it?
"""
rubric = [
  "The retention pruner runs as orchestrator step 7 after every successful ingest and deletes raw rows past 30 days",
  "By discovery, every surviving raw row was past the window, so the first resumed run would have mass-deleted the only in-database history",
  "The wedged lock was the only thing preventing that, so it was left in place while a restore runbook was written and the hardening landed first",
  "The rule: before un-wedging a long-stalled pipeline, check what its first resumed run will do to accumulated state",
]
answer = """
The pruner deletes raw observations older than the retention window on every
successful hourly run, as step 7 of the orchestrator. That is correct behavior and
required by the API Terms of Service. But by 2026-07-12 the newest surviving raw
row was three months old, so the very first resumed run would have deleted
essentially everything that was left, and the retention rule would have been
enforced against a table that no longer had a replacement source. The outage was
protecting the data from the cleanup job.

So the sequence became: leave the lock, write a runbook, land the hardening
(takeover, freshness gate, scheduled health check, sentinels, task registration,
wake-to-run, cloud capture) between 07-15 and 07-20, then execute the restore with
evidence captured first.

The rule generalizes past retention. Anything that runs on a schedule and acts on
age or on accumulated state is loaded while the pipeline is stopped: retention
jobs, compactions, log rotations, migrations pending on the next start, TTL
expiries, queue drains. The instinct on finding a stalled pipeline is to restart it
immediately. The right first move is to enumerate what the first resumed run will
do, because a stalled system is often in a state its own maintenance jobs were
never designed to see.
"""
source = "docs/postmortem-2026-04-lock-outage.md"
anchor = "The outage was protecting the data from the cleanup job."
see_also = ["wow_forecaster/governance/pruner.py"]

# ── Failure semantics in the health layer ────────────────────────────────────

[[question]]
id = "m11-q17"
kind = "recall"
prompt = """
`HealthReport.has_failures` is a single property that ORs several checks. Describe
what it feeds, what the formatter does with a failure that is not staleness, and
why a missing lock file is treated as healthy while an unverifiable suppression
flag in `run_healthcheck.bat` is treated as a failure.
"""
rubric = [
  "has_failures ORs is_stale, lock_is_stale, retention_violation, and backup_is_stale, and is the single source for the CLI exit code",
  "The formatter is three-way: [STALE] for stale data, [UNHEALTHY] for a non-staleness failure, [HEALTHY] otherwise",
  "A missing lock file is the normal between-runs state, so the OSError path passes rather than failing",
  "An unverifiable suppression flag is different: the failure has already been detected and the only question is whether to alert, so uncertainty resolves toward alerting",
]
answer = """
`has_failures` ORs four conditions and is the single thing the CLI consults before
exiting 1. That matters more than it looks: every alert surface downstream
(`run_daily.bat`, `run_healthcheck.bat`, the alert JSON, the console window) keys
off one exit code, so adding a fifth check means changing one property rather than
five call sites. The failure they were guarding against is a check that exists and
does not reach the exit code, which is what "monitoring that is not scheduled is
documentation" says at the task level.

The formatter is three-way on purpose. `[STALE]` keeps its original meaning of data
being too old. A wedged lock or a dead pruner with fresh data reports `[UNHEALTHY]`
instead, so the label does not lie about which check failed while the exit code
stays the same.

Now the asymmetry, which is the interesting part. In `collect_health_report`, an
`OSError` while stat'ing the lock file passes silently, because no lock file is the
normal state between runs. That is not skip-on-uncertainty, it is the correct
reading of an unambiguous condition: absence of a lock means no run is holding one.

In `run_healthcheck.bat` the suppression flag is different. By the time that code
runs, a failure has already been detected. The only open question is whether an
alert window was raised recently enough to suppress this one. An unverifiable flag
there means "I do not know whether you have been told", and the answer to that is
to tell you. Worst case is one extra console window.

The rule is not "always fail on uncertainty". It is: work out what the uncertain
branch costs in each direction, and let the cheap mistake win. The lock check's
uncertain branch is cheap to pass. The alert check's uncertain branch is cheap to
raise. Both follow the same reasoning to different conclusions.
"""
source = "wow_forecaster/reporting/health.py"
anchor = "True when any check failed — the single source for the exit code."
see_also = ["scripts/run_healthcheck.bat", "docs/postmortem-2026-04-lock-outage.md"]

[[question]]
id = "m11-q18"
kind = "mcq"
prompt = """
`_classify_error_drift(mae_ratio)` maps a ratio to a `DriftLevel`, and its
docstring says `None → NONE (can't detect)`. What is wrong with that, in the
vocabulary of this module?
"""
answer = """
It is a floor the failure mode can satisfy. "I cannot compute a ratio" and "the
model is not drifting" both report `DriftLevel.NONE`, so a drift detector that has
lost its baseline entirely is indistinguishable from a drift detector that is
watching a healthy model.

The condition is not hypothetical. `baseline_mae` is averaged over
`backtest_fold_results` with no `model_name` filter and no staleness check, and
backtest horizons are 1 and 3 while production forecasts 1, 7 and 28, so the 7d and
28d ratios can never be computed at all. Those two horizons permanently report "no
drift" while measuring nothing.

`monitoring/health.py` handles the same condition by returning `unknown`, which is
right. So the fix is not to invent anything: it is to make drift agree with health.
The reason to keep it in this module rather than the drift module is that the repo
already states the principle out loud for the cloud gap guard, keeps the floor at
20 on purpose so the failure mode cannot satisfy it, and then violates the same
principle in a different file. A stated principle only holds where somebody
remembered to apply it, which is an argument for turning principles into shared
helpers rather than shared prose.
"""
options = [
  { text = "'Cannot compute' and 'no drift' produce the same value, so a detector with no baseline reports healthy: the failure mode satisfies the alarm", correct = true },
  { text = "None should map to CRITICAL, since an uncomputable ratio means the model has failed", note = "Overcorrecting turns every cold start and every fresh database into a critical alert, and an alarm that is red on day one gets muted. The right value is a third state meaning unknown, which is what monitoring/health.py already returns." },
  { text = "The real defect is the missing model_name filter on baseline_mae, not the None mapping", note = "The pooled baseline is a genuine defect and it is why the ratio is often meaningless, but it is a separate one. Even with a perfect baseline, mapping an uncomputable ratio to NONE would still hide the case where the baseline goes missing." },
  { text = "Nothing is wrong: returning NONE is conservative, since reporting drift without evidence would be a false positive", note = "That framing treats 'no alarm' as the safe default, which is the assumption this whole module argues against. The safe default is the state that cannot be reached by the failure you are watching for, and silence is reachable by a dead detector." },
]
source = "wow_forecaster/monitoring/drift.py"
anchor = "None → NONE (can't detect)."
see_also = ["PLAN.md", "docs/cloud-capture.md"]
