[[question]]
id = "m19-q13"
kind = "recall"
prompt = """
OD-3 says a serving layer here has two endpoints with different semantics, and
that one thing it will NOT offer should be stated plainly rather than faked. What
are the two endpoints, and what is the honestly-excluded capability and why?
"""
rubric = [
  "A read path serving already-computed forecasts and recommendations out of forecast_outputs",
  "A /predict path taking a 40-column feature vector directly against the pickled booster, demonstrating the model contract",
  "Real-time prediction from raw market state is NOT offered",
  "Because the feature vector comes from a batch-built Parquet and there is no online feature path, so /predict is a feature-vector echo, not live inference",
]
answer = """
Two endpoints:

1. A read path. Serve already-computed forecasts and recommendations straight out
of forecast_outputs and recommendation_outputs. This is what anyone actually wants.

2. A /predict path. Take a 40-column feature vector and run it against the pickled
booster. This demonstrates the model contract, and an OpenAPI schema for it is a
better statement of the feature contract than the prose list.

What is not offered: real-time prediction from raw market state. The feature
vector /predict consumes is built by the batch dataset builder from a Parquet, and
there is no online feature store to assemble one on demand. So /predict echoes a
feature contract; it does not turn "the current auction house" into a forecast.
PLAN.md says to state that plainly rather than fake it, and the CEILING lists an
online feature store as what would make /predict genuinely meaningful. Naming the
boundary is the honest move, and it reads better than a demo that pretends the
boundary is not there.
"""
source = "PLAN.md"
anchor = "### OD-3: Serving and deployment target. Recommend FastAPI in the pipeline image."

