[[question]]
id = "m19-q07"
kind = "mcq"
prompt = """
PLAN.md labels the retraining trigger "Absent as designed." What does the system
actually do about retraining today?
"""
answer = """
It retrains every model from scratch every day via run-daily-forecast, regardless
of whether anything drifted, and _register_model promotes the newly trained model
unconditionally. There is no champion-challenger comparison and no promotion gate:
the new model becomes active because it is new, not because it is better.

The config flag auto_retrain_on_critical exists and is off, but it is never even
read (see the config question). "Absent as designed" is the honest label: the
absence is not an oversight to hide, it is a described state with a named fix
(Phase 5's promotion gate).
"""
options = [
  { text = "Retrains from scratch daily regardless of need, and promotes the new model unconditionally with no gate", correct = true },
  { text = "Retrains only when drift is detected, gated by auto_retrain_on_critical", note = "auto_retrain_on_critical is defined but never read, and retraining runs unconditionally every day through run-daily-forecast, not on a drift trigger." },
  { text = "Retrains daily but keeps the incumbent until a validation comparison passes", note = "There is no comparison. _register_model promotes the new model unconditionally; the incumbent's is_active is flipped to 0 without any check that the new one is better." },
  { text = "Never retrains automatically; a human runs train-model by hand", note = "run-daily-forecast trains as part of the daily pipeline, so retraining is automatic and daily. What is absent is the trigger logic and the promotion gate, not the training itself." },
]
source = "PLAN.md"
anchor = "Retrains from scratch daily regardless of need"

[[question]]
id = "m19-q08"
kind = "predict"
prompt = """
An operator sets auto_retrain_on_critical = true in config, expecting that a
CRITICAL drift reading will now trigger an automatic retrain. Drift then reads
CRITICAL on the next run. What happens?
"""
answer = """
Nothing new. The flag config.forecast.auto_retrain_on_critical is defined in
config.py and set in default.toml, but no code path reads it. The adaptive policy
that could act on drift, evaluate_policy() in monitoring/adaptive.py, is called
from drift.py as evaluate_policy(overall) with allow_auto_retrain left at its
default False, and it is never handed the config flag. Even the retrain_recommended
field it produces is only stored on DriftCheckResult; nothing consumes it to launch
a training run.

So flipping the flag changes no behavior. The daily unconditional retrain still
runs as it always did, and the CRITICAL reading widens the CI multiplier and gets
recorded, but no drift-triggered retrain fires. This is the concrete meaning of
"the config flag exists and is off": off and unwired are indistinguishable here,
because the wire was never run.
"""
options = [
  { text = "Nothing changes: no code reads auto_retrain_on_critical, and evaluate_policy is called with allow_auto_retrain defaulting to False", correct = true },
  { text = "The next run skips the scheduled retrain and instead triggers an on-demand critical retrain", note = "There is no on-demand retrain path wired to this flag. The daily retrain runs regardless, and the flag is never read, so no branch changes." },
  { text = "evaluate_policy returns retrain_recommended = True and the pipeline retrains immediately", note = "evaluate_policy is called with the default allow_auto_retrain = False, so it will not set auto retrain to True; and even retrain_recommended is only stored on DriftCheckResult, never acted on." },
  { text = "The forecast run raises because the flag has no handler registered", note = "Unread config is not a runtime error. Pydantic loads it into the model and it simply sits there unconsulted; nothing raises." },
]
source = "wow_forecaster/config.py"
anchor = "auto_retrain_on_critical: bool = False"

[[question]]
id = "m19-q09"
kind = "find"
prompt = """
Find the two functions that pick "the latest model" by inspecting files on disk.
For each, name the sort key it uses, and explain why two functions doing the same
job with different keys is the smell this module is about.
"""
rubric = [
  "find_latest_model_artifact() in ml/trainer.py sorts the .pkl glob by p.stat().st_mtime, reverse=True",
  "report-feature-importance in cli.py sorts the glob and takes candidates[-1], relying on the ISO date filename suffix (lexicographic = chronological)",
  "One ranks by filesystem modification time, the other by the date string in the filename: different keys, same intent",
  "They usually agree by coincidence (a fresh train is both newest mtime and latest date), so the divergence is invisible until a file is touched out of band, and neither consults is_active",
]
answer = """
Two functions, two keys, one job:

find_latest_model_artifact() in ml/trainer.py sorts `artifact_dir.glob(...)` by
`p.stat().st_mtime` with reverse=True. This is the serving path's selector.

report-feature-importance in cli.py runs `sorted(art_dir.glob(...))` and takes
`candidates[-1]`, with the comment noting the ISO date suffix makes lexicographic
order chronological. This ranks by the date baked into the filename.

The smell is that two pieces of the same system independently decided what "the
latest model" means and picked different definitions, neither of which is the
registry's is_active. They agree as long as the newest file is also the
latest-dated file, which is true right after a normal train and false after any
copy, restore, or clock oddity. A concept as load-bearing as "which model is
current" implemented three incompatible ways, with the authoritative one unread,
is the same class of finding as M06's two-splits disagreement: visible in the
source without running anything.
"""
source = "wow_forecaster/cli.py"
anchor = "artifact_path = candidates[-1]  # ISO date suffix -> lexicographic = chronological"
see_also = ["wow_forecaster/ml/trainer.py"]

# ── The four open tool decisions ──────────────────────────────────────────────

[[question]]
id = "m19-q10"
kind = "recall"
prompt = """
PLAN.md opens with four OPEN DECISIONS, each a tool choice with a recommendation
argued from this codebase specifically. Name all four decisions and the tool each
one recommends.
"""
rubric = [
  "OD-1 Orchestrator: recommend Dagster",
  "OD-2 Experiment tracking and model registry: recommend MLflow with a local (SQLite) backend",
  "OD-3 Serving and deployment target: recommend FastAPI in the pipeline image",
  "OD-4 Infrastructure as code: recommend Terraform with the Cloudflare and GitHub providers",
]
answer = """
- OD-1 Orchestrator: Dagster. The pipeline is already a well-formed DAG with run
  tracking; an orchestrator buys retries, backfill, a non-Windows scheduler, and a
  lineage UI that reads to both the DS and the ops audience at once.
- OD-2 Experiment tracking and model registry: MLflow, local backend. The repo
  already runs SQLite so tracking is a file not a service, train_models() already
  computes what wants logging, and the registry's stage transitions replace the
  ignored is_active flag, fixing a live bug.
- OD-3 Serving and deployment target: FastAPI in the pipeline image. A read path
