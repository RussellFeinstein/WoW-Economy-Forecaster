# M19: The lifecycle gap.
#
# What is present and what is absent when this repo is read as a production
# system. The sharp example: three pieces of code select the active model three
# different ways, and the authoritative one (model_metadata.is_active) is the one
# nothing reads.
#
# Citation rule: `source` is a path, `anchor` is a verbatim single-line snippet
# from that path. Never a line number. tests/test_learning/test_bank_integrity.py
# fails if an anchor stops matching, so editing the cited code forces the
# question to be updated in the same PR. Run `wowfc learn validate` while
# authoring. Prose anchors (PLAN.md, docstrings) age better than code lines.

# ── Three ways to pick a model ────────────────────────────────────────────────

[[question]]
id = "m19-q01"
kind = "recall"
prompt = """
This repo selects "the model to use" in three separate places, and they do not
share a source of truth. Name all three selection strategies, say where each
one lives, and say which one is authoritative (should win) and why.
"""
rubric = [
  "Serving path (pipeline/forecast.py -> find_latest_model_artifact): globs the .pkl files and sorts by filesystem st_mtime",
  "report-feature-importance in cli.py: sorts the glob and takes candidates[-1], relying on the ISO date suffix so lexicographic == chronological",
  "model_metadata.is_active: a DB flag set by trainer._register_model, and it is the authoritative one",
  "is_active should win because it is a deliberate registry decision the training step records, whereas mtime and filename ordering are incidental properties of files on disk",
  "The defect: nothing reads is_active for serving, so the authoritative strategy is the unused one",
]
answer = """
Three strategies, no shared authority:

1. The serving path. ForecastStage calls find_latest_model_artifact(), which
globs `lgbm_{h}d_{realm}_*.pkl` and sorts by `p.stat().st_mtime`, newest first.
The chosen model is whichever .pkl was most recently touched on disk.

2. report-feature-importance in cli.py globs the same pattern, sorts the paths,
and takes `candidates[-1]` with the comment "ISO date suffix -> lexicographic =
chronological." This ranks by the date embedded in the filename, not by mtime.

3. model_metadata.is_active. trainer._register_model() flips the previous row's
is_active to 0 and inserts the new row with is_active = 1. That is the registry
recording an explicit decision about which model is current.

is_active is the one that should win. It is a decision the training step commits
on purpose, with the artifact_path and validation metrics attached. mtime and
lexicographic filename order are accidental: a file copy, a restore, a rollback,
or a clock skew changes them without any intent behind it. The finding of this
module is that the authoritative strategy is exactly the one nothing reads back.
The two paths that do run rank files by side effects of the filesystem.
"""
source = "wow_forecaster/ml/trainer.py"
anchor = "artifact_dir.glob(f\"lgbm_{horizon_days}d_{realm_slug}_*.pkl\"),"
see_also = ["PLAN.md"]

[[question]]
id = "m19-q02"
kind = "mcq"
prompt = """
model_metadata already carries slug, version, hyperparameters, training date
range, validation MAE and RMSE, artifact_path, and is_active. PLAN.md calls this
table "Partial and unused." What makes it unused rather than merely partial?
"""
answer = """
The table is written on every training run and never read back on the serving
path. trainer._register_model() populates every column including is_active, but
ForecastStage loads its model by globbing the artifact directory and sorting by
mtime, so the registry's is_active decision is dead weight. It is a registry that
records the right answer and is never consulted for it.

That is why OD-2 argues an MLflow registry "fixes a live bug rather than adding
ceremony": wiring stage transitions (or just is_active) into the serving path
does not add a feature, it connects a decision that is already being recorded to
the one place that needs it.
"""
options = [
  { text = "Every column including is_active is written on each training run, but the serving path ignores it and globs by mtime instead", correct = true },
  { text = "The table is missing the columns a registry needs, so serving cannot rely on it", note = "It has the columns: slug, version, hyperparameters, training range, validation MAE/RMSE, artifact_path, is_active. Completeness is not the problem; nothing reading it is." },
  { text = "is_active is always 1 for every row, so it cannot identify a single active model", note = "_register_model sets prior rows to is_active = 0 before inserting the new one at 1, so it does identify a single active model per horizon+realm. The flag is correct; it is simply never queried by the serving path." },
  { text = "The table is populated only in tests, never during real training runs", note = "train_models() calls _register_model on every horizon it trains, in production runs. The writes are real. The reads for serving are what is missing." },
]
source = "PLAN.md"
anchor = "Serving ignores it and globs by mtime"

[[question]]
id = "m19-q03"
kind = "predict"
prompt = """
The artifact directory for realm us, horizon 7d, holds two files:

  lgbm_7d_us_2026-07-20.pkl   (mtime touched last, because it was copied back
                               during a manual rollback this morning)
  lgbm_7d_us_2026-07-22.pkl   (trained normally two days ago, untouched since)

ForecastStage serves via find_latest_model_artifact(). report-feature-importance
in cli.py picks candidates[-1]. Which file does each choose?
"""
answer = """
They disagree, which is the whole point.

find_latest_model_artifact sorts by st_mtime, newest first, so ForecastStage
serves lgbm_7d_us_2026-07-20.pkl: the rolled-back file whose mtime was refreshed
by the copy this morning.

report-feature-importance sorts the glob lexicographically and takes the last
element, so it inspects lgbm_7d_us_2026-07-22.pkl: the filename with the later ISO
date, regardless of mtime.

So the model you serve forecasts from and the model whose feature importance you
report are two different boosters. Neither path consults model_metadata.is_active,
which is where the intended answer actually lives. Ordinarily the two agree
because a fresh train writes a new-dated file that is also the newest mtime, so
the disagreement only surfaces under out-of-band file manipulation. That is
exactly the case a portfolio reviewer would probe.
"""
options = [
  { text = "Serving picks the 07-20 file (newest mtime); the report picks the 07-22 file (lexicographically last)", correct = true },
  { text = "Both pick the 07-22 file, because it has the later date in its name", note = "Only cli.py ranks by the filename date. find_latest_model_artifact ranks by st_mtime, and the 07-20 file was touched most recently, so serving picks it." },
  { text = "Both pick the 07-20 file, because the rollback made it current", note = "The rollback changed only the mtime. cli.py ignores mtime and sorts filenames lexicographically, so it still picks the 07-22 file. The two paths use different keys and diverge here." },
  { text = "Serving raises because two artifacts match the same realm and horizon", note = "Neither path errors on multiple matches; both sort and take one. The design assumes the sort resolves it, which is exactly the unstated coupling to filesystem state this module is about." },
]
source = "wow_forecaster/ml/trainer.py"
anchor = "key=lambda p: p.stat().st_mtime,"

[[question]]
id = "m19-q04"
kind = "find"
prompt = """
Find where is_active is written and confirm that nothing reads it to select a
model for serving. Name the writer, name the one column-comment that states its
intent, and say what the serving path does instead.
"""
rubric = [
  "trainer._register_model() writes it: UPDATE model_metadata SET is_active = 0 ... then INSERT ... is_active = 1",
  "models/meta.py documents intent: 'is_active: Whether this model is the currently active production model.'",
  "A grep for is_active shows only writes (trainer, forecast_repo insert) and the schema/model definitions, no SELECT WHERE is_active for serving",
  "ForecastStage serves via find_latest_model_artifact(), which globs and sorts by st_mtime, so the documented production flag is never consulted",
]
answer = """
The writer is trainer._register_model(). It runs
`UPDATE model_metadata SET is_active = 0 WHERE slug LIKE ? AND is_active = 1`,
then inserts the new row with `is_active` = 1 (and ON CONFLICT sets it back to 1).
forecast_repo also serializes `int(model.is_active)` on insert. Those are the only
writers.

The intent is stated in models/meta.py: "is_active: Whether this model is the
currently active production model." That is a promise the serving path does not
keep. Grep is_active across wow_forecaster/ and you find writes and definitions
only, never a `SELECT ... WHERE is_active = 1` feeding inference. ForecastStage
loads its model through find_latest_model_artifact(), an mtime glob. The flag that
says "this is the production model" is written truthfully and read by nobody who
serves.
"""
source = "wow_forecaster/models/meta.py"
anchor = "is_active: Whether this model is the currently active production model."
see_also = ["wow_forecaster/ml/trainer.py", "PLAN.md"]

# ── What is built vs what is missing ──────────────────────────────────────────

[[question]]
id = "m19-q05"
kind = "recall"
prompt = """
Read as a production system, this repo is a mix of strong, partial, absent, and
broken lifecycle pieces. Sort these six into the right bucket and give the
one-word or one-phrase reason PLAN.md attaches to each: pipeline health
monitoring, model serving, experiment tracking, prediction monitoring, model
registry, CI/CD.
"""
rubric = [
  "Pipeline health monitoring: present and strong (coverage, gaps, freshness, stale-lock and retention sentinels, dead-man alarm)",
  "CI/CD: present and decent (ruff + pytest on 3.11/3.12, PR-gated, branch protection, Dependabot automerge); missing coverage/image/publish",
  "Model serving and experiment tracking: both absent (no API of any kind; no run comparison, no param sweep history)",
  "Model registry: partial and unused (right columns, serving globs by mtime)",
  "Prediction monitoring: present but broken (the pooled drift baseline of DS-3)",
]
answer = """
Two strong, two absent, one partial-unused, one broken:

- Pipeline health monitoring: present and strong. Coverage and gap detection, a
  stale-lock sentinel, a retention sentinel, a scheduled health check with durable
  alerting, backup staleness, and a cloud gap guard doubling as a dead-man alarm.
- CI/CD: present and decent. ruff plus pytest on two Python versions, PR-gated,
  branch protection with no bypass actors, Dependabot automerge on green CI.
  Missing coverage reporting, image build, artifact publishing.
- Model serving: absent. No API of any kind.
- Experiment tracking: absent. No run comparison, no param sweep history.
- Model registry: partial and unused. The columns are right; serving ignores them.
- Prediction monitoring: present but broken. The drift baseline pools all four
  baselines from whatever backtest ran last and returns NONE when it cannot
  compute, which reads as "no drift" (DS-3).

The habit worth taking from this: "present" is not one bucket. A portfolio audit
has to separate built-and-working from built-and-unused from built-and-broken,
because the second and third are the ones a reviewer catches and you did not.
"""
source = "PLAN.md"
anchor = "| Prediction monitoring | **Present but broken.** See DS-3 |"

