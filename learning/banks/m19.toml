- OD-4 Infrastructure as code: Terraform, Cloudflare and GitHub providers. Scoped
  to infrastructure that already exists: two R2 buckets, the Worker and its cron,
  GitHub secrets, and the branch protection ruleset, roughly 100 lines.

The through-line is that every recommendation is argued from what the repo already
has, not from a generic best-practices list. Each also carries a "what would change
my mind," which is the tell of a real decision rather than a preference.
"""
source = "PLAN.md"
anchor = "### OD-1: Orchestrator. Recommend Dagster."
see_also = ["PLAN.md"]

