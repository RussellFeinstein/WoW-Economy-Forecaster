# ── The one blocking coupling ─────────────────────────────────────────────────

[[question]]
id = "m19-q15"
kind = "recall"
prompt = """
The coupling section lists five items but names exactly one as blocking. Which
one, and why does it gate the whole MLOps story rather than being one problem
among five?
"""
rubric = [
  "The .bat wrappers and Windows Task Scheduler ARE the orchestration layer",
  "It gates containers, serving, IaC, and any claim that this runs in production",
  "Because it is Windows-only, an MLOps reader cannot run any of the pipeline",
  "The other four (dashboard hardcoding, mtime model selection, cli.py size, non-injectable clocks) are real but not blocking; some are explicitly 'note it, do not schedule it'",
]
answer = """
The blocking item is that .bat and Task Scheduler are the orchestration layer.
The daily and hourly pipeline runs are driven by Windows batch wrappers and four
Task Scheduler tasks. That is not a rough edge next to the real orchestrator, it
is the orchestrator.

It gates everything downstream: containers, serving, infrastructure as code, and
any claim that this runs in production. And it is Windows-only, so an MLOps
reviewer cannot execute a single pipeline run without a Windows box, which is why
Phase 2 (portability) is the unblock that everything after it depends on.

The other four items are real and not blocking. The dashboard hardcodes realms
and paths (that is the broken-demo bug), model selection globs by mtime, cli.py is
4,508 lines, and about 20 modules have non-injectable clocks. PLAN.md explicitly
says of cli.py's size "note it, do not schedule it," and treats the clocks as
opportunistic, because the stage classes are already importable without Typer.
Distinguishing the one coupling that blocks from the four that annoy is the point:
a portfolio triage that treats all coupling as equally urgent never ships the
unblock.
